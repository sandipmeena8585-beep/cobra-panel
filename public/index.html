<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>COBRA PANEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;background:#071226;color:white;font-family:sans-serif;}
.container{max-width:420px;margin:auto;padding:20px;}
.card{background:#0f1c2e;padding:20px;border-radius:20px;}
select,input{width:100%;padding:14px;margin:10px 0;border-radius:12px;border:none;}
button{width:100%;padding:15px;border:none;border-radius:12px;background:#00f2ff;}
.hidden{display:none;}
</style>
</head>

<body>
<div class="container">
<div class="card">

<h2>BGMI PANEL</h2>

<select id="plan">
<option value="1hour">1 Hour</option>
<option value="3hour">3 Hour</option>
<option value="1day">1 Day</option>
<option value="3day">3 Day</option>
<option value="7day">7 Day</option>
</select>

<button onclick="startBuy()">BUY</button>

<div id="payment" class="hidden">

<p>UPI: godxcobra@axl</p>

<select id="method" onchange="changeMethod()">
<option value="utr">UTR</option>
<option value="qr">QR</option>
</select>

<input id="utr" placeholder="Enter UTR">
<input type="file" id="file" class="hidden">

<button onclick="submit()">Submit</button>

<div id="status"></div>

</div>

</div>
</div>

<script>

let selectedPlan="";
let checkInterval;

window.onload=function(){
  let saved=localStorage.getItem("utr");
  if(saved){
    document.getElementById("payment").classList.remove("hidden");
    checkStatus(saved);
  }
};

function startBuy(){
  selectedPlan=document.getElementById("plan").value;
  document.getElementById("payment").classList.remove("hidden");
}

function changeMethod(){
  let m=document.getElementById("method").value;
  document.getElementById("utr").style.display=m=="utr"?"block":"none";
  document.getElementById("file").style.display=m=="qr"?"block":"block":"none";
}

async function submit(){

  let utr=document.getElementById("utr").value||Date.now().toString();
  let file=document.getElementById("file").files[0];

  let form=new FormData();
  form.append("plan",selectedPlan);
  form.append("utr",utr);
  if(file) form.append("file",file);

  let res=await fetch("/buy",{method:"POST",body:form});
  let d=await res.json();

  if(d.risk==="high"){
    alert("⚠️ Suspicious payment");
  }

  localStorage.setItem("utr",utr);

  checkStatus(utr);
}

function checkStatus(utr){

  clearInterval(checkInterval);

  checkInterval=setInterval(async()=>{

    let res=await fetch("/status/"+utr);
    let data=await res.json();

    if(data.status=="approved"){
      clearInterval(checkInterval);
      localStorage.removeItem("utr");

      alert("KEY: "+data.key+"\nJoin: https://t.me/GODx_COBRA");
      location.reload();
    }

    if(data.status=="rejected"){
      clearInterval(checkInterval);
      localStorage.removeItem("utr");

      alert("Rejected");
      setTimeout(()=>location.reload(),30000);
    }

  },3000);
}

</script>
</body>
</html>
