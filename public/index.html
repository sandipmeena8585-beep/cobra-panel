<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA PANEL</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  background:linear-gradient(135deg,#071226,#0f1c2e);
  font-family:sans-serif;
  color:white;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card{
  background:#0f1c2e;
  border-radius:18px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 0 20px rgba(0,255,255,0.2);
}

h2{text-align:center;}

select,input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#00f2ff,#007bff);
  color:white;
}

.hidden{display:none;}

.status{
  text-align:center;
  margin-top:10px;
  color:#00f2ff;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h2>🎮 BGMI PANEL</h2>

<select id="plan">
<option value="">Select Plan</option>
<option value="1hour">1 Hour - ₹30</option>
<option value="3hour">3 Hour - ₹50</option>
<option value="1day">1 Day - ₹110</option>
<option value="3day">3 Day - ₹200</option>
<option value="7day">7 Day - ₹400</option>
</select>

<button id="buyBtn" onclick="startBuy()">BUY KEY</button>

<div id="payment" class="hidden">

<p style="text-align:center;">💰 UPI: <b>godxcobra@axl</b></p>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=godxcobra@axl" width="200">

<p id="planShow" style="text-align:center;"></p>

<select id="method" onchange="changeMethod()">
<option value="utr">Enter UTR ID</option>
<option value="qr">Upload Screenshot</option>
</select>

<input id="utr" placeholder="Enter UTR ID">
<input type="file" id="file" class="hidden">

<button id="submitBtn" onclick="submitPayment()">SUBMIT</button>

<p class="status" id="status"></p>

</div>

</div>

</div>

<script>

let selectedPlan="";
let interval;
let timerInterval;
let timeLeft=60;
let isSubmitting=false;

// START
function startBuy(){
  selectedPlan=document.getElementById("plan").value;
  if(!selectedPlan){ alert("Select Plan"); return; }

  document.getElementById("payment").classList.remove("hidden");
  document.getElementById("planShow").innerText="Selected: "+selectedPlan;
}

// METHOD
function changeMethod(){
  let m=document.getElementById("method").value;
  document.getElementById("utr").style.display=(m==="utr")?"block":"none";
  document.getElementById("file").style.display=(m==="qr")?"block":"none";
}

// TIMER
function startTimer(){

  clearInterval(timerInterval);
  timeLeft=60;

  document.getElementById("status").innerText="⏳ Please wait admin verify...";

  timerInterval=setInterval(()=>{
    timeLeft--;

    document.getElementById("status").innerText=
    "⏳ Please wait admin verify ("+timeLeft+"s)";

    if(timeLeft<=0){
      clearInterval(timerInterval);
      document.getElementById("status").innerText="⚠️ Still waiting for admin...";
    }

  },1000);
}

// SHOW KEY UI
function showKeyUI(key){

  document.getElementById("payment").innerHTML = `
    <h3 style="text-align:center;">✅ PAYMENT VERIFIED</h3>

    <div style="background:#071226;padding:15px;border-radius:12px;text-align:center;">

      <p>🔑 Your Key:</p>
      <h2 style="color:#00f2ff;">${key}</h2>

      <p>📅 Expiry: As per plan</p>

      <button onclick="window.open('https://t.me/GODx_COBRA')">
      📲 Join Telegram
      </button>

    </div>
  `;
}

// SUBMIT
async function submitPayment(){

  if(isSubmitting){
    alert("Already submitted");
    return;
  }

  let utr=document.getElementById("utr").value.trim();
  let file=document.getElementById("file").files[0];

  if(!selectedPlan){
    alert("Select Plan First");
    return;
  }

  if(!utr && !file){
    alert("Enter UTR or Upload Screenshot");
    return;
  }

  if(localStorage.getItem("utr")){
    alert("⚠️ Already submitted");
    return;
  }

  isSubmitting=true;

  let finalUTR = utr || Date.now().toString();

  let form=new FormData();
  form.append("plan",selectedPlan);
  form.append("utr",finalUTR);

  if(file) form.append("file",file);

  try{
    await fetch(window.location.origin+"/buy",{
      method:"POST",
      body:form
    });

    localStorage.setItem("utr",finalUTR);

    document.getElementById("submitBtn").disabled=true;

    startTimer();
    check(finalUTR);

  }catch{
    alert("Error");
    isSubmitting=false;
  }
}

// STATUS CHECK
function check(utr){

  clearInterval(interval);

  interval=setInterval(async()=>{

    let res=await fetch("/status/"+utr);
    let data=await res.json();

    if(data.status==="approved"){
      clearInterval(interval);
      clearInterval(timerInterval);

      localStorage.removeItem("utr");

      showKeyUI(data.key);
    }

    if(data.status==="rejected"){
      clearInterval(interval);
      clearInterval(timerInterval);

      localStorage.removeItem("utr");

      document.getElementById("status").innerText="❌ Payment Rejected";

      setTimeout(()=>location.reload(),3000);
    }

  },2000);
}

// RESUME
window.onload=()=>{
  let utr=localStorage.getItem("utr");

  if(utr){
    document.getElementById("payment").classList.remove("hidden");
    document.getElementById("submitBtn").disabled=true;

    startTimer();
    check(utr);
  }
};

</script>

</body>
</html>
