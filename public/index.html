<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>COBRA SERVER PANEL</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center}
.top{padding:15px;font-size:20px;color:#22c55e}
.card{background:#1e293b;margin:10px;padding:15px;border-radius:12px}

.buyBtn{
padding:14px;
color:white;
border:none;
border-radius:8px;
font-size:16px;
width:85%;
}

input,select{
padding:12px;
width:85%;
margin:10px auto;
border-radius:8px;
border:none;
display:block;
font-size:16px;
}

.overlay{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:linear-gradient(135deg,#ff512f,#dd2476);
 display:flex;justify-content:center;align-items:center;
}

.popup{
 background:#fff;color:#000;
 padding:20px;border-radius:14px;
 width:85%;max-width:320px;
 text-align:center;
}

.confirmBtn{background:#000;color:#fff}
.cancelBtn{background:#eee}

.loader{
 border:4px solid #ddd;
 border-top:4px solid #22c55e;
 border-radius:50%;
 width:40px;height:40px;margin:auto;
 animation:spin 1s linear infinite
}

@keyframes spin{to{transform:rotate(360deg)}}

.upi{
 font-family:monospace;
 font-size:16px;
 margin-top:-5px;
 margin-bottom:10px;
}

.gameSelect{
background:#020617;
color:#22c55e;
border:1px solid #22c55e;
}

</style>
</head>

<body>

<div class="top" id="topTitle">COBRA SERVER PANEL</div>
<div id="main"></div>

<script>

let themeColor="#22c55e";
let lastRefresh = 0;

// 🔥 LOAD CHECK
window.onload = ()=>{
 let savedUTR = localStorage.getItem("pendingUTR");
 if(savedUTR){
   showWaiting(savedUTR);
 }else{
   loadHome();
 }
};

// 🔥 STATUS + REFRESH FIX
function loadHome(){
 fetch("/status").then(r=>r.json()).then(d=>{

   // 🔥 ADMIN REFRESH → FORCE UNLOCK
   if(d.refresh && d.refresh != lastRefresh){
     lastRefresh = d.refresh;
     localStorage.removeItem("pendingUTR");
     location.reload();
     return;
   }

   if(!d.on){
     document.body.innerHTML="<h2>⚠️ PLEASE WAIT ADMIN UPDATE</h2>";
   }else{
     showMain();
   }
 });
}

// 🔥 HOME UI
function showMain(){

 fetch("/settings").then(r=>r.json()).then(s=>{
   themeColor = s.color || "#22c55e";
   document.getElementById("topTitle").innerText = s.title || "COBRA SERVER PANEL";
   document.getElementById("topTitle").style.color = themeColor;
 });

 fetch("/plans").then(r=>r.json()).then(plans=>{
 let opt = plans.map(p=>`<option value="${p.type+p.time}|${p.price}">
 ${p.type}${p.time} - ₹${p.price}</option>`).join("");

 main.innerHTML=`
 <div class="card">

 <h3>Select Game</h3>

 <!-- 🔥 ONLY BGMI -->
 <select class="gameSelect">
   <option>BGMI</option>
 </select>

 <h3>Select Plan</h3>
 <select id="planSel">${opt}</select>

 <button class="buyBtn" style="background:${themeColor}" onclick="goBuy()">BUY KEY</button>

 </div>`;
 });
}

function goBuy(){
 let val=document.getElementById("planSel").value.split("|");
 buy(val[0],val[1]);
}

// BUY
function buy(plan,price){
 fetch("/settings").then(r=>r.json()).then(s=>{
 main.innerHTML=`
 <div class="card">
 <h3>PAY ₹${price}</h3>

 <div class="upi">${s.upi}</div>

 ${s.qr ? `<img src="${s.qr}" width="160"><br>` : ""}

 <input id="utr" placeholder="UTR 12 digit">
 <button class="buyBtn" style="background:${themeColor}" onclick="confirmBox('${plan}','${price}')">VERIFY</button>
 </div>`;
 });
}

// CONFIRM
function confirmBox(plan,price){
 let utrVal=utr.value;
 if(!utrVal||utrVal.length!=12)return alert("Invalid UTR");

 document.body.innerHTML+=`
 <div class="overlay" id="pop">
 <div class="popup">
   <h3>Confirm the action</h3>
   <button class="confirmBtn" onclick="start('${plan}','${price}','${utrVal}')">Confirm</button>
   <button class="cancelBtn" onclick="location.reload()">Cancel</button>
 </div>
 </div>`;
}

// START
function start(plan,price,utrVal){

 localStorage.setItem("pendingUTR", utrVal);

 showWaiting(utrVal);

 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
    user:"USER_"+Date.now(),
    plan:plan,
    price:price,
    utr:utrVal
  })
 });
}

// WAIT
function showWaiting(utrVal){

 document.body.innerHTML=`
 <div class="overlay">
 <div class="popup">
 <div class="loader"></div>
 <p>Please wait admin verify</p>
 </div>
 </div>`;

 let chk=setInterval(()=>{
 fetch("/history").then(r=>r.json()).then(h=>{
 let f=h.find(x=>x.utr===utrVal);
 if(f){
 clearInterval(chk);

 if(f.status==="rejected"){
  localStorage.removeItem("pendingUTR");

  document.body.innerHTML=`
  <div class="overlay">
  <div class="popup">
  <h3>❌ PAYMENT REJECTED</h3>
  <button onclick="location.reload()">OK</button>
  </div>
  </div>`;
 }

 if(f.status==="approved"){
  localStorage.removeItem("pendingUTR");

  document.body.innerHTML=`
  <div class="overlay">
  <div class="popup">
  <h3>🔑 KEY</h3>
  <div>${f.key}</div>
  <button onclick="location.reload()">OK</button>
  </div>
  </div>`;
 }
 }
 });
 },2000);
}

// 🔥 AUTO CHECK REFRESH (LIVE)
setInterval(()=>{
 loadHome();
},3000);

</script>

</body>
</html>
