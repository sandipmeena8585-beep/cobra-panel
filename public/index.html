<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA PANEL</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#040b16;
  color:white;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card{
  border-radius:20px;
  padding:20px;
  margin-top:20px;
  background:#081426;
  box-shadow:0 0 20px rgba(0,255,255,0.15);
}

/* STEP 1 TITLE */
.title{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  margin-bottom:20px;
  color:#00f2ff;
  text-shadow:0 0 15px #00f2ff;
}

/* HEADER CENTER */
.centerTitle{
  text-align:center;
  font-size:18px;
  margin-bottom:20px;
  color:#00f2ff;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#00f2ff,#007bff);
  color:white;
  font-weight:bold;
}

/* INPUT */
select,input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:none;
  background:#0a1c33;
  color:white;
}

/* UPI */
.mono{
  background:#000;
  padding:14px;
  border-radius:10px;
  text-align:center;
  font-family:monospace;
  margin-top:10px;
  border:1px solid #00f2ff;
}

/* QR */
.qr{
  display:block;
  margin:auto;
  margin-top:20px;
}

/* STATUS */
.status{
  text-align:center;
  color:#00f2ff;
  margin-top:15px;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="container">

<!-- 🔥 STEP 1 -->
<div id="step1" class="card">

<div class="title">COBRA SERVER PANNEL</div>

<select id="plan">
<option value="">Select Plan</option>
<option value="1hour">1 Hour - ₹30</option>
<option value="3hour">3 Hour - ₹50</option>
<option value="1day">1 Day - ₹110</option>
<option value="3day">3 Day - ₹200</option>
<option value="7day">7 Day - ₹400</option>
</select>

<button onclick="goStep2()">BUY KEY</button>

</div>

<!-- 🔥 STEP 2 (PAYMENT) -->
<div id="step2" class="card hidden">

<div class="centerTitle">PAYMENT</div>

<div style="margin-top:20px;">

<div class="mono" onclick="copyUPI()">
UPI: godxcobra@axl
</div>

<img class="qr"
src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=upi://pay?pa=godxcobra@axl"
width="220">

</div>

<button style="margin-top:25px;" onclick="goStep3()">NEXT</button>

</div>

<!-- 🔥 STEP 3 (VERIFY) -->
<div id="step3" class="card hidden">

<div class="centerTitle">VERIFY PAYMENT</div>

<select id="method" onchange="changeMethod()">
<option value="utr">Enter UTR</option>
<option value="qr">Upload Screenshot</option>
</select>

<input id="utr" placeholder="Enter UTR">
<input type="file" id="file" class="hidden">

<button onclick="submitPayment()">SUBMIT</button>

<p id="status" class="status">⏳ Please wait admin verify...</p>

</div>

</div>

<script>

let selectedPlan="";
let interval;

// STEP 1 → 2
function goStep2(){

  selectedPlan=document.getElementById("plan").value;

  if(!selectedPlan){
    alert("Select Plan First");
    return;
  }

  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
}

// STEP 2 → 3
function goStep3(){
  document.getElementById("step2").classList.add("hidden");
  document.getElementById("step3").classList.remove("hidden");
}

// COPY
function copyUPI(){
  navigator.clipboard.writeText("godxcobra@axl");
  alert("UPI Copied");
}

// METHOD
function changeMethod(){
  let m=document.getElementById("method").value;
  document.getElementById("utr").style.display=(m==="utr")?"block":"none";
  document.getElementById("file").style.display=(m==="qr")?"block":"none";
}

// SUBMIT
async function submitPayment(){

  let utr=document.getElementById("utr").value.trim();
  let file=document.getElementById("file").files[0];

  if(!utr && !file){
    alert("Enter UTR or Upload Screenshot");
    return;
  }

  let finalUTR = utr || Date.now();

  let form=new FormData();
  form.append("plan",selectedPlan);
  form.append("utr",finalUTR);

  if(file) form.append("file",file);

  await fetch("/buy",{method:"POST",body:form});

  document.getElementById("status").innerText="⏳ Please wait admin verify...";

  check(finalUTR);
}

// STATUS CHECK
function check(utr){

  clearInterval(interval);

  interval=setInterval(async()=>{

    let res=await fetch("/status/"+utr);
    let d=await res.json();

    if(d.status==="approved"){
      clearInterval(interval);

      document.getElementById("step3").innerHTML=`
      <h3 style="text-align:center;color:#00f2ff;">🎉 PAYMENT SUCCESS</h3>
      <p style="text-align:center;">🔑 ${d.key}</p>
      <button onclick="navigator.clipboard.writeText('${d.key}')">
      📋 Copy Key
      </button>
      `;
    }

    if(d.status==="rejected"){
      clearInterval(interval);
      document.getElementById("status").innerText="❌ Rejected";
    }

  },2000);
}

</script>

</body>
</html>
