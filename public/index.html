<!DOCTYPE html>  
<html>  
<head>  

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">

<title>COBRA SERVER PANEL</title>  
  
<style>  
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center;-webkit-tap-highlight-color:transparent}  

.top{padding:15px;font-size:20px;font-weight:bold;color:#22c55e;animation:glow 1.5s infinite alternate;}  
@keyframes glow{from{opacity:0.6}to{opacity:1}}  

.card{background:#1e293b;margin:10px;padding:15px;border-radius:12px}  

.buyBtn{
 padding:14px;border:none;border-radius:8px;background:#22c55e;color:white;
 margin-top:10px;font-size:16px;animation:btnGlow 1.2s infinite alternate;
}
@keyframes btnGlow{from{box-shadow:0 0 5px #22c55e;}to{box-shadow:0 0 20px #22c55e;}}

button{padding:12px;border:none;border-radius:8px;background:#22c55e;color:white;margin:6px;font-weight:bold}
.red{background:#ef4444}

input,select{padding:10px;width:80%;margin:10px;border-radius:6px;border:none}

.overlay{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,0.8);
 display:flex;justify-content:center;align-items:center;
 z-index:999;
}
.popup{
 background:#1e293b;
 color:#fff;
 padding:20px;
 border-radius:15px;
 width:90%;
 max-width:320px;
 text-align:center;
}

.loader{
 border:4px solid #333;
 border-top:4px solid #22c55e;
 border-radius:50%;
 width:40px;height:40px;
 margin:10px auto;
 animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.keyBox{
 background:#000;
 padding:10px;
 border-radius:10px;
 margin:10px 0;
 font-family:monospace;
 word-break:break-all;
}
</style>  
</head>  
  
<body>  
  
<div class="top">𝗖𝗢𝗕𝗥𝗔 𝗦𝗘𝗥𝗩𝗘𝗥 𝗣𝗔𝗡𝗡𝗘𝗟</div>  
<div id="main"></div>  
  
<script>  

// ================= STATUS =================
fetch("/status")
.then(r=>r.json())
.then(d=>{
 if(!d.on){
   document.body.innerHTML="<h2>⚠️ PLEASE WAIT ADMIN PANEL UPDATE</h2>";
 }else{
   showMain();
 }
});

// ================= MAIN =================
function showMain(){
 main.innerHTML=`
 <div class="card">
   <h3>Select Plan</h3>
   <select id="planSel">
     <option value="5H|80">5H - ₹80</option>
     <option value="1D|100">1 DAY - ₹100</option>
     <option value="3D|200">3 DAY - ₹200</option>
   </select>

   <button class="buyBtn" onclick="goBuy()">BUY KEY</button>
 </div>`;
}

// 🔥 FIX: multiple click रोकना
let lockClick = false;

function goBuy(){
 if(lockClick) return;
 lockClick = true;

 let val = planSel.value.split("|");
 buy(val[0],val[1]);

 setTimeout(()=>{ lockClick=false; },1000);
}

// ================= BUY =================
function buy(plan,price){
 main.innerHTML=`
 <div class="card">
   <h3>PAYMENT</h3>
   <p>Pay ₹${price}</p>
   <input id="utr" placeholder="ENTER UTR (12 digit)">
   <button onclick="confirmBox('${plan}')">VERIFY</button>
 </div>`;
}

// ================= CONFIRM POPUP =================
function confirmBox(plan){
 let utrVal = utr.value;

 if(!utrVal || utrVal.length!=12){
   return alert("Enter Valid 12 Digit UTR");
 }

 document.body.innerHTML+=`
 <div class="overlay" id="pop">
  <div class="popup">
   <h3>CONFIRM PAYMENT</h3>
   <button onclick="startProcess('${plan}','${utrVal}')">YES</button>
   <button class="red" onclick="location.reload()">NO</button>
  </div>
 </div>`;
}

// ================= PROCESS =================
function startProcess(plan,utrVal){

 let userName = "USER_" + Date.now();

 // LOADER POPUP
 document.getElementById("pop").innerHTML=`
 <div class="popup">
 <div class="loader"></div>
 <p>Please wait admin verify your request</p>
 <small>⚠️ Do not tap anywhere</small>
 </div>`;

 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
    user:userName,
    plan:plan,
    utr:utrVal
  })
 });

 let chk=setInterval(()=>{
 fetch("/history")
 .then(r=>r.json())
 .then(h=>{
   let f=h.find(x=>x.utr===utrVal);

   if(f){
     clearInterval(chk);

     // ❌ REJECTED
     if(f.status==="rejected"){
       document.getElementById("pop").innerHTML=`
       <div class="popup">
       <h3>❌ PAYMENT REJECTED</h3>
       <button onclick="location.reload()">OK</button>
       </div>`;
     }

     // ✅ APPROVED
     if(f.status==="approved"){
       let exp=new Date();
       exp.setHours(exp.getHours()+12);

       document.getElementById("pop").innerHTML=`
       <div class="popup">
       <h3>🔑 KEY</h3>
       <div class="keyBox">${f.key}</div>
       <p>Expire: ${exp.toLocaleString()}</p>
       <p>Kill limit 10-12 Play Safe</p>
       <button onclick="location.reload()">OK</button>
       </div>`;
     }
   }
 });
 },2000);
}

</script>  
  
</body>  
</html>
