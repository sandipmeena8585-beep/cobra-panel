<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA PANEL</title>

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:system-ui;
  background:#030a14;
  color:white;
}

.container{
  max-width:420px;
  margin:auto;
  padding:12px;
}

.card{
  border-radius:18px;
  padding:18px;
  margin-top:16px;
  background:#081426;
  box-shadow:0 0 18px rgba(0,255,255,0.12);
}

.topbar{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.icon{
  font-size:18px;
  cursor:pointer;
}

.heading{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  margin-bottom:16px;
  color:#00f2ff;
}

select,input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  background:#0c1d33;
  color:white;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#00f2ff,#007bff);
  color:white;
  margin-top:10px;
}

.mono{
  background:#000;
  padding:12px;
  border-radius:10px;
  text-align:center;
  border:1px solid #00f2ff;
}

.qr{
  display:block;
  margin:15px auto;
}

.status{
  text-align:center;
  color:#00f2ff;
  margin-top:10px;
}

.hidden{display:none;}

/* SPINNER */
.spinner{
  width:40px;
  height:40px;
  border:4px solid rgba(0,255,255,0.2);
  border-top:4px solid #00f2ff;
  border-radius:50%;
  margin:12px auto;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* SUCCESS */
.successAnim{
  animation:pop 0.5s ease;
}
@keyframes pop{
  0%{transform:scale(0.6);opacity:0;}
  100%{transform:scale(1);opacity:1;}
}
</style>
</head>

<body>

<div class="container">

<!-- STEP 1 -->
<div id="step1" class="card">
<div class="heading">COBRA SERVER PANNEL</div>

<select id="plan">
<option value="">Select Plan</option>
<option value="1hour">1 Hour - ₹30</option>
<option value="3hour">3 Hour - ₹50</option>
<option value="1day">1 Day - ₹110</option>
<option value="3day">3 Day - ₹200</option>
<option value="7day">7 Day - ₹400</option>
</select>

<button onclick="goStep2()">BUY KEY</button>
</div>

<!-- STEP 2 -->
<div id="step2" class="card hidden">
<div class="topbar">
<span class="icon" onclick="show('step1')">⬅</span>
<span class="icon" onclick="goHome()">🏠</span>
</div>

<div class="heading">PAYMENT</div>

<div class="mono" onclick="copyUPI()">UPI: godxcobra@axl</div>

<img class="qr"
src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=upi://pay?pa=godxcobra@axl"
width="200">

<button onclick="goStep3()">NEXT</button>
</div>

<!-- STEP 3 -->
<div id="step3" class="card hidden">
<div class="topbar">
<span class="icon" onclick="show('step2')">⬅</span>
<span class="icon" onclick="goHome()">🏠</span>
</div>

<div class="heading">VERIFY PAYMENT PROOF</div>

<select id="method" onchange="changeMethod()">
<option value="utr">Enter UTR</option>
<option value="qr">Upload Screenshot</option>
</select>

<input id="utr" placeholder="Enter UTR">
<input type="file" id="file" class="hidden">

<button id="submitBtn" onclick="submitPayment()">SUBMIT</button>

<div id="loaderBox" class="hidden">
  <div class="spinner"></div>
  <p class="status">⏳ PLEASE WAIT VERIFY ADMIN</p>
</div>

<p id="status" class="status"></p>
</div>

<!-- STEP 4 -->
<div id="step4" class="card hidden">
<div class="topbar">
<span class="icon" onclick="show('step3')">⬅</span>
<span class="icon" onclick="goHome()">🏠</span>
</div>

<div id="resultBox" style="text-align:center;"></div>
</div>

</div>

<script>

let selectedPlan="";
let interval;
let usedUTR = JSON.parse(localStorage.getItem("usedUTR")||"[]");

// NAV
function show(id){
  ["step1","step2","step3","step4"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
}

function goStep2(){
  selectedPlan=document.getElementById("plan").value;
  if(!selectedPlan){
    alert("Select Plan First");
    return;
  }
  show("step2");
}

function goStep3(){ show("step3"); }
function goHome(){ show("step1"); }

function copyUPI(){
  navigator.clipboard.writeText("godxcobra@axl");
}

function changeMethod(){
  let m=document.getElementById("method").value;
  document.getElementById("utr").style.display=(m==="utr")?"block":"none";
  document.getElementById("file").style.display=(m==="qr")?"block":"none";
}

// 🔥 ANTI-FAKE CHECK
function checkFraud(utr,file){
  let risk = "low";

  if(utr && utr.length < 8) risk = "high";
  if(utr && usedUTR.includes(utr)) risk = "high";
  if(file && file.size < 5000) risk = "medium";

  return risk;
}

// SUBMIT
async function submitPayment(){

  let utr=document.getElementById("utr").value.trim();
  let file=document.getElementById("file").files[0];

  if(!utr && !file){
    alert("Enter UTR or Upload Screenshot");
    return;
  }

  let finalUTR = utr || Date.now().toString();

  let risk = checkFraud(finalUTR,file);

  usedUTR.push(finalUTR);
  localStorage.setItem("usedUTR",JSON.stringify(usedUTR));

  let form=new FormData();
  form.append("plan",selectedPlan);
  form.append("utr",finalUTR);
  form.append("risk",risk); // 🔥 admin ke liye
  form.append("time",new Date().toLocaleString());

  if(file) form.append("file",file);

  await fetch("/buy",{method:"POST",body:form});

  document.getElementById("submitBtn").disabled=true;
  document.getElementById("loaderBox").classList.remove("hidden");

  check(finalUTR);
}

// CHECK
function check(utr){

  clearInterval(interval);

  interval=setInterval(async()=>{

    let res=await fetch("/status/"+utr);
    let d=await res.json();

    if(d.status==="approved"){
      clearInterval(interval);
      show("step4");

      document.getElementById("resultBox").innerHTML=`
      <div class="successAnim">
        <h2>🎉 PAYMENT SUCCESS</h2>
      </div>
      `;

      setTimeout(()=>{
        document.getElementById("resultBox").innerHTML=`
        <h2 style="color:#00f2ff;">${d.key}</h2>
        <p>⏳ Expiry: ${d.expiry}</p>
        <button onclick="navigator.clipboard.writeText('${d.key}')">COPY KEY</button>
        <button onclick="window.open('${d.channel}')">📢 Join Channel</button>
        <button onclick="window.open('https://t.me/GODx_COBRA')">🆘 Help</button>
        `;
      },1500);
    }

    if(d.status==="rejected"){
      clearInterval(interval);
      show("step4");
      document.getElementById("resultBox").innerHTML=`
      <h3 style="color:red;">❌ PAYMENT REJECTED</h3>
      `;
    }

  },2000);
}

</script>

</body>
</html>
