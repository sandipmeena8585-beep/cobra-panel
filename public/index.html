<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>COBRA PANEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  padding:0;
  background:#071226;
  font-family:sans-serif;
  color:white;
}

/* WRAPPER */
.wrapper{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  padding:20px;
}

/* CARD */
.card{
  width:100%;
  max-width:420px;
  background:#0f1c2e;
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 25px rgba(0,255,255,0.2);
  animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

/* TITLE */
h2{
  text-align:center;
  margin-bottom:20px;
  font-size:22px;
}

/* INPUT */
select,input{
  width:100%;
  padding:14px;
  margin:12px 0;
  border-radius:12px;
  border:none;
  font-size:15px;
  background:#eaeaea;
}

/* FILE */
input[type="file"]{
  background:none;
  color:white;
}

/* BUTTON */
button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:15px;
  font-size:16px;
  font-weight:bold;
  background:linear-gradient(90deg,#00f2ff,#0072ff);
  color:white;
  box-shadow:0 0 20px #00f2ff;
  margin-top:10px;
  transition:0.3s;
}

button:active{
  transform:scale(0.95);
  box-shadow:0 0 30px #00f2ff;
}

/* STATUS */
#statusBox{
  margin-top:15px;
  text-align:center;
  font-size:14px;
}

/* TELEGRAM BUTTON */
.telegram{
  margin-top:15px;
  text-align:center;
}

.telegram a{
  text-decoration:none;
  color:white;
  font-size:14px;
  opacity:0.8;
}
</style>

</head>

<body>

<div class="wrapper">
<div class="card">

<h2>🎮 BGMI PANEL</h2>

<select id="plan">
  <option value="1h">1 Hour - ₹30</option>
  <option value="3h">3 Hour - ₹50</option>
  <option value="1d">1 Day - ₹110</option>
  <option value="3d">3 Day - ₹200</option>
  <option value="7d">7 Day - ₹400</option>
</select>

<input type="text" id="utr" placeholder="Enter UTR ID">

<input type="file" id="file">

<button onclick="buyKey()">💳 BUY KEY</button>

<div id="statusBox"></div>

<div class="telegram">
  <a href="https://t.me/GODx_COBRA" target="_blank">
    💬 Need Help? Contact Telegram
  </a>
</div>

</div>
</div>

<script>
async function buyKey(){

  let plan = document.getElementById("plan").value;
  let utr = document.getElementById("utr").value;
  let file = document.getElementById("file").files[0];

  if(!utr || !file){
    alert("UTR + Screenshot required");
    return;
  }

  let formData = new FormData();
  formData.append("plan", plan);
  formData.append("utr", utr);
  formData.append("file", file);

  document.getElementById("statusBox").innerHTML = "⏳ Please wait...";

  let res = await fetch("/buy",{
    method:"POST",
    body:formData
  });

  let data = await res.json();

  if(data.status=="pending"){
    document.getElementById("statusBox").innerHTML = "⏳ Waiting for admin verification...";
  }

  if(data.status=="approved"){
    document.getElementById("statusBox").innerHTML = "✅ Key: "+data.key;
  }

  if(data.status=="rejected"){
    document.getElementById("statusBox").innerHTML = "❌ Fake payment detected";
  }

}
</script>

</body>
</html>
