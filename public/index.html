<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA PANEL</title>

<style>
body{
 margin:0;
 font-family:Arial;
 color:#fff;
 text-align:center;
 background:url("/cobra.png") no-repeat center center fixed;
 background-size:cover;
}

/* TOP */
.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px;
 font-weight:bold;
 color:#22c55e;
}

.menuBtn{
 font-size:22px;
 background:#2563eb;
 padding:8px 14px;
 border-radius:10px;
 cursor:pointer;
}

/* MENU */
.menuBox{
 position:fixed;
 top:60px;
 right:10px;
 width:220px;
 background:#fff;
 color:#000;
 border-radius:12px;
 display:none;
 z-index:9999;
}

.menuBox div{
 padding:12px;
 border-bottom:1px solid #ddd;
 cursor:pointer;
}

/* CARD */
.card{
 background:rgba(30,41,59,0.85);
 margin:10px;
 padding:15px;
 border-radius:12px;
}

.buyBtn{background:#22c55e;color:#fff;width:90%}

input,select{
 padding:10px;
 width:90%;
 margin:8px;
 border-radius:6px;
 border:none;
}

.mono{font-family:monospace}

/* POPUP */
.overlay{
 position:fixed;
 top:0;left:0;width:100%;height:100%;
 display:flex;justify-content:center;align-items:center;
 backdrop-filter:blur(10px);
 background:rgba(0,0,0,0.7);
}

.popup{
 background:#0b1220;
 padding:25px;
 border-radius:15px;
 width:90%;
 max-width:320px;
}

/* LOGO */
.logo{
 width:90px;
 height:90px;
 border-radius:50%;
 object-fit:cover;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
 <div>𝗖𝗢𝗕𝗥𝗔 𝗦𝗘𝗥𝗩𝗘𝗥 𝗣𝗔𝗡𝗘𝗟</div>
 <div class="menuBtn" onclick="toggleMenu()">☰</div>
</div>

<!-- MENU -->
<div id="menuBox" class="menuBox">
 <div onclick="location.href='/'">Home</div>
 <div onclick="location.href='/contact.html'">Contact</div>
 <div onclick="location.href='/refund.html'">Refund Policy</div>
 <div onclick="location.href='/terms.html'">Terms & Conditions</div>
</div>

<div id="main"></div>

<script>

// MENU
function toggleMenu(){
 let m=document.getElementById("menuBox");
 m.style.display = (m.style.display==="block") ? "none" : "block";
}

// COPY
function copyKey(t){
 navigator.clipboard.writeText(t);
 alert("KEY COPIED ✔");
}

// OVERLAY
function showOverlay(html){
 let old=document.getElementById("overlayBox");
 if(old) old.remove();
 let div=document.createElement("div");
 div.id="overlayBox";
 div.className="overlay";
 div.innerHTML=html;
 document.body.appendChild(div);
}

// LOAD
function load(){
 fetch("/status").then(r=>r.json()).then(d=>{

  if(!d.on){
   showOverlay(`<div class="popup"><h3>⚠️ PLEASE WAIT</h3><p>ADMIN UPDATE</p></div>`);
   return;
  }

  fetch("/trial").then(r=>r.json()).then(t=>{
   if(t.on){
    showOverlay(`
     <div class="popup">
      <img src="/cobra-logo.png" class="logo">
      <h3>${t.title}</h3>
      <span class="mono" onclick="copyKey('${t.key}')">KEY - ${t.key}</span>
      <span class="mono">${t.kill}</span>
      <button onclick="window.open('${t.telegram}')">JOIN TELEGRAM</button>
     </div>
    `);
   }
  });

  showMain();
 });
}
load();

// MAIN
function showMain(){
 fetch("/plans").then(r=>r.json()).then(plans=>{
  main.innerHTML=`
  <div class="card">
   <h3>Select Game</h3>
   <select><option>BGMI</option></select>

   <h3>Select Plan</h3>
   <select id="planSel">
    ${plans.map(p=>`<option value="${p.time}|${p.price}">${p.time} - ₹${p.price}</option>`)}
   </select>

   <button class="buyBtn" onclick="goBuy()">BUY KEY</button>
  </div>`;
 });
}

// BUY
function goBuy(){
 let v=planSel.value.split("|");
 buy(v[0],v[1]);
}

function buy(plan,price){
 fetch("/settings").then(r=>r.json()).then(s=>{
  main.innerHTML=`
  <div class="card">
   <h2>VERIFY PAYMENT</h2>
   <p>Pay ₹${price}</p>
   <span class="mono">${s.upi}</span>
   <img src="${s.qr}" width="200">
   <input id="utr" placeholder="ENTER UTR">
   <button onclick="verify('${plan}','${price}')">VERIFY</button>
  </div>`;
 });
}

// VERIFY
function verify(plan,price){
 let u=utr.value;

 showOverlay(`<div class="popup"><p>Processing...</p></div>`);

 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   user:"USER_"+Date.now(),
   plan,price,utr:u
  })
 });

 check(u,plan);
}

// CHECK
function check(u,plan){
 let t=setInterval(()=>{
 fetch("/history").then(r=>r.json()).then(h=>{
  let f=h.find(x=>x.utr===u && x.plan===plan);
  if(f){
   clearInterval(t);
   if(f.status==="approved") success(f.key);
   if(f.status==="rejected") reject();
  }
 });
 },2000);
}

// SUCCESS
function success(key){
 showOverlay(`
 <div class="popup">
  <h3>SUCCESS</h3>
  <span class="mono">${key}</span>
  <button onclick="location.reload()">OK</button>
 </div>
 `);
}

// REJECT
function reject(){
 showOverlay(`
 <div class="popup">
  <h3>PAYMENT REJECTED</h3>
  <button onclick="location.reload()">OK</button>
 </div>
 `);
}

</script>

</body>
</html>
