<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">

<title>COBRA SERVER PANEL</title>

<style>
/* (तुम्हारा पूरा CSS SAME है — untouched) */
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center;-webkit-tap-highlight-color:transparent}

.top{padding:15px;font-size:20px;font-weight:bold;color:#22c55e;animation:glow 1.5s infinite alternate;}
@keyframes glow{from{opacity:0.6}to{opacity:1}}

.card{background:#1e293b;margin:10px;padding:15px;border-radius:12px}

.buyBtn{
 padding:14px;border:none;border-radius:8px;background:#22c55e;color:white;
 margin-top:10px;font-size:16px;animation:btnGlow 1.2s infinite alternate;
}
@keyframes btnGlow{from{box-shadow:0 0 5px #22c55e;}to{box-shadow:0 0 20px #22c55e;}}

button{padding:12px;border:none;border-radius:6px;margin:5px}
.darkBtn{background:#0088cc;color:#fff}
.tgBtn{background:#0088cc;color:#fff}

.btnRow{
 display:flex;
 justify-content:space-between;
 margin-top:10px;
}

input,select{padding:10px;width:80%;margin:10px;border-radius:6px;border:none}
.mono{font-family:monospace;display:block;margin:8px 0;user-select:all}

.tgFloat{
 position:fixed;bottom:20px;right:15px;background:#0088cc;color:#fff;
 padding:10px 14px;border-radius:20px;font-size:12px;cursor:pointer;
 box-shadow:0 0 10px #0088cc;
}

.info{margin-top:15px;font-size:14px;color:#38bdf8}

/* POPUP */
.overlay{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,0.7);
 display:flex;justify-content:center;align-items:center;
 z-index:999;
}
.popup{
 background:#020617;color:#fff;padding:20px;border-radius:16px;
 width:85%;max-width:320px;text-align:center;
 animation:fadeIn .3s ease;
 position:relative;
}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

.loader{
 border:4px solid #111;
 border-top:4px solid #22c55e;
 border-radius:50%;
 width:40px;height:40px;
 margin:10px auto;
 animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* PREMIUM */
.popup{animation:popScale .35s ease;}
@keyframes popScale{from{transform:scale(0.7);opacity:0}to{transform:scale(1);opacity:1}}

.popup::before{
 content:"";
 position:absolute;
 inset:0;
 border-radius:16px;
 box-shadow:0 0 35px #22c55e;
 opacity:0.4;
 animation:pulse 1.2s infinite;
}
@keyframes pulse{0%{opacity:0.3}50%{opacity:0.9}100%{opacity:0.3}}

.tick{
 font-size:42px;
 color:#22c55e;
 animation:tickPop .4s ease;
}
@keyframes tickPop{from{transform:scale(0)}to{transform:scale(1)}}
</style>
</head>

<body>

<div class="top" id="title">𝗖𝗢𝗕𝗥𝗔 𝗦𝗘𝗥𝗩𝗘𝗥 𝗣𝗔𝗡𝗡𝗘𝗟</div>

<div id="main"></div>

<div class="tgFloat" onclick="tg()">HELP</div>

<script>

let lastRefresh=0;
let firstLoad=true;
let lock=false;

// 🔥 ================= TRIAL ADD =================
fetch("/trial").then(r=>r.json()).then(t=>{

 if(!t || t.on!==true) return;

 document.body.innerHTML+=`
 <div class="overlay">
 <div class="popup">

 <h3>${t.title}</h3>

 <span class="mono" onclick="copyText('${t.key}')">
 KEY - ${t.key}
 </span>

 <span class="mono">${t.kill}</span>

 <button class="tgBtn" onclick="window.open('${t.telegram}','_blank')">
 📢 JOIN TELEGRAM
 </button>

 <br><br>

 ${t.updates.map(x=>`
   <div>
   <a href="${x}" target="_blank" style="color:#38bdf8">${x}</a>
   </div>
 `).join("")}

 <br>

 <button class="darkBtn" onclick="this.closest('.overlay').remove()">
 OK
 </button>

 </div>
 </div>
 `;
});
// 🔥 ================= END =================

function copyText(t){
 navigator.clipboard.writeText(t);
 alert("Copied ✔");
}

// (बाकी पूरा code SAME नीचे untouched है)

function openTG(){
  window.location.href="tg://join?invite=wRZN39fdVcRkYTM9";
  setTimeout(()=>{
    window.open("https://t.me/+wRZN39fdVcRkYTM9","_blank");
  },1000);
}

function loadStatus(){
 fetch("/status")
 .then(r=>r.json())
 .then(d=>{
  if(!d.on){
   document.body.innerHTML="<h2>⚠️ PLEASE WAIT ADMIN PANEL UPDATE</h2>";
   return;
  }

  if(lastRefresh && d.refresh!==lastRefresh){
    lock=false;
    lastRefresh=d.refresh;

    document.body.style.background = d.color || "#0f172a";
    document.body.style.color = d.textColor || "#ffffff";

    if(d.title){
      document.getElementById("title").innerText = d.title;
    }

    showMain();
    return;
  }

  lastRefresh=d.refresh;

  document.body.style.background = d.color || "#0f172a";
  document.body.style.color = d.textColor || "#ffffff";

  if(d.title){
    document.getElementById("title").innerText = d.title;
  }

  if(firstLoad){
    showMain();
    firstLoad=false;
  }
 });
}

loadStatus();
setInterval(loadStatus,3000);

// (बाकी पूरा code unchanged है...)

</script>

</body>
</html>
