<script>

async function submit(){

  let planValue = document.getElementById("plan").value;
  let utrValue = document.getElementById("utr").value;
  let fileInput = document.getElementById("file").files[0];

  if(!planValue){
    alert("Select Plan");
    return;
  }

  if(!utrValue && !fileInput){
    alert("Enter UTR or Upload Screenshot");
    return;
  }

  let finalUTR = utrValue || Date.now().toString();

  let form = new FormData();
  form.append("plan", planValue);
  form.append("utr", finalUTR);

  if(fileInput){
    form.append("file", fileInput);
  }

  console.log("SENDING:", planValue, finalUTR);

  await fetch("/buy",{
    method:"POST",
    body:form
  });

  localStorage.setItem("utr", finalUTR);

  document.getElementById("status").innerText="⏳ Please wait admin verify";

  check(finalUTR);
}

</script>
