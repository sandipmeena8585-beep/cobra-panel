<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA PANEL</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  color:white;
  background:#071226;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

/* STEP UI COLORS */
.step1{background:#0f1c2e;}
.step2{background:#102a43;}
.step3{background:#1a1f3a;}

.card{
  border-radius:20px;
  padding:20px;
  margin-top:20px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.title{
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#00f2ff,#007bff);
  color:white;
}

/* INPUT */
select,input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:none;
}

.mono{
  background:black;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-family:monospace;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="container">

<!-- 🔥 STEP 1 -->
<div id="step1" class="card step1">

<div class="title">COBRA SERVER PANNEL</div>

<select id="plan">
<option value="">Select Plan</option>
<option value="1hour">1 Hour - ₹30</option>
<option value="3hour">3 Hour - ₹50</option>
<option value="1day">1 Day - ₹110</option>
<option value="3day">3 Day - ₹200</option>
<option value="7day">7 Day - ₹400</option>
</select>

<button onclick="goStep2()">BUY KEY</button>

</div>

<!-- 🔥 STEP 2 -->
<div id="step2" class="card step2 hidden">

<div class="header">
<button onclick="goBack1()">⬅ Back</button>
<div>PAYMENT</div>
<button onclick="goHome()">🏠 Home</button>
</div>

<div class="mono" onclick="copyUPI()">
UPI: godxcobra@axl (tap to copy)
</div>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=godxcobra@axl"
width="200"
style="display:block;margin:auto;margin-top:15px;">

<button onclick="goStep3()">NEXT</button>

</div>

<!-- 🔥 STEP 3 -->
<div id="step3" class="card step3 hidden">

<div class="header">
<button onclick="goBack2()">⬅ Back</button>
<div>VERIFY</div>
<button onclick="goHome()">🏠 Home</button>
</div>

<select id="method" onchange="changeMethod()">
<option value="utr">Enter UTR</option>
<option value="qr">Upload Screenshot</option>
</select>

<input id="utr" placeholder="Enter UTR">
<input type="file" id="file" class="hidden">

<button onclick="submitPayment()">SUBMIT</button>

<p id="status" style="text-align:center;color:#00f2ff;"></p>

</div>

</div>

<script>

let selectedPlan="";
let interval;

// STEP 1 → STEP 2
function goStep2(){
  selectedPlan=document.getElementById("plan").value;

  if(!selectedPlan){
    alert("Select Plan First");
    return;
  }

  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
}

// STEP 2 → STEP 3
function goStep3(){
  document.getElementById("step2").classList.add("hidden");
  document.getElementById("step3").classList.remove("hidden");
}

// BACK
function goBack1(){
  document.getElementById("step2").classList.add("hidden");
  document.getElementById("step1").classList.remove("hidden");
}

function goBack2(){
  document.getElementById("step3").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");
}

// HOME
function goHome(){
  location.reload();
}

// METHOD
function changeMethod(){
  let m=document.getElementById("method").value;
  document.getElementById("utr").style.display=(m==="utr")?"block":"none";
  document.getElementById("file").style.display=(m==="qr")?"block":"none";
}

// COPY
function copyUPI(){
  navigator.clipboard.writeText("godxcobra@axl");
  alert("UPI Copied");
}

// SUBMIT
async function submitPayment(){

  let utr=document.getElementById("utr").value.trim();
  let file=document.getElementById("file").files[0];

  if(!utr && !file){
    alert("Enter UTR or Upload Screenshot");
    return;
  }

  let finalUTR = utr || Date.now();

  let form=new FormData();
  form.append("plan",selectedPlan);
  form.append("utr",finalUTR);

  if(file) form.append("file",file);

  await fetch("/buy",{method:"POST",body:form});

  document.getElementById("status").innerText="⏳ Please wait admin verify...";

  check(finalUTR);
}

// CHECK
function check(utr){

  clearInterval(interval);

  interval=setInterval(async()=>{

    let res=await fetch("/status/"+utr);
    let d=await res.json();

    if(d.status==="approved"){
      clearInterval(interval);

      document.getElementById("step3").innerHTML=`
      <h3 style="text-align:center;">🎉 SUCCESS</h3>
      <p style="text-align:center;">🔑 ${d.key}</p>
      `;
    }

    if(d.status==="rejected"){
      clearInterval(interval);
      document.getElementById("status").innerText="❌ Rejected";
    }

  },2000);
}

</script>

</body>
</html>
