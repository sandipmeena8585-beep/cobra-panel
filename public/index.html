<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">

<title>COBRA SERVER PANEL</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center;-webkit-tap-highlight-color:transparent}

.top{padding:15px;font-size:20px;font-weight:bold;color:#22c55e;animation:glow 1.5s infinite alternate;}
@keyframes glow{from{opacity:0.6}to{opacity:1}}

.card{background:#1e293b;margin:10px;padding:15px;border-radius:12px}

.buyBtn{
 padding:14px;border:none;border-radius:8px;background:#22c55e;color:white;
 margin-top:10px;font-size:16px;animation:btnGlow 1.2s infinite alternate;
}
@keyframes btnGlow{from{box-shadow:0 0 5px #22c55e;}to{box-shadow:0 0 20px #22c55e;}}

button{padding:12px;border:none;border-radius:6px;margin:5px}
.darkBtn{background:#0088cc;color:#fff}
.tgBtn{background:#0088cc;color:#fff}

.btnRow{
 display:flex;
 justify-content:space-between;
 margin-top:10px;
}

input,select{padding:10px;width:80%;margin:10px;border-radius:6px;border:none}
.mono{font-family:monospace;display:block;margin:8px 0;user-select:all}

.tgFloat{
 position:fixed;bottom:20px;right:15px;background:#0088cc;color:#fff;
 padding:10px 14px;border-radius:20px;font-size:12px;cursor:pointer;
 box-shadow:0 0 10px #0088cc;
}

.info{margin-top:15px;font-size:14px;color:#38bdf8}

/* POPUP */
.overlay{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,0.7);
 display:flex;justify-content:center;align-items:center;
 z-index:999;
}
.popup{
 background:#020617;color:#fff;padding:20px;border-radius:16px;
 width:85%;max-width:320px;text-align:center;
 animation:fadeIn .3s ease;
 position:relative;
}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

.loader{
 border:4px solid #111;
 border-top:4px solid #22c55e;
 border-radius:50%;
 width:40px;height:40px;
 margin:10px auto;
 animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== PREMIUM POPUP ADD ===== */
.popup::before{
 content:"";
 position:absolute;
 inset:0;
 border-radius:16px;
 box-shadow:0 0 30px #22c55e;
 opacity:0.4;
 animation:pulse 1.5s infinite;
}
@keyframes pulse{
 0%{opacity:0.3}
 50%{opacity:0.8}
 100%{opacity:0.3}
}

.tick{
 font-size:42px;
 color:#22c55e;
 animation:tickPop .4s ease;
}
@keyframes tickPop{
 from{transform:scale(0)}
 to{transform:scale(1)}
}
</style>
</head>

<body>

<div class="top" id="title">𝗖𝗢𝗕𝗥𝗔 𝗦𝗘𝗥𝗩𝗘𝗥 𝗣𝗔𝗡𝗡𝗘𝗟</div>

<div id="main"></div>

<div class="tgFloat" onclick="tg()">HELP</div>

<script>

let lastRefresh=0;
let firstLoad=true;
let lock=false;

function copyText(t){
 navigator.clipboard.writeText(t);
 alert("Copied ✔");
}

// STATUS
function loadStatus(){
 fetch("/status")
 .then(r=>r.json())
 .then(d=>{

  if(!d.on){
   document.body.innerHTML="<h2>⚠️ PLEASE WAIT ADMIN PANEL UPDATE</h2>";
   return;
  }

  if(lastRefresh && d.refresh!==lastRefresh){
    lock=false;
    lastRefresh=d.refresh;

    document.body.style.background = d.color || "#0f172a";
    document.body.style.color = d.textColor || "#ffffff";

    if(d.title){
      document.getElementById("title").innerText = d.title;
    }

    showMain();
    return;
  }

  lastRefresh=d.refresh;

  document.body.style.background = d.color || "#0f172a";
  document.body.style.color = d.textColor || "#ffffff";

  if(d.title){
    document.getElementById("title").innerText = d.title;
  }

  if(firstLoad){
    showMain();
    firstLoad=false;
  }

 });
}

loadStatus();
setInterval(loadStatus,3000);

// MAIN
function showMain(){
 fetch("/plans").then(r=>r.json()).then(plans=>{
 let options = plans.map(p=>`<option value="${p.type+p.time}|${p.price}">${p.type+p.time} - ₹${p.price}</option>`).join("");

 main.innerHTML=`
 <div class="card">
   <h3>Select Game</h3>
   <select><option>BGMI</option></select>

   <h3>Select Plan</h3>
   <select id="planSel">${options}</select>

   <button class="buyBtn" onclick="goBuy()">𝗕𝗨𝗬 𝗞𝗘𝗬</button>

   <div class="info">
   ━━━━━━━━━━━━━━━━━━ <br>
   ⚡ FAST DELIVERY <br>
   🔐 SECURE ACCESS <br>
   ━━━━━━━━━━━━━━━━━━
   </div>
 </div>`;
 });
}

function goBuy(){
 let val = planSel.value.split("|");
 buy(val[0],val[1]);
}

// PAYMENT
function buy(plan,price){

 if(lock) return;

 fetch("/settings")
 .then(r=>r.json())
 .then(s=>{
  main.innerHTML=`
  <div class="card">
    <h3>PAYMENT</h3>
    <p>Pay ₹${price}</p>

    <div class="mono" onclick="copyText('${s.upi}')">${s.upi}</div>

    <br>
    <img src="${s.qr}" width="200">

    <input id="utr" placeholder="ENTER UTR (12 digit)">
    <button onclick="startProcess('${plan}','${price}')">VERIFY</button>
  </div>`;
 });
}

// PROCESS
function startProcess(plan,price){

 if(lock) return;
 lock=true;

 let utrVal = utr.value;

 if(!utrVal || utrVal.length!=12){
   lock=false;
   return alert("Enter Valid 12 Digit UTR");
 }

 document.body.innerHTML+=`
 <div class="overlay" id="pop">
  <div class="popup">
   <div class="loader"></div>
   <p>Please wait admin verify your request</p>
  </div>
 </div>`;

 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
    user:"USER_"+Date.now(),
    plan:plan,
    price:price,
    utr:utrVal
  })
 });

 let chk=setInterval(()=>{
 fetch("/history")
 .then(r=>r.json())
 .then(h=>{
   let f=h.find(x=>x.utr===utrVal);

   if(f){
     clearInterval(chk);

     if(f.status==="approved"){
       let exp=new Date();
       exp.setHours(exp.getHours()+12);

       pop.innerHTML=`
       <div class="popup">

       <div class="tick">✔</div>

       <h3>🎉 𝐜𝐨𝐧𝐠𝐫𝐚𝐭𝐮𝐥𝐚𝐭𝐢𝐨𝐧𝐬 𝐜𝐡𝐨𝐢𝐜𝐞 𝐂𝐎𝐁𝐑𝐀 𝐒𝐄𝐑𝐕𝐄𝐑</h3>

       <span class="mono" onclick="copyText('${f.key}')">${f.key}</span>
       <span class="mono">Expire: ${exp.toLocaleString()}</span>
       <span class="mono">Kill limit 10-12 (LEGIT PLAY SAFE)</span>

       <div class="btnRow">
         <button class="tgBtn" onclick="window.open('https://t.me/+wRZN39fdVcRkYTM9')">📩 PAID GROUP JOIN</button>
         <button class="darkBtn" onclick="location.reload()">NOT JOIN</button>
       </div>

       </div>`;
     }
   }
 });
 },2000);
}

function tg(){
 window.open("https://t.me/GODx_COBRA");
}

</script>

</body>
</html>
