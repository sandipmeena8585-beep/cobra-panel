<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">

<title>COBRA SERVER PANEL</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center;-webkit-tap-highlight-color:transparent}

.top{padding:15px;font-size:20px;font-weight:bold;color:#22c55e}

.card{background:#1e293b;margin:10px;padding:15px;border-radius:12px}

.buyBtn{
 padding:14px;border:none;border-radius:8px;background:#22c55e;color:white;
 margin-top:10px;font-size:16px;
}

button{padding:12px;border:none;border-radius:6px;margin:5px}
.darkBtn{background:#111;color:#fff}
.tgBtn{background:#0088cc;color:#fff}

input,select{padding:10px;width:80%;margin:10px;border-radius:6px;border:none}

.mono{font-family:monospace;display:block;margin:8px 0}

.overlay{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,0.7);
 display:flex;justify-content:center;align-items:center;
 z-index:999;
}

.popup{
 background:#020617;color:#fff;padding:20px;border-radius:16px;
 width:85%;max-width:320px;text-align:center;
}

.loader{
 border:4px solid #111;
 border-top:4px solid #22c55e;
 border-radius:50%;
 width:40px;height:40px;
 margin:10px auto;
 animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.tick{font-size:42px;color:#22c55e;}
</style>

</head>

<body>

<div class="top" id="title">𝗖𝗢𝗕𝗥𝗔 𝗦𝗘𝗥𝗩𝗘𝗥 𝗣𝗔𝗡𝗡𝗘𝗟</div>

<div id="main"></div>

<script>

// ===== COPY =====
function copyText(t){
 navigator.clipboard.writeText(t);
 alert("Copied ✔");
}

// ===== TELEGRAM =====
function openTG(url){
 window.open(url,"_blank");
}

// ===== TRIAL POPUP =====
function checkTrial(){
 fetch("/trial").then(r=>r.json()).then(t=>{

 if(!t || !t.on) return;

 document.body.innerHTML+=`
 <div class="overlay">
 <div class="popup">

 <h3>${t.title || "COBRA TRIAL"}</h3>

 <span class="mono" onclick="copyText('${t.key}')">
 KEY - ${t.key}
 </span>

 <span class="mono">${t.kill}</span>
 <span class="mono">Expire: ${t.expire}</span>

 <button class="tgBtn" onclick="openTG('${t.telegram}')">
 📢 JOIN TELEGRAM
 </button>

 </div>
 </div>
 `;

 });
}

// ===== LOAD STATUS =====
let last=0;

function load(){
 fetch("/status").then(r=>r.json()).then(d=>{

  document.body.style.background=d.color;
  document.body.style.color=d.textColor;
  title.innerText=d.title;

  if(last!==d.refresh){
    last=d.refresh;
    showPlans();
  }

 });
}

setInterval(load,2000);

// ===== SHOW PLANS =====
function showPlans(){
 fetch("/plans").then(r=>r.json()).then(plans=>{
  main.innerHTML=plans.map(p=>`
   <div class="card">
    ${p.time} - ₹${p.price}
    <br>
    <button class="buyBtn" onclick="buy('${p.time}','${p.price}')">BUY</button>
   </div>
  `).join("");
 });
}

// ===== BUY =====
function buy(plan,price){

 fetch("/settings").then(r=>r.json()).then(s=>{

  main.innerHTML=`
  <div class="card">

  <h3>PAY ₹${price}</h3>

  <div class="mono" onclick="copyText('${s.upi}')">${s.upi}</div>

  <img src="${s.qr}" width="200">

  <input id="utr" placeholder="ENTER UTR (12 digit)">

  <button onclick="verify('${plan}','${price}')">VERIFY</button>

  </div>`;
 });
}

// ===== VERIFY =====
function verify(plan,price){

 let u=utr.value;

 if(!u || u.length!=12){
  return alert("Enter Valid UTR");
 }

 // loader popup
 let pop=document.createElement("div");
 pop.className="overlay";
 pop.innerHTML=`
 <div class="popup">
  <div class="loader"></div>
  <p>Please wait admin verify your request</p>
 </div>`;
 document.body.appendChild(pop);

 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   user:"USER_"+Date.now(),
   plan:plan,
   price:price,
   utr:u
  })
 });

 // check result
 let chk=setInterval(()=>{
  fetch("/history")
  .then(r=>r.json())
  .then(h=>{

   let f=h.find(x=>x.utr===u);

   if(f){
    clearInterval(chk);

    // REJECT
    if(f.status==="rejected"){
     pop.innerHTML=`
     <div class="popup">
      <h3 style="color:red">❌ PAYMENT REJECTED</h3>
      <button onclick="location.reload()">OK</button>
     </div>`;
    }

    // SUCCESS (OLD STYLE)
    if(f.status==="approved"){

     let exp=new Date();
     exp.setHours(exp.getHours()+12);

     pop.innerHTML=`
     <div class="popup">

     <div class="tick">✔</div>

     <h3>𝗖𝗢𝗕𝗥𝗔 𝗦𝗘𝗥𝗩𝗘𝗥 𝗦𝗨𝗖𝗖𝗘𝗦𝗦 🎉</h3>

     <span class="mono" onclick="copyText('${f.key}')">
     TAP KEY - ${f.key}
     </span>

     <span class="mono">Expire: ${exp.toLocaleString()}</span>
     <span class="mono">Kill limit 10-12 (LEGIT PLAY SAFE)</span>

     <button class="tgBtn" onclick="openTG('https://t.me/GODx_COBRA')">
     📩 PAID GROUP JOIN
     </button>

     <button class="darkBtn" onclick="location.reload()">NOT JOIN</button>

     </div>`;
    }

   }

  });
 },2000);

}

// INIT
checkTrial();
load();

</script>

</body>
</html>
