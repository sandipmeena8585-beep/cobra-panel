<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<body>

<h2>COBRA LOGIN</h2>

<input id="user" placeholder="Username"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

<script>
function login(){
  fetch("/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      username:user.value,
      password:pass.value
    })
  })
  .then(res=>res.json())
  .then(data=>{
    if(data.success){
      localStorage.setItem("token",data.token);
      location="admin.html";
    } else {
      alert("Wrong login");
    }
  });
}
</script>

</body>
</html>
