<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA PANEL</title>

<style>
body{
  margin:0;
  background:#071226;
  color:white;
  font-family:sans-serif;
}
.box{
  max-width:420px;
  margin:auto;
  padding:20px;
  background:#0f1c2e;
  border-radius:20px;
  margin-top:20px;
}
select,input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:none;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#00f2ff;
}
.hidden{display:none;}
</style>
</head>

<body>

<div class="box">

<h2>🎮 BGMI PANEL</h2>

<select id="plan">
<option value="">Select Plan</option>
<option value="1hour">1 Hour - ₹30</option>
<option value="3hour">3 Hour - ₹50</option>
<option value="1day">1 Day - ₹110</option>
<option value="3day">3 Day - ₹200</option>
<option value="7day">7 Day - ₹400</option>
</select>

<button onclick="startBuy()">BUY KEY</button>

<div id="payment" class="hidden">

<p>💰 UPI: godxcobra@axl</p>

<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=godxcobra@axl" width="200">

<p id="planShow"></p>

<select id="method" onchange="changeMethod()">
<option value="utr">Enter UTR ID</option>
<option value="qr">Upload Screenshot</option>
</select>

<input id="utr" placeholder="Enter UTR ID">
<input type="file" id="file" class="hidden">

<button onclick="submitPayment()">SUBMIT</button>

<p id="status"></p>

</div>

</div>

<script>

let selectedPlan="";
let checkInterval;

// PAGE LOAD (resume system)
window.onload = function(){

  let savedUTR = localStorage.getItem("utr");

  if(savedUTR){
    document.getElementById("payment").classList.remove("hidden");
    document.getElementById("status").innerText="⏳ Please wait admin verify...";
    startChecking(savedUTR);
  }
};

// START BUY
function startBuy(){

  selectedPlan = document.getElementById("plan").value;

  if(!selectedPlan){
    alert("⚠️ Select Plan First");
    return;
  }

  document.getElementById("payment").classList.remove("hidden");

  document.getElementById("planShow").innerText="Plan: " + selectedPlan;
}

// METHOD SWITCH
function changeMethod(){

  let method = document.getElementById("method").value;

  if(method === "utr"){
    document.getElementById("utr").style.display="block";
    document.getElementById("file").style.display="none";
  }else{
    document.getElementById("utr").style.display="none";
    document.getElementById("file").style.display="block";
  }
}

// SUBMIT PAYMENT
async function submitPayment(){

  let utr = document.getElementById("utr").value.trim();
  let file = document.getElementById("file").files[0];

  if(!selectedPlan){
    alert("Select Plan First");
    return;
  }

  if(!utr && !file){
    alert("Enter UTR OR Upload Screenshot");
    return;
  }

  let finalUTR = utr || Date.now().toString();

  let form = new FormData();
  form.append("plan", selectedPlan);
  form.append("utr", finalUTR);

  if(file){
    form.append("file", file);
  }

  await fetch("/buy",{
    method:"POST",
    body:form
  });

  localStorage.setItem("utr", finalUTR);

  document.getElementById("status").innerText="⏳ Waiting for admin verification...";

  startChecking(finalUTR);
}

// STATUS CHECK LOOP
function startChecking(utr){

  clearInterval(checkInterval);

  checkInterval = setInterval(async()=>{

    let res = await fetch("/status/" + utr);
    let data = await res.json();

    if(data.status === "approved"){

      clearInterval(checkInterval);
      localStorage.removeItem("utr");

      alert(
        "✅ KEY: " + data.key +
        "\n\n📢 Join: https://t.me/GODx_COBRA" +
        "\n⏳ Validity: As per plan"
      );

      location.reload();
    }

    if(data.status === "rejected"){

      clearInterval(checkInterval);
      localStorage.removeItem("utr");

      alert("❌ Payment Rejected");

      setTimeout(()=>{
        location.reload();
      }, 5000);
    }

  },2000);
}

</script>

</body>
</html>
