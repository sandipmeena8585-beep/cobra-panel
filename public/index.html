<!DOCTYPE html>
<html>
<head>
<title>COBRA PANEL</title>

<style>
body{
  background:#0a0a0a;
  color:white;
  font-family:sans-serif;
  text-align:center;
}

select,input{
  padding:10px;
  margin:10px;
  width:220px;
}

button{
  padding:12px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  box-shadow:0 0 20px red;
  transform:scale(1.1);
}

#payBox{
  display:none;
}
</style>
</head>

<body>

<h1>🔥 COBRA PANEL</h1>

<select>
  <option>BGMI</option>
</select>

<br>

<select id="plan">
  <option value="plan1">1 DAY - ₹120</option>
  <option value="plan2">7 DAY - ₹500</option>
  <option value="plan3">15 DAY - ₹800</option>
  <option value="plan4">30 DAY - ₹1000</option>
</select>

<br>

<button onclick="buy()">BUY KEY</button>

<div id="payBox">

<h2>PAYMENT</h2>

<img src="upi_qr.png" width="200">

<p>UPI: godxcobra@axl</p>

<input id="utr" placeholder="Enter UTR">

<input type="file" id="img">

<br>

<button onclick="send()">SUBMIT</button>

<br><br>

<button onclick="check()">CHECK KEY</button>

<p id="res"></p>

</div>

<script>

function buy(){
  document.getElementById("payBox").style.display="block";
}

async function send(){

  let plan = document.getElementById("plan").value;
  let utr = document.getElementById("utr").value;
  let file = document.getElementById("img").files[0];

  let f = new FormData();
  f.append("plan",plan);
  f.append("utr",utr);
  f.append("image",file);

  await fetch("/buy",{method:"POST",body:f});

  alert("Request Sent");
}

async function check(){

  let utr = document.getElementById("utr").value;

  let r = await fetch("/my-key/"+utr);
  let d = await r.json();

  if(d.status=="pending"){
    document.getElementById("res").innerText="Pending...";
  }else{
    document.getElementById("res").innerText="KEY: "+d.key;
  }
}

</script>

</body>
</html>
