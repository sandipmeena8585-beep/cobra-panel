<!DOCTYPE html>
<html>
<head>
<title>COBRA PANEL</title>

<style>
body{
  background:#050505;
  color:white;
  font-family:sans-serif;
  text-align:center;
}

.glow{
  text-shadow:0 0 10px red,0 0 20px red;
}

.card{
  background:#111;
  margin:15px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 20px rgba(255,0,0,0.2);
}

select,input{
  padding:10px;
  margin:10px;
  width:230px;
  border-radius:8px;
  border:none;
}

button{
  padding:12px;
  background:linear-gradient(45deg,#ff0000,#ff6600);
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px red;
}

/* Telegram button */
.tg{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#0088cc;
  padding:15px;
  border-radius:50%;
  box-shadow:0 0 15px #0088cc;
  cursor:pointer;
}
</style>
</head>

<body>

<h1 class="glow">🔥 COBRA VIP PANEL</h1>

<div class="card">

<h3>🎮 BGMI SELECTED</h3>

<select id="plan">
<option value="plan1">1 DAY - ₹120</option>
<option value="plan2">7 DAY - ₹500</option>
<option value="plan3">15 DAY - ₹800</option>
<option value="plan4">30 DAY - ₹1000</option>
</select>

<br>

<button onclick="buy()">🔥 BUY KEY</button>

</div>

<div class="card" id="payBox" style="display:none">

<h2>💳 PAYMENT</h2>

<img src="upi_qr.png" width="200">

<p>UPI: godxcobra@axl</p>

<input id="utr" placeholder="Enter UTR">
<input type="file" id="img">

<br>

<button onclick="send()">SUBMIT</button>

<br><br>

<button onclick="check()">CHECK KEY</button>

<p id="res"></p>

</div>

<!-- TELEGRAM HELP -->
<div class="tg" onclick="tg()">
📩
</div>

<script>

function tg(){
  window.open("https://t.me/GODx_COBRA","_blank");
}

function buy(){
  document.getElementById("payBox").style.display="block";
}

async function send(){
  let plan = plan.value;
  let utr = document.getElementById("utr").value;
  let file = document.getElementById("img").files[0];

  let f = new FormData();
  f.append("plan",plan);
  f.append("utr",utr);
  f.append("image",file);

  await fetch("/buy",{method:"POST",body:f});

  alert("Request Sent ✅");
}

async function check(){
  let utr = document.getElementById("utr").value;

  let r = await fetch("/my-key/"+utr);
  let d = await r.json();

  if(d.status=="pending"){
    res.innerText="⏳ Pending";
  }else{
    res.innerText="🔑 "+d.key;
  }
}
</script>

</body>
</html>
