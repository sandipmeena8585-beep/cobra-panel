<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>COBRA PANEL</title>

<style>
body{
 margin:0;
 font-family:Arial;
 color:#fff;
 text-align:center;

 background:url("cobra.png") no-repeat center center fixed;
 background-size:cover;
}

.top{
 padding:15px;
 font-size:20px;
 font-weight:bold;
 color:#22c55e;
 text-shadow:0 0 10px #22c55e;
}

.card{
 background:rgba(30,41,59,0.85);
 margin:10px;
 padding:15px;
 border-radius:12px;
 backdrop-filter:blur(6px);
}

button{
 padding:12px;
 border:none;
 border-radius:6px;
 margin:5px;
}

.buyBtn{background:#22c55e;color:#fff;width:90%}

input,select{
 padding:10px;
 width:90%;
 margin:8px;
 border:none;
 border-radius:6px;
}

.mono{font-family:monospace;display:block;margin:8px 0}

.overlay{
 position:fixed;
 top:0;left:0;
 width:100%;height:100%;
 display:flex;
 justify-content:center;
 align-items:center;
 backdrop-filter:blur(10px);
 background:rgba(0,0,0,0.7);
 z-index:999;
}

.popup{
 background:#020617;
 padding:20px;
 border-radius:16px;
 width:85%;
 max-width:320px;
 text-align:center;
}

.loader{
 border:4px solid #111;
 border-top:4px solid #22c55e;
 border-radius:50%;
 width:40px;height:40px;
 margin:10px auto;
 animation:spin 1s linear infinite;
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

.btnRow{
 display:flex;
 justify-content:space-between;
}

.joinBtn{
 background:#0088cc;
 color:#fff;
 width:48%;
}

.noBtn{
 background:#111;
 color:#fff;
 width:48%;
}
</style>
</head>

<body>

<!-- 🔥 TITLE -->
<div class="top">𝗖𝗢𝗕𝗥𝗔 𝗦𝗘𝗥𝗩𝗘𝗥 𝗣𝗔𝗡𝗡𝗘𝗟</div>

<div id="main"></div>

<script>

let lock=false;
let shown=false;

// ===== OVERLAY =====
function showOverlay(html){
 let old=document.getElementById("overlayBox");
 if(old) old.remove();

 let div=document.createElement("div");
 div.id="overlayBox";
 div.className="overlay";
 div.innerHTML=html;

 document.body.appendChild(div);
}

function removeOverlay(){
 let o=document.getElementById("overlayBox");
 if(o) o.remove();
}

// ===== LOAD =====
function load(){
 fetch("/status").then(r=>r.json()).then(d=>{

  if(!d.on){
   showOverlay(`
    <div class="popup">
     <h3>⚠️ PLEASE WAIT</h3>
     <p>ADMIN UPDATE</p>
    </div>
   `);
   return;
  }else{
   removeOverlay();
  }

  // TRIAL
  fetch("/trial").then(r=>r.json()).then(t=>{
   if(t.on){
    showOverlay(`
     <div class="popup">
      <h3>${t.title}</h3>
      <span class="mono">${t.key}</span>
      <span class="mono">${t.kill}</span>
      <button onclick="window.open('${t.telegram}')">JOIN TELEGRAM</button>
     </div>
    `);
   }
  });

  showMain();

 });
}

load();

// ===== MAIN =====
function showMain(){
 fetch("/plans").then(r=>r.json()).then(plans=>{
  main.innerHTML=`
  <div class="card">

   <h3>Select Game</h3>
   <select><option>BGMI</option></select>

   <h3>Select Plan</h3>
   <select id="planSel">
    ${plans.map(p=>`<option value="${p.time}|${p.price}">${p.time} - ₹${p.price}</option>`)}
   </select>

   <button class="buyBtn" onclick="goBuy()">BUY KEY</button>

  </div>`;
 });
}

// ===== BUY =====
function goBuy(){
 let v=planSel.value.split("|");
 buy(v[0],v[1]);
}

function buy(plan,price){

 fetch("/settings").then(r=>r.json()).then(s=>{
  main.innerHTML=`
  <div class="card">

   <!-- 🔥 VERIFY TITLE -->
   <h2>𝗩𝗘𝗥𝗜𝗙𝗬 𝗣𝗔𝗬𝗠𝗘𝗡𝗧 ✅</h2>

   <p>Pay ₹${price}</p>

   <span class="mono">${s.upi}</span>

   <img src="${s.qr}" width="200">

   <input id="utr" placeholder="ENTER UTR (12 digit)">

   <button onclick="verify('${plan}','${price}')">VERIFY</button>

  </div>`;
 });
}

// ===== VERIFY =====
function verify(plan,price){

 if(lock) return;
 lock=true;

 let u=utr.value;

 if(!u || u.length!=12){
  lock=false;
  return alert("Invalid UTR");
 }

 showOverlay(`
 <div class="popup">
  <div class="loader"></div>
  <p>Please wait admin verify</p>
 </div>
 `);

 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   user:"USER_"+Date.now(),
   plan:plan,
   price:price,
   utr:u
  })
 });

 check(u,plan);
}

// ===== CHECK =====
function check(u,plan){

 let t=setInterval(()=>{
 fetch("/history").then(r=>r.json()).then(h=>{

  let f=h.find(x=>x.utr===u && x.plan===plan);

  if(f && !shown){
   shown=true;
   clearInterval(t);

   if(f.status==="approved"){
    success(f.key);
   }

   if(f.status==="rejected"){
    reject();
   }

  }

 });
 },2000);
}

// ===== SUCCESS =====
function success(key){
 showOverlay(`
 <div class="popup">

  <h3>COBRA SERVER 🎉</h3>

  <span class="mono">${key}</span>
  <span class="mono">Kill limit 10-12</span>

  <div class="btnRow">
   <button class="joinBtn" onclick="window.open('https://t.me/+wRZN39fdVcRkYTM9')">JOIN</button>
   <button class="noBtn" onclick="location.reload()">OK</button>
  </div>

 </div>
 `);
}

// ===== REJECT =====
function reject(){
 showOverlay(`
 <div class="popup">
  <h3>❌ PAYMENT REJECTED</h3>
  <button onclick="location.reload()">OK</button>
 </div>
 `);
}

</script>

</body>
</html>
