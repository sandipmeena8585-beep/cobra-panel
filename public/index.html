<!DOCTYPE html>
<html>
<head>
<title>COBRA PANEL</title>

<style>
body{
  background:#0a0a0a;
  color:white;
  font-family:sans-serif;
  text-align:center;
}

.box{
  margin-top:40px;
}

select, input{
  padding:10px;
  margin:10px;
  width:220px;
  border-radius:8px;
  border:none;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:8px;
  background:linear-gradient(45deg,#ff0000,#ff5e00);
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px red;
}

#payBox{
  display:none;
  margin-top:20px;
}
</style>

</head>
<body>

<h1>🔥 COBRA PANEL</h1>

<div class="box">

<!-- BGMI -->
<select id="game">
  <option>BGMI</option>
</select>

<br>

<!-- PLAN -->
<select id="plan">
  <option value="plan1">1 DAY - ₹120</option>
  <option value="plan2">7 DAY - ₹500</option>
  <option value="plan3">15 DAY - ₹800</option>
  <option value="plan4">30 DAY - ₹1000</option>
</select>

<br>

<button onclick="buy()">BUY KEY</button>

</div>

<!-- PAYMENT BOX -->
<div id="payBox">

<h2>💳 Payment</h2>

<img src="upi_qr.png" width="200">

<p>UPI: godxcobra@axl</p>

<input type="text" id="utr" placeholder="Enter UTR ID">

<br>

<input type="file" id="image">

<br>

<button onclick="submitPay()">SUBMIT</button>

</div>

<script>
function buy(){
  document.getElementById("payBox").style.display="block";
}

async function submitPay(){

  let plan = document.getElementById("plan").value;
  let utr = document.getElementById("utr").value;
  let file = document.getElementById("image").files[0];

  let formData = new FormData();
  formData.append("plan",plan);
  formData.append("utr",utr);
  formData.append("image",file);

  await fetch("/buy",{
    method:"POST",
    body:formData
  });

  alert("Request Sent ✅");
}
</script>

</body>
</html>
