<!DOCTYPE html>  
<html>  
<head>  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>COBRA SERVER PANEL</title>  
  
<style>  
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center}  
  
.top{  
 padding:15px;  
 font-size:20px;  
 font-weight:bold;  
 color:#22c55e;  
 animation:glow 1.5s infinite alternate;  
}  
@keyframes glow{  
 from{opacity:0.6}  
 to{opacity:1}  
}  
  
.card{  
 background:#1e293b;  
 margin:10px;  
 padding:15px;  
 border-radius:12px;  
}  
  
/* 🔥 BUY BUTTON GLOW */
.buyBtn{
 padding:14px;
 border:none;
 border-radius:8px;
 background:#22c55e;
 color:white;
 margin-top:10px;
 font-size:16px;
 animation:btnGlow 1.2s infinite alternate;
}
@keyframes btnGlow{
 from{box-shadow:0 0 5px #22c55e;}
 to{box-shadow:0 0 20px #22c55e;}
}

button{
 padding:12px;
 border:none;
 border-radius:6px;
 background:#22c55e;
 color:white;
 margin-top:10px;
}

input,select{
 padding:10px;
 width:80%;
 margin:10px;
 border-radius:6px;
 border:none;
}

.mono{font-family:monospace}
</style>  
</head>  
  
<body>  
  
<div class="top">COBRA SERVER PANEL</div>  
  
<div id="main"></div>  
  
<script>  
  
// ================= CHECK SYSTEM =================  
fetch("/status")  
.then(r=>r.json())  
.then(d=>{  
 if(!d.on){  
   document.body.innerHTML="<h2>⚠️ PLEASE WAIT ADMIN PANEL UPDATE</h2>";  
 }else{  
   showMain();  
 }  
});  
  
// 🔥 STEP 1 BGMI + PLAN SELECT
function showMain(){  
 main.innerHTML=`  
 <div class="card">  
   <h3>Select Game</h3>  
   <select id="gameSel">  
     <option>BGMI</option>  
   </select>  

   <h3>Select Plan</h3>  
   <select id="planSel">  
     <option value="5H|80">5H - ₹80</option>  
     <option value="1D|100">1 DAY - ₹100</option>  
     <option value="3D|200">3 DAY - ₹200</option>  
     <option value="7D|400">7 DAY - ₹400</option>  
     <option value="15D|800">15 DAY - ₹800</option>  
     <option value="30D|1000">30 DAY - ₹1000</option>  
     <option value="60D|1200">60 DAY - ₹1200</option>  
     <option value="FULL|1400">FULL SESSION - ₹1400</option>  
   </select>  

   <button class="buyBtn" onclick="goBuy()">𝗕𝗨𝗬 𝗞𝗘𝗬</button>  
 </div>`;  
}  
  
// 🔥 BUY FLOW
function goBuy(){  
 let val = planSel.value.split("|");  
 buy(val[0],val[1]);  
}  
  
// ================= BUY =================  
function buy(plan,price){  
  
 fetch("/settings")  
 .then(r=>r.json())  
 .then(s=>{  
  
  main.innerHTML=`  
  <div class="card">  
    <h3>PAYMENT</h3>  
    <p>Pay ₹${price}</p>  
  
    <div class="mono" onclick="copy('${s.upi}')">  
    ${s.upi}  
    </div>  
  
    <br>  
    <img src="${s.qr}" width="200">  
  
    <br>  
    <input id="utr" placeholder="ENTER UTR">  
    <button onclick="verify('${plan}')">VERIFY</button>  
  </div>  
  `;  
 });  
}  
  
// ================= COPY =================  
function copy(t){  
 navigator.clipboard.writeText(t);  
 alert("UPI COPIED");  
}  
  
// ================= VERIFY =================  
function verify(plan){  
  
 let u = prompt("Enter Name");  
 let utrVal = utr.value;  
  
 if(!utrVal || utrVal.length<6){  
   return alert("Invalid UTR");  
 }  
  
 fetch("/buy",{  
  method:"POST",  
  headers:{"Content-Type":"application/json"},  
  body:JSON.stringify({  
    user:u,  
    plan:plan,  
    utr:utrVal  
  })  
 }).then(()=>{  
  
  localStorage.setItem("pending",plan);  
  waitScreen();  
 });  
}  
  
// ================= WAIT =================  
function waitScreen(){  
  
 main.innerHTML=`  
 <div class="card">  
 <h3>PLEASE WAIT VERIFY ADMIN</h3>  
 <p>Processing...</p>  
 </div>`;  
  
 checkStatus();  
}  
  
// ================= CHECK =================  
function checkStatus(){  
 setInterval(()=>{  
 fetch("/history")  
 .then(r=>r.json())  
 .then(h=>{  
  
   let p = localStorage.getItem("pending");  
  
   let found = h.find(x=>x.plan===p);  
  
   if(found){  
  
     if(found.status==="APPROVED"){  
       showKey(found.key,p);  
     }else{  
       showWarning();  
     }  
  
   }  
  
 });  
 },3000);  
}  
  
// ================= KEY =================  
function showKey(key,plan){  
  
 localStorage.removeItem("pending");  
  
 let expire = new Date();  
 expire.setHours(expire.getHours()+12);  
  
 main.innerHTML=`  
 <div class="card">  
 <h3>KEY</h3>  
 <div class="mono" onclick="copy('${key}')">${key}</div>  
  
 <p>EXPIRE: ${expire.toLocaleString()}</p>  
  
 <button onclick="tg()">TELEGRAM</button>  
  
 <p>KILL LIMIT: 10-12 PLAY SAFE</p>  
 </div>`;  
}  
  
// ================= WARNING =================  
function showWarning(){  
 localStorage.removeItem("pending");  
  
 main.innerHTML=`  
 <div class="card">  
 ⚠️ PAYMENT FAILED / REJECTED  
 </div>`;  
  
 setTimeout(showMain,3000);  
}  
  
// ================= TELEGRAM =================  
function tg(){  
 window.open("https://t.me/GODx_COBRA");  
}  
  
// ================= LOAD PENDING =================  
if(localStorage.getItem("pending")){  
 waitScreen();  
}  
  
</script>  
  
</body>  
</html>
