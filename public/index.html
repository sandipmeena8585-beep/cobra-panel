<!DOCTYPE html>
<html>
<head>
<title>COBRA PANEL</title>

<style>
body{background:#0f172a;color:white;text-align:center;font-family:sans-serif;}
.card{background:#1e293b;padding:20px;margin:20px;border-radius:12px;}
button{padding:10px;border:none;border-radius:8px;background:#00f2ff;}
</style>

</head>

<body>

<div class="card">

<h2>🎮 BGMI PANEL</h2>

<select id="plan">
<option value="1hour">1 Hour - ₹30</option>
<option value="3hour">3 Hour - ₹50</option>
<option value="1day">1 Day - ₹110</option>
<option value="3day">3 Day - ₹200</option>
<option value="7day">7 Day - ₹400</option>
</select>

<br><br>

<input id="utr" placeholder="Enter UTR">
<br><br>

<input type="file" id="file">

<br><br>

<button onclick="buy()">BUY KEY</button>

<br><br>

<div id="statusBox"></div>

</div>

<script>

let requestId = null;

function buy(){

  let f = new FormData();
  f.append("plan", document.getElementById("plan").value);
  f.append("utr", document.getElementById("utr").value);
  f.append("screenshot", document.getElementById("file").files[0]);

  fetch("/buy",{method:"POST",body:f})
  .then(res=>res.json())
  .then(d=>{
    alert(d.msg);
    requestId = d.id;
  });
}

// AUTO KEY CHECK
setInterval(()=>{
  if(!requestId) return;

  fetch("/get-key/"+requestId)
  .then(res=>res.json())
  .then(d=>{

    if(d.status==="pending"){
      statusBox.innerHTML="⏳ WAIT ADMIN VERIFY";
    }

    if(d.status==="rejected"){
      statusBox.innerHTML="❌ FAKE PAYMENT";
    }

    if(d.status==="approved"){
      statusBox.innerHTML="🔑 KEY: "+d.key;
      requestId=null;
    }

  });

},2000);

</script>

</body>
</html>
