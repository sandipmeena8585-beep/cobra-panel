<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>COBRA SERVER PANEL</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff;text-align:center}

.top{padding:15px;font-size:20px;color:#22c55e}

.card{background:#1e293b;margin:10px;padding:15px;border-radius:12px}

button{padding:12px;border:none;border-radius:6px;margin:5px}

.buyBtn{background:#22c55e;color:#fff;width:90%}

input,select{padding:10px;width:90%;margin:8px;border:none;border-radius:6px}

.mono{font-family:monospace;display:block;margin:8px 0}

.overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
display:flex;justify-content:center;align-items:center;
backdrop-filter:blur(8px);
z-index:999;
}

.popup{
background:#020617;
padding:20px;
border-radius:16px;
width:85%;
max-width:320px;
text-align:center;
}

.loader{
border:4px solid #111;
border-top:4px solid #22c55e;
border-radius:50%;
width:40px;height:40px;
margin:10px auto;
animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.btnRow{display:flex;justify-content:space-between}
.joinBtn{background:#0088cc;color:#fff;width:48%}
.noBtn{background:#111;color:#fff;width:48%}
</style>
</head>

<body>

<div class="top" id="title">COBRA SERVER PANEL</div>
<div id="main"></div>

<script>

let last=0;
let lock=false;
let shown=false;

// ================= LOAD =================
function load(){
 fetch("/status").then(r=>r.json()).then(d=>{

  // ADMIN OFF LOCK
  if(!d.on){
   document.body.innerHTML=`
   <div class="overlay">
    <div class="popup">
     <h3>⚠️ PLEASE WAIT</h3>
     <p>ADMIN UPDATE</p>
    </div>
   </div>`;
   return;
  }

  document.body.style.background=d.color;
  document.body.style.color=d.textColor;
  title.innerText=d.title;

  if(last!==d.refresh){
   last=d.refresh;
   showMain();
  }

  // TRIAL LOCK
  fetch("/trial").then(r=>r.json()).then(t=>{
   if(t.on){
    document.body.innerHTML+=`
    <div class="overlay">
     <div class="popup">
      <h3>${t.title}</h3>
      <span class="mono" onclick="copy('${t.key}')">KEY - ${t.key}</span>
      <span class="mono">${t.kill}</span>
      <span class="mono">${t.expire}</span>
      <button onclick="window.open('${t.telegram}','_blank')">JOIN TELEGRAM</button>
     </div>
    </div>`;
   }
  });

 });
}
setInterval(load,3000);
load();

// ================= MAIN =================
function showMain(){
 fetch("/plans").then(r=>r.json()).then(plans=>{
  main.innerHTML=`
  <div class="card">

   <h3>Select Game</h3>
   <select><option>BGMI</option></select>

   <h3>Select Plan</h3>
   <select id="planSel">
    ${plans.map(p=>`<option value="${p.time}|${p.price}">${p.time} - ₹${p.price}</option>`)}
   </select>

   <button class="buyBtn" onclick="goBuy()">BUY KEY</button>

   <div style="margin-top:10px;font-size:14px">
   ⚡ FAST DELIVERY<br>
   🔐 SECURE ACCESS
   </div>

  </div>`;
 });
}

// ================= BUY =================
function goBuy(){
 let v=planSel.value.split("|");
 buy(v[0],v[1]);
}

function buy(plan,price){

 fetch("/settings").then(r=>r.json()).then(s=>{
  main.innerHTML=`
  <div class="card">

   <h3>PAY ₹${price}</h3>

   <span class="mono" onclick="copy('${s.upi}')">${s.upi}</span>

   <img src="${s.qr}" width="200">

   <input id="utr" placeholder="ENTER UTR (12 digit)">

   <button onclick="verify('${plan}','${price}')">VERIFY</button>

  </div>`;
 });
}

// ================= VERIFY =================
function verify(plan,price){

 if(lock) return;
 lock=true;

 let u=utr.value;

 if(!u || u.length!=12){
  lock=false;
  return alert("Enter valid UTR");
 }

 // SAVE UTR
 localStorage.setItem("utr",u);
 localStorage.setItem("plan",plan);

 // LOADER
 document.body.innerHTML+=`
 <div class="overlay" id="pop">
  <div class="popup">
   <div class="loader"></div>
   <p>Please wait admin verify</p>
  </div>
 </div>`;

 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   user:"USER_"+Date.now(),
   plan:plan,
   price:price,
   utr:u
  })
 })
 .then(r=>r.json())
 .then(d=>{

  if(d.blocked){
   alert("BLOCKED "+d.time+" sec");
   location.reload();
  }

  if(d.used){
   alert("UTR already used");
   localStorage.clear();
   location.reload();
  }

  if(d.direct){
   showSuccess(d.key);
  }

 });

 checkLoop(u,plan);
}

// ================= AUTO CHECK =================
function checkLoop(u,plan){

 let chk=setInterval(()=>{
 fetch("/history")
 .then(r=>r.json())
 .then(h=>{

  let f=h.find(x=>x.utr===u && x.plan===plan);

  if(f && !shown){
   shown=true;
   clearInterval(chk);

   if(f.status==="approved"){
    showSuccess(f.key);
   }

   if(f.status==="rejected"){
    showReject();
   }

  }

 });
 },2000);
}

// ================= SUCCESS =================
function showSuccess(key){

 let exp=new Date();
 exp.setHours(exp.getHours()+12);

 pop.innerHTML=`
 <div class="popup">

  <h3>COBRA SERVER 🎉</h3>

  <span class="mono" onclick="copy('${key}')">KEY - ${key}</span>

  <span class="mono">Expire: ${exp.toLocaleString()}</span>
  <span class="mono">Kill limit 10-12 LEGIT PLAY SAFE</span>

  <div class="btnRow">
   <button class="joinBtn" onclick="join()">JOIN</button>
   <button class="noBtn" onclick="reset()">NOT JOIN</button>
  </div>

 </div>`;

 navigator.vibrate?.(200);
}

// ================= REJECT =================
function showReject(){
 pop.innerHTML=`
 <div class="popup">
  <h3>❌ PAYMENT REJECTED</h3>
  <button onclick="reset()">OK</button>
 </div>`;
}

// ================= UTILS =================
function copy(t){
 navigator.clipboard.writeText(t);
 alert("Copied ✔");
}

function join(){
 window.location.href="tg://join?invite=wRZN39fdVcRkYTM9";
 setTimeout(()=>{
  window.open("https://t.me/+wRZN39fdVcRkYTM9","_blank");
 },1000);
}

function reset(){
 localStorage.clear();
 location.reload();
}

// ================= AUTO RETURN =================
let oldUTR=localStorage.getItem("utr");
let oldPlan=localStorage.getItem("plan");

if(oldUTR && oldPlan){
 checkLoop(oldUTR,oldPlan);
}

</script>

</body>
</html>
