<script>

let selectedPlan="";
let checkInterval;
let timerInterval;

// ===== PAGE LOAD CHECK =====
window.onload = function(){

  let savedUTR = localStorage.getItem("utr");

  if(savedUTR){
    document.getElementById("payment").classList.remove("hidden");
    document.getElementById("status").innerText = "⏳ Restoring session...";
    checkStatus(savedUTR);
  }
};

// ===== START BUY =====
function startBuy(){
  selectedPlan = document.getElementById("plan").value;
  document.getElementById("payment").classList.remove("hidden");
}

// ===== METHOD SWITCH =====
function changeMethod(){
  let m = document.getElementById("method").value;

  if(m=="utr"){
    document.getElementById("utr").style.display="block";
    document.getElementById("file").style.display="none";
  }else{
    document.getElementById("utr").style.display="none";
    document.getElementById("file").style.display="block";
  }
}

// ===== SUBMIT =====
async function submit(){

  let utr = document.getElementById("utr").value;
  let file = document.getElementById("file").files[0];
  let method = document.getElementById("method").value;

  if(method=="utr" && !utr){
    alert("Enter UTR");
    return;
  }

  if(method=="qr" && !file){
    alert("Upload Screenshot");
    return;
  }

  let finalUTR = utr || Date.now().toString();

  let form = new FormData();
  form.append("plan", selectedPlan);
  form.append("utr", finalUTR);
  if(file) form.append("file", file);

  await fetch("/buy",{method:"POST",body:form});

  // 🔥 SAVE SESSION
  localStorage.setItem("utr", finalUTR);

  document.getElementById("status").innerText = "⏳ Please wait admin verify";

  startTimer(60);
  checkStatus(finalUTR);
}

// ===== TIMER =====
function startTimer(t){
  clearInterval(timerInterval);

  timerInterval = setInterval(()=>{
    document.getElementById("status").innerText =
    "⏳ Waiting... " + t + "s";

    t--;

    if(t<0){
      clearInterval(timerInterval);
      document.getElementById("status").innerText =
      "⏳ Still waiting admin...";
    }
  },1000);
}

// ===== STATUS CHECK =====
function checkStatus(utr){

  clearInterval(checkInterval);

  checkInterval = setInterval(async ()=>{

    let res = await fetch("/status/"+utr);
    let data = await res.json();

    if(!data) return;

    if(data.status=="approved"){
      clearInterval(checkInterval);
      clearInterval(timerInterval);

      localStorage.removeItem("utr"); // 🔥 CLEAR

      alert("✅ KEY: "+data.key);

      location.reload();
    }

    if(data.status=="rejected"){
      clearInterval(checkInterval);
      clearInterval(timerInterval);

      localStorage.removeItem("utr");

      alert("❌ Fake Payment");

      location.reload();
    }

  },3000);
}

</script>
