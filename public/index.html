<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA PANEL</title>

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#071226,#0f1c2e);
  font-family:sans-serif;
  color:white;
}

.container{
  max-width:420px;
  margin:auto;
  padding:15px;
}

.card{
  background:#0f1c2e;
  border-radius:18px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 0 15px rgba(0,255,255,0.2);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.title{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  letter-spacing:1px;
}

.btnTop{
  background:#00f2ff;
  color:black;
  border:none;
  padding:6px 10px;
  border-radius:8px;
}

select,input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#00f2ff,#007bff);
  color:white;
}

.mono{
  background:#000;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-family:monospace;
  margin-top:10px;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="container">

<div class="card">

<!-- 🔥 HEADER -->
<div id="headerNormal" class="title">
COBRA SERVER PANNEL
</div>

<!-- 🔥 PAYMENT HEADER -->
<div id="headerPayment" class="header hidden">
<button class="btnTop" onclick="goBack()">⬅ Back</button>
<div>PAYMENT</div>
<button class="btnTop" onclick="goHome()">🏠 Home</button>
</div>

<!-- PLAN -->
<div id="planBox">
<select id="plan">
<option value="">Select Plan</option>
<option value="1hour">1 Hour - ₹30</option>
<option value="3hour">3 Hour - ₹50</option>
<option value="1day">1 Day - ₹110</option>
<option value="3day">3 Day - ₹200</option>
<option value="7day">7 Day - ₹400</option>
</select>

<button onclick="startBuy()">BUY KEY</button>
</div>

<!-- PAYMENT -->
<div id="payment" class="hidden">

<!-- UPI -->
<div class="mono" onclick="copyUPI()">
UPI: godxcobra@axl (tap to copy)
</div>

<!-- QR -->
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=godxcobra@axl"
width="200"
style="display:block;margin:auto;margin-top:15px;">

<select id="method" onchange="changeMethod()">
<option value="utr">Enter UTR</option>
<option value="qr">Upload Screenshot</option>
</select>

<input id="utr" placeholder="Enter UTR">
<input type="file" id="file" class="hidden">

<button onclick="submitPayment()">SUBMIT</button>

<p id="status" style="text-align:center;color:#00f2ff;"></p>

</div>

</div>
</div>

<script>

let selectedPlan="";
let interval;

// BUY
function startBuy(){

  selectedPlan=document.getElementById("plan").value;

  if(!selectedPlan){
    alert("Select Plan First");
    return;
  }

  document.getElementById("planBox").classList.add("hidden");
  document.getElementById("payment").classList.remove("hidden");

  document.getElementById("headerNormal").classList.add("hidden");
  document.getElementById("headerPayment").classList.remove("hidden");
}

// HOME
function goHome(){
  document.getElementById("payment").classList.add("hidden");
  document.getElementById("planBox").classList.remove("hidden");

  document.getElementById("headerPayment").classList.add("hidden");
  document.getElementById("headerNormal").classList.remove("hidden");
}

// BACK
function goBack(){
  goHome();
}

// METHOD
function changeMethod(){
  let m=document.getElementById("method").value;
  document.getElementById("utr").style.display=(m==="utr")?"block":"none";
  document.getElementById("file").style.display=(m==="qr")?"block":"none";
}

// COPY UPI
function copyUPI(){
  navigator.clipboard.writeText("godxcobra@axl");
  alert("UPI Copied");
}

// SUBMIT
async function submitPayment(){

  let utr=document.getElementById("utr").value.trim();
  let file=document.getElementById("file").files[0];

  if(!utr && !file){
    alert("Enter UTR or Upload Screenshot");
    return;
  }

  let finalUTR = utr || Date.now();

  let form=new FormData();
  form.append("plan",selectedPlan);
  form.append("utr",finalUTR);

  if(file) form.append("file",file);

  await fetch("/buy",{method:"POST",body:form});

  document.getElementById("status").innerText="⏳ Please wait admin verify...";

  check(finalUTR);
}

// CHECK
function check(utr){

  clearInterval(interval);

  interval=setInterval(async()=>{

    let res=await fetch("/status/"+utr);
    let d=await res.json();

    if(d.status==="approved"){
      clearInterval(interval);

      document.getElementById("payment").innerHTML=`
      <h3 style="text-align:center;">🎉 SUCCESS</h3>
      <p style="text-align:center;">🔑 ${d.key}</p>
      `;
    }

    if(d.status==="rejected"){
      clearInterval(interval);
      document.getElementById("status").innerText="❌ Rejected";

      setTimeout(()=>location.reload(),3000);
    }

  },2000);
}

</script>

</body>
</html>
