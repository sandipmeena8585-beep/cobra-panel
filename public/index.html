<!DOCTYPE html>  
<html>  
<head>  

<!-- 🔥 MOBILE ZOOM LOCK -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">

<title>COBRA SERVER PANEL</title>  
  
<style>  
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center;-webkit-tap-highlight-color:transparent}  
  
.top{  
 padding:15px;  
 font-size:20px;  
 font-weight:bold;  
 color:#22c55e;  
 animation:glow 1.5s infinite alternate;  
}  
@keyframes glow{  
 from{opacity:0.6}  
 to{opacity:1}  
}  
  
.card{  
 background:#1e293b;  
 margin:10px;  
 padding:15px;  
 border-radius:12px;  
}  
  
.buyBtn{
 padding:14px;
 border:none;
 border-radius:8px;
 background:#22c55e;
 color:white;
 margin-top:10px;
 font-size:16px;
 animation:btnGlow 1.2s infinite alternate;
}
@keyframes btnGlow{
 from{box-shadow:0 0 5px #22c55e;}
 to{box-shadow:0 0 20px #22c55e;}
}

button{
 padding:12px;
 border:none;
 border-radius:6px;
 background:#22c55e;
 color:white;
 margin-top:10px;
}

input,select{
 padding:10px;
 width:80%;
 margin:10px;
 border-radius:6px;
 border:none;
}

.mono{font-family:monospace}

/* 🔥 TELEGRAM FLOAT */
.tgFloat{
 position:fixed;
 bottom:20px;
 right:15px;
 background:#0088cc;
 color:#fff;
 padding:10px 14px;
 border-radius:20px;
 font-size:12px;
 cursor:pointer;
 box-shadow:0 0 10px #0088cc;
}

/* DESIGN TEXT */
.info{
 margin-top:15px;
 font-size:14px;
 color:#38bdf8;
}
</style>  
</head>  
  
<body>  
  
<div class="top">𝗖𝗢𝗕𝗥𝗔 𝗦𝗘𝗥𝗩𝗘𝗥 𝗣𝗔𝗡𝗡𝗘𝗟</div>  
  
<div id="main"></div>  

<!-- 🔥 TELEGRAM BUTTON -->
<div class="tgFloat" onclick="tg()">HELP</div>
  
<script>  

// ================= CHECK SYSTEM =================  
fetch("/status")  
.then(r=>r.json())  
.then(d=>{  
 if(!d.on){  
   document.body.innerHTML="<h2>⚠️ PLEASE WAIT ADMIN PANEL UPDATE</h2>";  
 }else{  
   if(localStorage.getItem("pendingUTR")){
     waitScreen();
   }else{
     showMain();  
   }
 }  
});  
  
// ================= MAIN =================
function showMain(){  
 main.innerHTML=`  
 <div class="card">  
   <h3>Select Game</h3>  
   <select><option>BGMI</option></select>  

   <h3>Select Plan</h3>  
   <select id="planSel">  
     <option value="5H|80">5H - ₹80</option>  
     <option value="1D|100">1 DAY - ₹100</option>  
     <option value="3D|200">3 DAY - ₹200</option>  
     <option value="7D|400">7 DAY - ₹400</option>  
     <option value="15D|800">15 DAY - ₹800</option>  
     <option value="30D|1000">30 DAY - ₹1000</option>  
     <option value="60D|1200">60 DAY - ₹1200</option>  
     <option value="FULL|1400">FULL SESSION - ₹1400</option>  
   </select>  

   <button class="buyBtn" onclick="goBuy()">𝗕𝗨𝗬 𝗞𝗘𝗬</button>  

   <!-- 🔥 NEW TEXT -->
   <div class="info">
   ━━━━━━━━━━━━━━━━━━ <br>
   ⚡ 𝐅𝐀𝐒𝐓 𝐃𝐄𝐋𝐈𝐕𝐄𝐑𝐘 <br>
   🔐 𝐒𝐄𝐂𝐔𝐑𝐄 𝐀𝐂𝐂𝐄𝐒𝐒 <br>
   ━━━━━━━━━━━━━━━━━━
   </div>

 </div>`;  
}  
  
function goBuy(){  
 let val = planSel.value.split("|");  
 buy(val[0],val[1]);  
}  
  
// ================= BUY =================  
function buy(plan,price){  
 fetch("/settings")  
 .then(r=>r.json())  
 .then(s=>{  
  main.innerHTML=`  
  <div class="card">  
    <h3>PAYMENT</h3>  
    <p>Pay ₹${price}</p>  
    <div class="mono" onclick="copy('${s.upi}')">${s.upi}</div>  
    <br>  
    <img src="${s.qr}" width="200">  
    <input id="utr" placeholder="ENTER UTR (8 digit)">  
    <button onclick="confirmBox('${plan}')">VERIFY</button>  
  </div>`;  
 });  
}  
  
// बाकी सब same नीचे...
// ================= CONFIRM =================
function confirmBox(plan){
 let utrVal = utr.value;

 if(!utrVal || utrVal.length<6){
   return alert("Invalid UTR");
 }

 document.body.innerHTML+=`
 <div class="overlay"></div>
 <div class="popup">
   <h3>Confirm Payment?</h3>
   <button onclick="sendReq('${plan}','${utrVal}')">YES</button>
   <button onclick="closePop()">NO</button>
 </div>`;
}

function closePop(){ location.reload(); }

function sendReq(plan,utrVal){
 let u = prompt("Enter Name");

 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({ user:u, plan:plan, utr:utrVal })
 }).then(()=>{
  localStorage.setItem("pendingUTR",utrVal);
  location.reload();
 });
}

function waitScreen(){
 main.innerHTML=`
 <div class="card">
 <h3>PLEASE WAIT ADMIN VERIFY</h3>
 <p id="timer">0 sec</p>
 </div>`;

 let t=0;
 setInterval(()=>{ t++; timer.innerText=t+" sec"; },1000);

 checkStatus();
}

function checkStatus(){
 setInterval(()=>{
 fetch("/history")
 .then(r=>r.json())
 .then(h=>{
   let utr = localStorage.getItem("pendingUTR");
   let found = h.find(x=>x.utr===utr);

   if(found){
     if(found.status==="approved"){
       showKey(found.key);
     }else if(found.status==="rejected"){
       showWarning();
     }
   }
 });
 },3000);
}

function showKey(key){
 localStorage.removeItem("pendingUTR");

 let expire = new Date();
 expire.setHours(expire.getHours()+12);

 main.innerHTML=`
 <div class="card">
 <h3>KEY</h3>
 <div class="mono" onclick="copy('${key}')">${key}</div>
 <p>EXPIRE: ${expire.toLocaleString()}</p>
 <button onclick="tg()">TELEGRAM</button>
 </div>`;
}

function showWarning(){
 localStorage.removeItem("pendingUTR");

 main.innerHTML=`<div class="card">⚠️ FAKE PAYMENT / REJECTED</div>`;
 setTimeout(showMain,3000);
}

function copy(t){
 navigator.clipboard.writeText(t);
 alert("COPIED");
}

function tg(){
 window.open("https://t.me/GODx_COBRA");
}

// AUTO LOAD
if(localStorage.getItem("pendingUTR")) waitScreen();

// 🔥 FINAL REFRESH FIX
let last = localStorage.getItem("lastRefresh") || 0;

setInterval(()=>{
 fetch("/status")
 .then(r=>r.json())
 .then(d=>{
   if(d.refresh != last){
     localStorage.setItem("lastRefresh", d.refresh);
     localStorage.removeItem("pendingUTR");
     location.reload();
   }
 });
},3000);

</script>  
  
</body>  
</html>
