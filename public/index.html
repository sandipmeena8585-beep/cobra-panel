<!DOCTYPE html>  
<html>  
<head>  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>COBRA SERVER PANEL</title>  
  
<style>  
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center}  
  
.top{  
 padding:15px;  
 font-size:20px;  
 font-weight:bold;  
 color:#22c55e;  
 animation:glow 1.5s infinite alternate;  
}  
@keyframes glow{  
 from{opacity:0.6}  
 to{opacity:1}  
}  
  
.card{  
 background:#1e293b;  
 margin:10px;  
 padding:15px;  
 border-radius:12px;  
}  
  
.buyBtn{
 padding:14px;
 border:none;
 border-radius:8px;
 background:#22c55e;
 color:white;
 margin-top:10px;
 font-size:16px;
 animation:btnGlow 1.2s infinite alternate;
}
@keyframes btnGlow{
 from{box-shadow:0 0 5px #22c55e;}
 to{box-shadow:0 0 20px #22c55e;}
}

button{
 padding:12px;
 border:none;
 border-radius:6px;
 background:#22c55e;
 color:white;
 margin-top:10px;
}

input,select{
 padding:10px;
 width:80%;
 margin:10px;
 border-radius:6px;
 border:none;
}

.mono{font-family:monospace}
.popup{
 position:fixed;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 background:#1e293b;
 padding:20px;
 border-radius:12px;
 z-index:999;
}
.overlay{
 position:fixed;
 top:0;left:0;
 width:100%;
 height:100%;
 background:rgba(0,0,0,0.6);
 z-index:998;
}
</style>  
</head>  
  
<body>  
  
<div class="top">COBRA SERVER PANEL</div>  
  
<div id="main"></div>  
  
<script>  

// ================= CHECK SYSTEM =================  
fetch("/status")  
.then(r=>r.json())  
.then(d=>{  
 if(!d.on){  
   document.body.innerHTML="<h2>⚠️ PLEASE WAIT ADMIN PANEL UPDATE</h2>";  
 }else{  
   if(localStorage.getItem("pendingUTR")){
     waitScreen();
   }else{
     showMain();  
   }
 }  
});  
  
// ================= MAIN =================
function showMain(){  
 main.innerHTML=`  
 <div class="card">  
   <h3>Select Game</h3>  
   <select><option>BGMI</option></select>  

   <h3>Select Plan</h3>  
   <select id="planSel">  
     <option value="5H|80">5H - ₹80</option>  
     <option value="1D|100">1 DAY - ₹100</option>  
     <option value="3D|200">3 DAY - ₹200</option>  
     <option value="7D|400">7 DAY - ₹400</option>  
     <option value="15D|800">15 DAY - ₹800</option>  
     <option value="30D|1000">30 DAY - ₹1000</option>  
     <option value="60D|1200">60 DAY - ₹1200</option>  
     <option value="FULL|1400">FULL SESSION - ₹1400</option>  
   </select>  

   <button class="buyBtn" onclick="goBuy()">𝗕𝗨𝗬 𝗞𝗘𝗬</button>  
 </div>`;  
}  
  
function goBuy(){  
 let val = planSel.value.split("|");  
 buy(val[0],val[1]);  
}  
  
// ================= BUY =================  
function buy(plan,price){  
  
 fetch("/settings")  
 .then(r=>r.json())  
 .then(s=>{  
  
  main.innerHTML=`  
  <div class="card">  
    <h3>PAYMENT</h3>  
    <p>Pay ₹${price}</p>  
  
    <div class="mono" onclick="copy('${s.upi}')">${s.upi}</div>  
    <br>  
    <img src="${s.qr}" width="200">  
  
    <input id="utr" placeholder="ENTER UTR (8 digit)">  
    <button onclick="confirmBox('${plan}')">VERIFY</button>  
  </div>`;  
 });  
}  
  
// ================= CONFIRM BOX =================
function confirmBox(plan){
 let utrVal = utr.value;

 if(!utrVal || utrVal.length<6){
   return alert("Invalid UTR");
 }

 document.body.innerHTML+=`
 <div class="overlay"></div>
 <div class="popup">
   <h3>Confirm Payment?</h3>
   <button onclick="sendReq('${plan}','${utrVal}')">YES</button>
   <button onclick="closePop()">NO</button>
 </div>`;
}

function closePop(){
 location.reload();
}

// ================= SEND REQUEST =================
function sendReq(plan,utrVal){
 let u = prompt("Enter Name");

 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
    user:u,
    plan:plan,
    utr:utrVal
  })
 }).then(()=>{
  localStorage.setItem("pendingUTR",utrVal);
  location.reload();
 });
}

// ================= WAIT =================
function waitScreen(){

 main.innerHTML=`
 <div class="card">
 <h3>PLEASE WAIT ADMIN VERIFY</h3>
 <p id="timer">0 sec</p>
 </div>`;

 let t=0;
 setInterval(()=>{
  t++;
  timer.innerText=t+" sec";
 },1000);

 checkStatus();
}

// ================= CHECK =================
function checkStatus(){
 setInterval(()=>{
 fetch("/history")
 .then(r=>r.json())
 .then(h=>{
   let utr = localStorage.getItem("pendingUTR");

   let found = h.find(x=>x.utr===utr);

   if(found){
     if(found.status==="approved" || found.status==="APPROVED"){
       showKey(found.key);
     }else if(found.status==="rejected"){
       showWarning();
     }
   }
 });
 },3000);
}

// ================= KEY =================
function showKey(key){
 localStorage.removeItem("pendingUTR");

 let expire = new Date();
 expire.setHours(expire.getHours()+12);

 main.innerHTML=`
 <div class="card">
 <h3>KEY</h3>
 <div class="mono" onclick="copy('${key}')">${key}</div>
 <p>EXPIRE: ${expire.toLocaleString()}</p>
 <button onclick="tg()">TELEGRAM</button>
 </div>`;
}

// ================= WARNING =================
function showWarning(){
 localStorage.removeItem("pendingUTR");

 main.innerHTML=`
 <div class="card">
 ⚠️ FAKE PAYMENT / REJECTED
 </div>`;

 setTimeout(showMain,3000);
}

// ================= COPY =================
function copy(t){
 navigator.clipboard.writeText(t);
 alert("COPIED");
}

// ================= TG =================
function tg(){
 window.open("https://t.me/GODx_COBRA");
}

// ================= AUTO LOAD =================
if(localStorage.getItem("pendingUTR")){
 waitScreen();
}

// ================= 🔥 AUTO REFRESH (ADDED) =================
let last = 0;

setInterval(()=>{
 fetch("/status")
 .then(r=>r.json())
 .then(d=>{
   if(d.refresh !== last){
     last = d.refresh;
     location.reload();
   }
 });
},3000);

</script>  
  
</body>  
</html>
