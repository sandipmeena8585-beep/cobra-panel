<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">

<title>COBRA SERVER PANEL</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center}

.top{padding:15px;font-size:20px;font-weight:bold;color:#22c55e}

.card{background:#1e293b;margin:10px;padding:15px;border-radius:12px}

.buyBtn{
 padding:14px;border:none;border-radius:8px;background:#22c55e;color:white;
 margin-top:10px;font-size:16px;
}

button{padding:12px;border:none;border-radius:6px;margin:5px}
.darkBtn{background:#0088cc;color:#fff}
.tgBtn{background:#0088cc;color:#fff}

.btnRow{display:flex;justify-content:space-between;margin-top:10px}

input,select{padding:10px;width:80%;margin:10px;border-radius:6px;border:none}
.mono{font-family:monospace;display:block;margin:8px 0;user-select:all}

/* popup */
.overlay{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,0.7);
 display:flex;justify-content:center;align-items:center;
 z-index:999;
}
.popup{
 background:#020617;color:#fff;padding:20px;border-radius:16px;
 width:85%;max-width:320px;text-align:center;
}
.loader{
 border:4px solid #111;
 border-top:4px solid #22c55e;
 border-radius:50%;
 width:40px;height:40px;
 margin:10px auto;
 animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.tick{font-size:40px;color:#22c55e}
</style>
</head>

<body>

<div class="top" id="title">COBRA SERVER PANEL</div>
<div id="main"></div>

<script>

// ================= TRIAL SYSTEM =================
let trialShown=false;

function loadTrial(){
 fetch("/trial")
 .then(r=>r.json())
 .then(t=>{

  if(!t || !t.on) return;
  if(trialShown) return;

  trialShown=true;

  document.body.innerHTML += `
  <div class="overlay">
  <div class="popup">

  <div class="tick">✔</div>

  <h3>${t.title}</h3>

  <span class="mono" onclick="copyText('${t.key}')">
  TAP KEY - ${t.key}
  </span>

  <span class="mono">${t.expire}</span>
  <span class="mono">${t.kill}</span>

  <div class="btnRow">
    <button class="tgBtn" onclick="window.open('${t.telegram}','_blank')">
    📩 JOIN GROUP
    </button>

    <button class="darkBtn" onclick="this.closest('.overlay').remove()">
    OK
    </button>
  </div>

  </div>
  </div>`;
 });
}

loadTrial();
setInterval(loadTrial,5000);

// ================= NORMAL SYSTEM =================

let lastRefresh=0;
let firstLoad=true;
let lock=false;

function copyText(t){
 navigator.clipboard.writeText(t);
 alert("Copied ✔");
}

function openTG(){
 window.open("https://t.me/GODx_COBRA");
}

function loadStatus(){
 fetch("/status")
 .then(r=>r.json())
 .then(d=>{

  if(!d.on){
   document.body.innerHTML="<h2>⚠️ PLEASE WAIT ADMIN UPDATE</h2>";
   return;
  }

  if(lastRefresh && d.refresh!==lastRefresh){
    lock=false;
    lastRefresh=d.refresh;
    showMain();
    return;
  }

  lastRefresh=d.refresh;

  if(firstLoad){
    showMain();
    firstLoad=false;
  }
 });
}

loadStatus();
setInterval(loadStatus,3000);

// ================= MAIN =================
function showMain(){
 fetch("/plans").then(r=>r.json()).then(plans=>{
 let options = plans.map(p=>`<option value="${p.type+p.time}|${p.price}">${p.type+p.time} - ₹${p.price}</option>`).join("");

 main.innerHTML=`
 <div class="card">
   <h3>Select Plan</h3>
   <select id="planSel">${options}</select>
   <button class="buyBtn" onclick="goBuy()">BUY KEY</button>
 </div>`;
 });
}

function goBuy(){
 let val = planSel.value.split("|");
 buy(val[0],val[1]);
}

// ================= BUY =================
function buy(plan,price){

 if(lock) return;

 main.innerHTML=`
 <div class="card">
   <h3>PAYMENT</h3>
   <p>Pay ₹${price}</p>

   <input id="utr" placeholder="ENTER UTR (12 digit)">
   <button onclick="startProcess('${plan}','${price}')">VERIFY</button>
 </div>`;
}

function startProcess(plan,price){

 if(lock) return;
 lock=true;

 let utrVal = utr.value;

 if(!utrVal || utrVal.length!=12){
   lock=false;
   return alert("Enter Valid UTR");
 }

 document.body.innerHTML+=`
 <div class="overlay" id="pop">
  <div class="popup">
   <div class="loader"></div>
   <p>Please wait admin verify your request</p>
  </div>
 </div>`;

 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
    user:"USER_"+Date.now(),
    plan:plan,
    price:price,
    utr:utrVal
  })
 });

 let chk=setInterval(()=>{
 fetch("/history")
 .then(r=>r.json())
 .then(h=>{
   let f=h.find(x=>x.utr===utrVal);

   if(f){
     clearInterval(chk);

     if(f.status==="rejected"){
       pop.innerHTML=`
       <div class="popup">
       <h3>❌ PAYMENT REJECTED</h3>
       <button onclick="location.reload()">OK</button>
       </div>`;
     }

     if(f.status==="approved"){
       pop.innerHTML=`
       <div class="popup">

       <div class="tick">✔</div>

       <h3>COBRA SERVER SUCCESS 🎉</h3>

       <span class="mono" onclick="copyText('${f.key}')">
       TAP KEY - ${f.key}
       </span>

       <div class="btnRow">
         <button onclick="openTG()">JOIN</button>
         <button onclick="location.reload()">OK</button>
       </div>

       </div>`;
     }
   }
 });
 },2000);
}

</script>
</body>
</html>
