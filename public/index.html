<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>COBRA SERVER PANEL</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center}
.top{padding:15px;font-size:20px;color:#22c55e}
.card{background:#1e293b;margin:10px;padding:15px;border-radius:12px}
.buyBtn{padding:14px;background:#22c55e;color:white;border:none;border-radius:8px}
input,select{padding:10px;width:80%;margin:10px;border-radius:6px;border:none}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center}
.popup{background:#1e293b;padding:20px;border-radius:12px}
.loader{border:4px solid #333;border-top:4px solid #22c55e;border-radius:50%;width:40px;height:40px;margin:auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<div class="top">COBRA SERVER PANEL</div>
<div id="main"></div>

<script>

// ================= STATUS =================
fetch("/status").then(r=>r.json()).then(d=>{
 if(!d.on){
   document.body.innerHTML="<h2>⚠️ PLEASE WAIT ADMIN UPDATE</h2>";
 }else showMain();
});

// ================= PLAN LIVE =================
function showMain(){
 fetch("/plans").then(r=>r.json()).then(plans=>{
 let opt = plans.map(p=>`<option value="${p.type+p.time}|${p.price}">
 ${p.type}${p.time} - ₹${p.price}</option>`).join("");

 main.innerHTML=`
 <div class="card">
 <h3>Select Plan</h3>
 <select id="planSel">${opt}</select>
 <button class="buyBtn" onclick="goBuy()">BUY KEY</button>
 </div>`;
 });
}

function goBuy(){
 let val=document.getElementById("planSel").value.split("|");
 buy(val[0],val[1]);
}

// ================= BUY =================
function buy(plan,price){
 fetch("/settings").then(r=>r.json()).then(s=>{
 main.innerHTML=`
 <div class="card">
 <h3>PAY ₹${price}</h3>
 <div>${s.upi}</div>
 <input id="utr" placeholder="UTR 12 digit">
 <button onclick="confirmBox('${plan}','${price}')">VERIFY</button>
 </div>`;
 });
}

// ================= CONFIRM =================
function confirmBox(plan,price){
 let utrVal=utr.value;
 if(!utrVal||utrVal.length!=12)return alert("Invalid UTR");

 document.body.innerHTML+=`
 <div class="overlay" id="pop">
 <div class="popup">
 <h3>CONFIRM PAYMENT</h3>
 <button onclick="start('${plan}','${price}','${utrVal}')">YES</button>
 <button onclick="location.reload()">NO</button>
 </div></div>`;
}

// ================= START PROCESS =================
function start(plan,price,utrVal){

 document.getElementById("pop").innerHTML=`
 <div class="popup">
 <div class="loader"></div>
 <p>Please wait admin verify</p>
 </div>`;

 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
    user:"USER_"+Date.now(),
    plan:plan,
    price:price,
    utr:utrVal
  })
 });

 let chk=setInterval(()=>{
 fetch("/history").then(r=>r.json()).then(h=>{
 let f=h.find(x=>x.utr===utrVal);
 if(f){
 clearInterval(chk);

 if(f.status==="rejected"){
  pop.innerHTML=`<div class="popup">
  <h3>❌ PAYMENT REJECTED</h3>
  <button onclick="location.reload()">OK</button>
  </div>`;
 }

 if(f.status==="approved"){
  pop.innerHTML=`<div class="popup">
  <h3>🔑 KEY</h3>
  <div>${f.key}</div>
  <button onclick="location.reload()">OK</button>
  </div>`;
 }
 }
 });
 },2000);
}

// ================= 🔥 REFRESH FIX =================
let lastRefresh = 0;

setInterval(()=>{
 fetch("/status")
 .then(r=>r.json())
 .then(d=>{
   if(d.refresh && d.refresh != lastRefresh){
     lastRefresh = d.refresh;

     // 🔥 IMPORTANT: always go to HOME
     location.href = "/";
   }
 });
},3000);

</script>

</body>
</html>
