<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA PANEL</title>

<style>
body{margin:0;background:#071226;color:white;font-family:sans-serif;}
.box{max-width:420px;margin:auto;padding:20px;background:#0f1c2e;border-radius:20px;margin-top:20px;}
select,input{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:none;}
button{width:100%;padding:12px;border:none;border-radius:10px;background:#00f2ff;}
.hidden{display:none;}
</style>
</head>

<body>

<div class="box">

<h2>BGMI PANEL</h2>

<select id="plan">
<option value="1hour">1 Hour - ₹30</option>
<option value="3hour">3 Hour - ₹50</option>
<option value="1day">1 Day - ₹110</option>
<option value="3day">3 Day - ₹200</option>
<option value="7day">7 Day - ₹400</option>
</select>

<button onclick="start()">BUY KEY</button>

<div id="payment" class="hidden">

<p>UPI: godxcobra@axl</p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=godxcobra@axl" width="200">

<p id="planShow"></p>

<select id="method" onchange="change()">
<option value="utr">UTR</option>
<option value="qr">Screenshot</option>
</select>

<input id="utr" placeholder="Enter UTR">
<input type="file" id="file" class="hidden">

<button onclick="submit()">SUBMIT</button>

<div id="status"></div>

</div>

</div>

<script>

let plan="";
let interval;

window.onload=function(){
  let u=localStorage.getItem("utr");
  if(u){
    document.getElementById("payment").classList.remove("hidden");
    check(u);
  }
};

function start(){
  plan=document.getElementById("plan").value;
  document.getElementById("payment").classList.remove("hidden");
  document.getElementById("planShow").innerText="Plan: "+plan;
}

function change(){
  let m=document.getElementById("method").value;
  document.getElementById("utr").style.display=m=="utr"?"block":"none";
  document.getElementById("file").style.display=m=="qr"?"block":"none";
}

async function submit(){

  let utr=document.getElementById("utr").value||Date.now().toString();
  let file=document.getElementById("file").files[0];

  let form=new FormData();
  form.append("plan",plan);
  form.append("utr",utr);
  if(file) form.append("file",file);

  await fetch("/buy",{method:"POST",body:form});

  localStorage.setItem("utr",utr);

  document.getElementById("status").innerText="⏳ Please wait admin verify";

  check(utr);
}

function check(utr){

  clearInterval(interval);

  interval=setInterval(async()=>{

    let r=await fetch("/status/"+utr);
    let d=await r.json();

    if(d.status=="approved"){
      clearInterval(interval);
      localStorage.removeItem("utr");

      alert("KEY: "+d.key+
      "\nJoin: https://t.me/GODx_COBRA\nExpire: 24h");

      setTimeout(()=>location.reload(),1000);
    }

    if(d.status=="rejected"){
      clearInterval(interval);
      localStorage.removeItem("utr");

      alert("Payment Rejected");

      setTimeout(()=>location.reload(),60000);
    }

  },2000);
}

</script>

</body>
</html>
