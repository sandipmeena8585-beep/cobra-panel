<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobra Digital Services</title>

<style>
body{
 margin:0;
 padding-top:55px;
 font-family:Arial;
 color:#fff;
 text-align:center;
 background:#0f172a;
}

/* TOP */
.topbar{
 position:fixed;
 top:0; left:0; width:100%;
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px;
 font-weight:bold;
 background:#020617;
 color:#22c55e;
}

/* MENU */
.menuBtn{
 font-size:14px;
 padding:6px 10px;
 background:#2563eb;
 border-radius:6px;
 cursor:pointer;
}
.menuBox{
 position:fixed;
 top:55px;
 right:10px;
 width:180px;
 background:#fff;
 color:#000;
 border-radius:10px;
 display:none;
}
.menuBox div{
 padding:12px;
 border-bottom:1px solid #eee;
 cursor:pointer;
}
.menuBox div:hover{
 background:#2563eb;
 color:#fff;
}

/* CARD */
.card{
 background:#1e293b;
 margin:12px;
 padding:18px;
 border-radius:12px;
}

button{
 padding:12px;
 border:none;
 border-radius:6px;
 margin-top:10px;
}

.buyBtn{
 background:#22c55e;
 color:#fff;
 width:90%;
 font-weight:bold;
}

/* TRUST TEXT */
.trust{
 font-size:12px;
 color:#22c55e;
 margin-top:8px;
}

input,select{
 padding:10px;
 width:90%;
 margin:8px;
 border:none;
 border-radius:6px;
}

/* FOOTER */
.footer{
 margin-top:30px;
 font-size:13px;
 color:#aaa;
 padding:15px;
}
.footer a{
 color:#22c55e;
 margin:0 5px;
 text-decoration:none;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
 <div>COBRA DIGITAL SERVICES</div>
 <div class="menuBtn" onclick="toggleMenu()">☰</div>
</div>

<!-- MENU -->
<div id="menuBox" class="menuBox">
 <div onclick="go('/contact.html')">Contact</div>
 <div onclick="go('/terms.html')">Terms</div>
 <div onclick="go('/refund.html')">Refund</div>
 <div onclick="go('/privacy.html')">Privacy</div>
</div>

<div id="main"></div>

<!-- FOOTER -->
<div class="footer">
 <div>Cobra Digital Services</div>
 <p>We provide digital subscription-based services for users.</p>
 <p>Contact: cobrasupport@gmail.com</p>

 <p>Telegram: 
 <a href="https://t.me/GODx_COBRA" target="_blank">@GODx_COBRA</a>
 </p>

 <a href="https://t.me/GODx_COBRA" target="_blank">
  <button style="background:#2563eb;color:#fff;width:90%;">
   💬 Contact on Telegram
  </button>
 </a>

 <br><br>

 <a href="/contact.html">Contact</a> |
 <a href="/terms.html">Terms</a> |
 <a href="/refund.html">Refund</a> |
 <a href="/privacy.html">Privacy</a>

 <p style="margin-top:10px;">© 2026 All Rights Reserved</p>
</div>

<script>

/* MENU */
function toggleMenu(){
 let m=document.getElementById("menuBox");
 m.style.display = (m.style.display==="block") ? "none" : "block";
}
function go(u){ location.href=u; }

/* LOAD */
function load(){
 fetch("/status").then(r=>r.json()).then(d=>{
  if(!d.on){
   main.innerHTML="<h3>Service temporarily unavailable</h3>";
   return;
  }
  showMain();
 });
}
load();

/* MAIN */
function showMain(){
 fetch("/plans").then(r=>r.json()).then(plans=>{
  main.innerHTML=`
  <div class="card">

   <h2>Premium Digital Subscription Services</h2>

   <p>We provide secure access to premium digital tools and services through subscription plans.</p>

   <h3>Select Plan</h3>
   <select id="planSel">
    ${plans.map(p=>`<option value="${p.time}|${p.price}">
     ${p.time} - ₹${p.price}
    </option>`)}
   </select>

   <button class="buyBtn" onclick="goBuy()">Purchase Subscription</button>

   <div class="trust">
    🔒 Secure Payment | Instant Activation | 24/7 Support
   </div>

  </div>`;
 });
}

/* BUY */
function goBuy(){
 let v=planSel.value.split("|");
 buy(v[0],v[1]);
}

function buy(plan,price){
 fetch("/settings").then(r=>r.json()).then(s=>{
  main.innerHTML=`
  <div class="card">

   <h2>Complete Payment</h2>

   <p>Amount: ₹${price}</p>

   <p><b>${s.upi}</b></p>

   <img src="${s.qr}" width="200">

   <p style="font-size:12px;color:#aaa;">
   ✔ Instant activation after verification<br>
   ✔ Validity as per plan<br>
   ❌ No refund after activation
   </p>

   <input id="utr" placeholder="Enter UTR Number">

   <button onclick="verify('${plan}','${price}')">Submit Payment</button>

   <br>

   <a href="https://t.me/GODx_COBRA" target="_blank">
   <button style="background:#2563eb;color:#fff;width:90%;">
   Need Help? Contact on Telegram
   </button>
   </a>

  </div>`;
 });
}

/* VERIFY */
function verify(plan,price){
 let u=utr.value;
 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   user:"USER_"+Date.now(),
   plan,price,utr:u
  })
 });
 alert("Payment submitted. Wait for confirmation.");
}

</script>

</body>
</html>
