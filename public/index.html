<!DOCTYPE html>  
<html>  
<head>  

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">

<title>COBRA SERVER PANEL</title>  
  
<style>  
body{margin:0;font-family:Arial;background:#0f172a;color:white;text-align:center;-webkit-tap-highlight-color:transparent}  
  
.top{padding:15px;font-size:20px;font-weight:bold;color:#22c55e;animation:glow 1.5s infinite alternate;}  
@keyframes glow{from{opacity:0.6}to{opacity:1}}  
  
.card{background:#1e293b;margin:10px;padding:15px;border-radius:12px}  
  
.buyBtn{
 padding:14px;border:none;border-radius:8px;background:#22c55e;color:white;
 margin-top:10px;font-size:16px;animation:btnGlow 1.2s infinite alternate;
}

button{padding:12px;border:none;border-radius:6px;background:#22c55e;color:white;margin:5px}
.okBtn{background:#020617}

input,select{padding:10px;width:80%;margin:10px;border-radius:6px;border:none}
.mono{font-family:monospace}

.copyBox{
 background:#000;
 padding:10px;
 border-radius:8px;
 margin:10px 0;
 cursor:pointer;
}

.tgBtn{
 background:#0088cc;
 padding:10px;
 border-radius:8px;
 display:inline-block;
 margin-top:10px;
}

.overlay{
 position:fixed;top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,0.7);
 display:flex;justify-content:center;align-items:center;
 z-index:999;
}
.popup{
 background:#0f172a;
 color:#fff;
 padding:20px;
 border-radius:16px;
 width:85%;
 max-width:320px;
 box-shadow:0 0 20px #22c55e;
 animation:pop .2s ease;
}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}

.loader{
 border:4px solid #333;
 border-top:4px solid #22c55e;
 border-radius:50%;
 width:40px;height:40px;
 margin:10px auto;
 animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>  
</head>  
  
<body>  
  
<div class="top" id="title">𝗖𝗢𝗕𝗥𝗔 𝗦𝗘𝗥𝗩𝗘𝗥 𝗣𝗔𝗡𝗡𝗘𝗟</div>  
  
<div id="main"></div>  

<script>  

let lastRefresh=0;

// 🔥 STATUS
function loadStatus(){
 fetch("/status")
 .then(r=>r.json())
 .then(d=>{

  if(!d.on){
   document.body.innerHTML="<h2>⚠️ PLEASE WAIT ADMIN PANEL UPDATE</h2>";
   return;
  }

  // 🔥 1 TAP = 1 REFRESH
  if(lastRefresh && d.refresh!==lastRefresh){
    location.href="/"; 
  }
  lastRefresh=d.refresh;

  showMain();
 });
}

loadStatus();
setInterval(loadStatus,2000);

// MAIN
function showMain(){
 fetch("/plans").then(r=>r.json()).then(plans=>{
 let options = plans.map(p=>`<option value="${p.type+p.time}|${p.price}">
 ${p.type+p.time} - ₹${p.price}</option>`).join("");

 main.innerHTML=`
 <div class="card">
   <h3>Select Plan</h3>
   <select id="planSel">${options}</select>
   <button class="buyBtn" onclick="goBuy()">BUY KEY</button>
 </div>`;
 });
}

function goBuy(){
 let val = planSel.value.split("|");
 buy(val[0],val[1]);
}

// BUY
function buy(plan,price){
 fetch("/settings")
 .then(r=>r.json())
 .then(s=>{
  main.innerHTML=`
  <div class="card">
    <h3>PAY ₹${price}</h3>

    <div class="copyBox" onclick="copyText('${s.upi}')">
    ${s.upi} (tap to copy)
    </div>

    <img src="${s.qr}" width="200">

    <input id="utr" placeholder="ENTER UTR (12 digit)">
    <button onclick="startProcess('${plan}','${price}')">VERIFY</button>
  </div>`;
 });
}

// COPY
function copyText(t){
 navigator.clipboard.writeText(t);
 alert("Copied ✔");
}

// PROCESS
function startProcess(plan,price){
 let utrVal = utr.value;

 if(!utrVal || utrVal.length!=12){
   return alert("Enter Valid UTR");
 }

 document.body.innerHTML+=`
 <div class="overlay" id="pop">
  <div class="popup">
   <div class="loader"></div>
   <p>Please wait admin verify</p>
  </div>
 </div>`;

 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
    user:"USER_"+Date.now(),
    plan:plan,
    price:price,
    utr:utrVal
  })
 });

 let chk=setInterval(()=>{
 fetch("/history")
 .then(r=>r.json())
 .then(h=>{
   let f=h.find(x=>x.utr===utrVal);

   if(f){
     clearInterval(chk);

     // ❌ REJECT
     if(f.status==="rejected"){
       pop.innerHTML=`
       <div class="popup">
       <h3>❌ PAYMENT REJECTED</h3>
       <button class="okBtn" onclick="location.reload()">OK</button>
       </div>`;
     }

     // ✅ APPROVED
     if(f.status==="approved"){
       pop.innerHTML=`
       <div class="popup">
       <h3>🔑 YOUR KEY</h3>

       <div class="copyBox" onclick="copyText('${f.key}')">
       ${f.key} (tap to copy)
       </div>

       <p>Kill limit 10-12 (Play Safe)</p>

       <div class="tgBtn" onclick="window.open('https://t.me/+wRZN39fdVcRkYTM9')">
       JOIN TELEGRAM
       </div>

       <br>
       <button class="okBtn" onclick="location.reload()">OK</button>
       </div>`;
     }
   }
 });
 },2000);
}

</script>  
  
</body>  
</html>
