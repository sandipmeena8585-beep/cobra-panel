<!DOCTYPE html>  
<html>  
<head>  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>COBRA SERVER PANEL</title>  
  
<style>  
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0ea5e9,#022c43);
color:#fff;
text-align:center;
}

/* HEADER */
.top{
padding:15px;
font-size:20px;
font-weight:bold;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
}

/* GLASS CARD */
.card{
background:rgba(255,255,255,0.15);
margin:15px;
padding:20px;
border-radius:20px;
backdrop-filter:blur(15px);
box-shadow:0 0 25px rgba(0,0,0,0.3);
}

/* SELECT BOX */
select{
width:90%;
padding:12px;
margin:10px;
border-radius:12px;
border:none;
font-size:16px;
}

/* BUTTON */
button{
width:90%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#4f46e5,#7c3aed);
color:white;
font-size:16px;
margin-top:10px;
}

/* INPUT */
input{
width:90%;
padding:12px;
margin:10px;
border-radius:12px;
border:none;
}

/* SMALL */
.mono{font-family:monospace}

</style>  
</head>  
  
<body>  
  
<div class="top">🔑 MULTI SERVER PANEL</div>  
  
<div id="main"></div>  
  
<script>  
  
// ================= CHECK SYSTEM =================  
fetch("/status")  
.then(r=>r.json())  
.then(d=>{  
 if(!d.on){  
   document.body.innerHTML="<h2>⚠️ PLEASE WAIT ADMIN PANEL UPDATE</h2>";  
 }else{  
   showGame();  
 }  
});  
  
// 🔥 STEP 1 GAME SELECT  
function showGame(){  
 main.innerHTML=`  
 <div class="card">  
   <h2>Purchase Your Key</h2>  
   <select onchange="loadPlans()">  
     <option>Select Game</option>  
     <option value="bgmi">BGMI</option>  
   </select>  
 </div>`;  
}  
  
// 🔥 STEP 2 SHOW PLANS  
function loadPlans(){  
 fetch("/plans")  
 .then(r=>r.json())  
 .then(data=>{  
  
  let options="";  
  
  data.forEach(p=>{  
    let name = p.type==="H" ? p.time+" Hour - ₹"+p.price : p.time+" Day - ₹"+p.price;  
    options+=`<option value="${p.type}${p.time}|${p.price}">${name}</option>`;  
  });  
  
  main.innerHTML=`  
  <div class="card">  
    <h2>Purchase Your Key</h2>  
  
    <select id="planSel">  
      ${options}  
    </select>  
  
    <button onclick="goBuy()">🔑 Purchase Key</button>  
  </div>`;  
 });  
}  
  
// 🔥 STEP 3 GO BUY  
function goBuy(){  
 let val = planSel.value.split("|");  
 buy(val[0],val[1]);  
}  
  
// ================= BUY =================  
function buy(plan,price){  
  
 fetch("/settings")  
 .then(r=>r.json())  
 .then(s=>{  
  
  main.innerHTML=`  
  <div class="card">  
    <h3>PAYMENT</h3>  
    <p>Pay ₹${price}</p>  
  
    <div class="mono" onclick="copy('${s.upi}')">  
    ${s.upi}  
    </div>  
  
    <br>  
    <img src="${s.qr}" width="200">  
  
    <input id="utr" placeholder="ENTER UTR">  
    <button onclick="verify('${plan}')">VERIFY</button>  
  </div>  
  `;  
 });  
}  
  
// ================= COPY =================  
function copy(t){  
 navigator.clipboard.writeText(t);  
 alert("UPI COPIED");  
}  
  
// ================= VERIFY =================  
function verify(plan){  
  
 let u = prompt("Enter Name");  
 let utrVal = utr.value;  
  
 if(!utrVal || utrVal.length<6){  
   return alert("Invalid UTR");  
 }  
  
 fetch("/buy",{  
  method:"POST",  
  headers:{"Content-Type":"application/json"},  
  body:JSON.stringify({  
    user:u,  
    plan:plan,  
    utr:utrVal  
  })  
 }).then(()=>{  
  
  localStorage.setItem("pending",plan);  
  waitScreen();  
 });  
}  
  
// ================= WAIT =================  
function waitScreen(){  
  
 main.innerHTML=`  
 <div class="card">  
 <h3>PLEASE WAIT VERIFY ADMIN</h3>  
 <p>Processing...</p>  
 </div>`;  
  
 checkStatus();  
}  
  
// ================= CHECK =================  
function checkStatus(){  
 setInterval(()=>{  
 fetch("/history")  
 .then(r=>r.json())  
 .then(h=>{  
  
   let p = localStorage.getItem("pending");  
   let found = h.find(x=>x.plan===p);  
  
   if(found){  
  
     if(found.status==="APPROVED"){  
       showKey(found.key,p);  
     }else{  
       showWarning();  
     }  
  
   }  
  
 });  
 },3000);  
}  
  
// ================= KEY =================  
function showKey(key,plan){  
  
 localStorage.removeItem("pending");  
  
 let expire = new Date();  
 expire.setHours(expire.getHours()+12);  
  
 main.innerHTML=`  
 <div class="card">  
 <h3>KEY</h3>  
 <div class="mono" onclick="copy('${key}')">${key}</div>  
 <p>EXPIRE: ${expire.toLocaleString()}</p>  
 <button onclick="tg()">TELEGRAM</button>  
 </div>`;  
}  
  
// ================= WARNING =================  
function showWarning(){  
 localStorage.removeItem("pending");  
  
 main.innerHTML=`  
 <div class="card">  
 ⚠️ PAYMENT FAILED / REJECTED  
 </div>`;  
  
 setTimeout(showGame,3000);  
}  
  
// ================= TG =================  
function tg(){  
 window.open("https://t.me/GODx_COBRA");  
}  
  
if(localStorage.getItem("pending")){  
 waitScreen();  
}  
  
</script>  
  
</body>  
</html>
