<script>

// SAFE ELEMENT SELECT
const panel = document.getElementById("panel");
const stockPage = document.getElementById("stockPage");
const requestPage = document.getElementById("requestPage");
const dataBox = document.getElementById("data");
const stockList = document.getElementById("stockList");
const stockCount = document.getElementById("stockCount");

// MENU
function toggleMenu(){
  document.getElementById("sidebar").classList.add("active");
  document.getElementById("overlay").classList.add("active");
}

function closeMenu(){
  document.getElementById("sidebar").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}

// NAV
function go(p){
  panel.style.display="none";
  stockPage.style.display="none";
  requestPage.style.display="none";

  document.getElementById(p).style.display="block";

  if(p==="requestPage"){
    loadRequests();
  }
}

// LOGIN
async function login(){
  try{

    let res = await fetch("/login",{
      method:"POST",
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        user:user.value,
        pass:pass.value,
        device:navigator.userAgent
      })
    });

    let d = await res.json();

    if(d.status==="ok"){
      loginBox.style.display="none";
      panel.style.display="block";
      menuBtn.style.display="block";

      loadStock();
      loadStockCount();
      loadRequests();
    }else{
      alert("Wrong Login");
    }

  }catch(e){
    alert("SERVER ERROR");
  }
}

// REQUEST
async function loadRequests(){
  try{

    let res = await fetch("/admin/data");
    let arr = await res.json();

    let html="";

    arr.reverse().forEach(x=>{
      if(x.status==="pending"){

        let img="";
        if(x.file){
          img = "<img src='/uploads/"+x.file+"' style='width:100%;border-radius:10px'>";
        }

        html += `
        <div class="card">
          ${x.plan}<br>
          ${x.utr || "N/A"}<br>
          ${x.time || ""}<br>
          ${img}<br>
          <button onclick="verify(${x.id},event)">YES</button>
          <button onclick="reject(${x.id},event)">NO</button>
        </div>`;
      }
    });

    dataBox.innerHTML = html || "No Requests";

  }catch(e){
    console.log(e);
  }
}

// VERIFY
async function verify(id,e){
  e.target.parentElement.remove();
  await fetch("/admin/verify/"+id);
}

// REJECT
async function reject(id,e){
  e.target.parentElement.remove();
  await fetch("/admin/reject/"+id);
}

// STOCK
async function loadStock(){
  let res = await fetch("/admin/stock");
  let data = await res.json();

  let html="";

  for(let p in data){
    html += `<div class="card">${p}<br>`;

    data[p].forEach(k=>{
      html += k+"<br>";
    });

    html += "</div>";
  }

  stockList.innerHTML = html;
}

// COUNT
async function loadStockCount(){
  let res = await fetch("/admin/stock");
  let data = await res.json();

  let total = 0;
  for(let p in data){
    total += data[p].length;
  }

  stockCount.innerText="Stock: "+total;
}

// ADD KEY
async function addKey(){
  if(!newkey.value) return;

  await fetch("/admin/addkey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      plan:plan.value,
      key:newkey.value
    })
  });

  newkey.value="";
  loadStock();
}

// AUTO
setInterval(()=>{
  loadStock();
  loadStockCount();
},3000);

</script>
