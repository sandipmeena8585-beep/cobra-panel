<script>

// MENU
function toggleMenu(){
  sidebar.classList.add("active");
  overlay.classList.add("active");
}
function closeMenu(){
  sidebar.classList.remove("active");
  overlay.classList.remove("active");
}

// NAV
function go(p){
  closeMenu();
  panel.classList.add("hidden");
  stockPage.classList.add("hidden");
  requestPage.classList.add("hidden");
  document.getElementById(p).classList.remove("hidden");
}

// LOGIN
async function login(){
  let res = await fetch("/login",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      user:user.value,
      pass:pass.value,
      device:navigator.userAgent
    })
  });

  let d = await res.json();

  if(d.status==="ok"){
    loginBox.classList.add("hidden");
    panel.classList.remove("hidden");
    menuBtn.style.display="block";

    loadStock();
    loadStockCount();
  }else{
    alert("Wrong Login");
  }
}

// STOCK LOAD
async function loadStock(){
  let res = await fetch("/admin/stock");
  let data = await res.json();

  let html="";

  for(let p in data){

    html+=`<div class="card"><b>${p.toUpperCase()}</b><br><br>`;

    if(data[p].length === 0){
      html+="No Keys<br>";
    }

    data[p].forEach(k=>{
      html+=`
      <div style="display:flex;justify-content:space-between;margin:5px 0;">
        <span>${k}</span>
        <button style="padding:4px 8px;font-size:12px;"
        onclick="deleteKey('${p}','${k}')">❌</button>
      </div>`;
    });

    html+="</div>";
  }

  stockList.innerHTML = html;
}

// STOCK COUNT
async function loadStockCount(){
  let res = await fetch("/admin/stock");
  let stock = await res.json();

  let total = 0;
  for(let p in stock){
    total += stock[p].length;
  }

  stockCount.innerText="Stock: "+total;
}

// 🔥 UPDATED ADD KEY (10 SECOND SHOW)
async function addKey(){

  if(!newkey.value.trim()) return alert("Enter key");

  let keyVal = newkey.value;

  await fetch("/admin/addkey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      plan:plan.value,
      key:keyVal
    })
  });

  // 🔥 TEMP SHOW TOP
  let temp = document.createElement("div");
  temp.className = "card";
  temp.innerHTML = `<b>ADDED:</b> ${keyVal}`;

  stockList.prepend(temp);

  setTimeout(()=>{
    temp.remove();
  },10000);

  newkey.value="";
  loadStock();
  loadStockCount();
}

// DELETE KEY
async function deleteKey(plan,key){
  await fetch("/admin/deletekey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plan,key})
  });

  loadStock();
  loadStockCount();
}

// AUTO REFRESH
setInterval(()=>{
  loadStock();
  loadStockCount();
},3000);

// LOGOUT
function logout(){
  location.reload();
}

</script>
