<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL</title>

<style>
body{
  margin:0;
  background:#030a14;
  color:white;
  font-family:system-ui;
}

.box{
  max-width:420px;
  margin:auto;
  padding:15px;
  background:#081426;
  border-radius:18px;
  margin-top:15px;
  box-shadow:0 0 15px rgba(0,255,255,0.1);
}

h2,h3{
  text-align:center;
  color:#00f2ff;
}

input,select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  background:#0c1d33;
  color:white;
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#00f2ff,#007bff);
  width:100%;
  margin-top:5px;
  color:white;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.logout{
  background:red;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

.card{
  background:#0c1d33;
  padding:10px;
  border-radius:10px;
  margin:5px 0;
  text-align:center;
}

.req{
  border:1px solid #00f2ff;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="box">

<h2>🔐 ADMIN LOGIN</h2>

<input id="user" placeholder="Username">
<input id="pass" placeholder="Password">

<button onclick="login()">LOGIN</button>

<!-- PANEL -->
<div id="panel" class="hidden">

<div class="topbar">
<div>🟢 ADMIN PANEL</div>
<div class="logout" onclick="logout()">LOGOUT</div>
</div>

<h3>📊 Dashboard</h3>

<div class="card" id="sales">Sales: 0</div>
<div class="card" id="stock">Stock: 0</div>
<div class="card" id="pending">Pending: 0</div>

<h3>📦 Add Stock</h3>

<select id="plan">
<option value="1hour">1 Hour</option>
<option value="3hour">3 Hour</option>
<option value="1day">1 Day</option>
<option value="3day">3 Day</option>
<option value="7day">7 Day</option>
</select>

<input id="newkey" placeholder="Enter New Key">

<button onclick="addKey()">ADD KEY</button>

<h3>📥 Requests</h3>
<div id="data"></div>

<h3>📜 History</h3>
<div id="history"></div>

</div>

</div>

<script>

// 🔥 SESSION (2 HOURS)
function checkSession(){
  let t = localStorage.getItem("adminLogin");

  if(t && (Date.now()-t < 2*60*60*1000)){
    document.getElementById("panel").classList.remove("hidden");
    load();
  }
}
checkSession();

// LOGIN
function login(){
  let u=document.getElementById("user").value.trim();
  let p=document.getElementById("pass").value.trim();

  if(u==="COBRA SERVER" && p==="SAMI9166"){
    localStorage.setItem("adminLogin",Date.now());
    document.getElementById("panel").classList.remove("hidden");
    load();
  }else{
    alert("Wrong Login");
  }
}

// LOGOUT
function logout(){
  localStorage.removeItem("adminLogin");
  location.reload();
}

// 🔥 LOAD DATA
async function load(){

  // 🔥 REQUEST + HISTORY
  let res = await fetch("/admin/data");
  let data = await res.json();

  let pendingHTML="";
  let historyHTML="";

  let sales=0;
  let pending=0;

  data.forEach(x=>{

    if(x.status==="pending"){
      pending++;

      pendingHTML+=`
      <div class="req">
      📦 ${x.plan}<br>
      🧾 ${x.utr}<br>
      ⏰ ${x.time || ""}
      <br>
      ${x.file ? `<img src="${x.file}" width="100">` : ""}
      <br>
      <button onclick="verify(${x.id})">VERIFY</button>
      <button onclick="reject(${x.id})">REJECT</button>
      </div>`;
    }

    if(x.status==="approved"){
      sales++;

      historyHTML+=`
      <div class="req">
      ✅ ${x.plan} → ${x.key}<br>
      ⏰ ${x.time || ""}
      </div>`;
    }

    if(x.status==="rejected"){
      historyHTML+=`
      <div class="req">
      ❌ ${x.plan} → REJECTED<br>
      ⏰ ${x.time || ""}
      </div>`;
    }

  });

  document.getElementById("data").innerHTML=pendingHTML;
  document.getElementById("history").innerHTML=historyHTML;

  document.getElementById("sales").innerText="Sales: "+sales;
  document.getElementById("pending").innerText="Pending: "+pending;

  // 🔥 STOCK LIVE FETCH
  let s = await fetch("/admin/stock");
  let st = await s.json();

  document.getElementById("stock").innerText="Stock: "+st.total;
}

// VERIFY (NO CHANGE - backend handle karega)
async function verify(id){
  await fetch("/admin/verify/"+id);
  load();
}

// REJECT
async function reject(id){
  await fetch("/admin/reject/"+id);
  load();
}

// ADD KEY (PLAN WISE)
async function addKey(){

  let plan=document.getElementById("plan").value;
  let key=document.getElementById("newkey").value;

  await fetch("/admin/addkey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plan,key})
  });

  alert("Key Added");
  load();
}

// AUTO REFRESH
setInterval(load,3000);

</script>

</body>
</html>
