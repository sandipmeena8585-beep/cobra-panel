<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<input id="user" placeholder="Username">
<input id="pass" placeholder="Password">
<input id="otp" placeholder="OTP">

<button onclick="sendOTP()">GET OTP</button>
<button onclick="login()">LOGIN</button>

<canvas id="chart"></canvas>
<div id="data"></div>

<script>

async function sendOTP(){
  let r = await fetch("/admin/send-otp");
  let d = await r.json();
  alert("OTP: "+d.otp);
}

async function login(){

  let r = await fetch("/admin/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      user:user.value,
      pass:pass.value,
      otp:otp.value
    })
  });

  let d = await r.json();

  if(d.status==="success"){
    load();
  } else alert("Wrong");
}

async function load(){

  let r = await fetch("/admin/stats");
  let d = await r.json();

  new Chart(chart,{
    type:"bar",
    data:{
      labels:["Approved","Rejected"],
      datasets:[{data:[d.approved,d.rejected]}]
    }
  });

  let html="";

  d.data.forEach((x,i)=>{
    html+=`
    <div>
      Plan:${x.plan}<br>
      UTR:${x.utr}<br>
      <img src="${x.file}" width="100"><br>
      <button onclick="v(${i})">Verify</button>
      <button onclick="rj(${i})">Reject</button>
    </div>`;
  });

  data.innerHTML=html;
}

async function v(i){
  await fetch("/admin/verify/"+i);
  load();
}

async function rj(i){
  await fetch("/admin/reject/"+i);
  load();
}

</script>
