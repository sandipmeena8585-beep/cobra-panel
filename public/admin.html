<!-- 📊 REAL GRAPH (ADD INSIDE DASHBOARD CARD) -->
<canvas id="salesChart" style="width:100%;margin-top:10px;"></canvas>

<!-- 📦 CHART.JS CDN (ADD BEFORE </body>) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
// 📊 DEMO GRAPH DATA (UI ONLY)
const ctx = document.getElementById('salesChart');

new Chart(ctx, {
  type: 'bar',
  data: {
    labels: ['1hour','3hour','1day','3day','7day'],
    datasets: [{
      label: 'Sales',
      data: [5, 8, 12, 6, 9],
      borderWidth: 1
    }]
  },
  options: {
    responsive: true,
    plugins:{
      legend:{display:false}
    },
    scales: {
      y: {
        beginAtZero: true
      }
    }
  }
});
</script>
