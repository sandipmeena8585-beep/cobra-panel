<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA ADMIN</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#3aa0d8,#2c8fc7);
color:#fff;
}

/* LOGIN */
.login{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.login img{
width:100px;
margin-bottom:20px;
}

.login input{
width:80%;
max-width:320px;
padding:14px;
margin:8px;
border:none;
border-radius:5px;
}

.login button{
width:80%;
max-width:320px;
padding:14px;
border-radius:30px;
border:1px solid #fff;
background:transparent;
color:#fff;
}

/* TOP BAR */
.top{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:rgba(0,0,0,0.2);
position:fixed;
width:100%;
top:0;
backdrop-filter:blur(10px);
z-index:1000; /* 🔥 FIX (menu hide issue solved) */
}

/* 🔥 GLOW TITLE */
.title{
font-weight:bold;
animation:glow 1.5s infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 5px #fff;}
to{ text-shadow:0 0 15px #00f0ff,0 0 25px #00f0ff;}
}

/* MENU ICON */
.menuIcon{
font-size:24px;
cursor:pointer;
z-index:1001; /* 🔥 always visible */
}

/* SIDEBAR */
.sidebar{
position:fixed;
left:-250px;
width:250px;
height:100%;
background:rgba(0,0,0,0.7);
transition:.3s;
padding-top:60px;
backdrop-filter:blur(10px);
z-index:999;
}
.sidebar.active{left:0}

.sidebar div{
padding:12px;
margin:8px;
background:rgba(255,255,255,0.1);
border-radius:8px;
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
display:none;
z-index:998;
}
.overlay.active{display:block}

/* CONTENT */
.content{
margin-top:60px;
padding:10px;
}

.card{
background:rgba(255,255,255,0.15);
padding:15px;
margin:10px 0;
border-radius:12px;
backdrop-filter:blur(10px);
}

button{
padding:10px;
border:none;
border-radius:6px;
margin:5px;
}

.green{background:#22c55e}
.red{background:#ef4444}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="login">

<img src="https://cdn-icons-png.flaticon.com/512/2920/2920349.png">

<input id="u" placeholder="User name">
<input id="p" type="password" placeholder="Password">

<label style="font-size:14px">
<input type="checkbox"> Save Password
</label>

<button onclick="login()">LOGIN</button>

</div>

<!-- PANEL -->
<div id="panel" style="display:none">

<div class="top">
  <div class="title">COBRA ADMIN</div>
  <div class="menuIcon" onclick="toggleMenu()">☰</div>
</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<div id="sidebar" class="sidebar">
<div onclick="home()">HOME</div>
<div onclick="plansUI()">PLANS</div>
<div onclick="stockUI()">STOCK</div>
<div onclick="settingsUI()">UPI / QR</div>
<div onclick="reqUI()">REQUEST</div>
<div onclick="toggleSystem()">ON/OFF PANEL</div>
<div onclick="logout()">LOGOUT</div>
</div>

<div class="content" id="main"></div>

</div>

<script>

// LOGIN
function login(){
 if(u.value==="COBRA SERVER" && p.value==="SAMI9166"){
  localStorage.setItem("admin","1");
  start();
 }else alert("Wrong");
}

function start(){
 loginBox.style.display="none";
 panel.style.display="block";
 home();
}

if(localStorage.getItem("admin")=="1") start();

function logout(){
 localStorage.removeItem("admin");
 location.reload();
}

// MENU
function toggleMenu(){
 sidebar.classList.toggle("active");
 overlay.classList.toggle("active");
}

function closeMenu(){
 sidebar.classList.remove("active");
 overlay.classList.remove("active");
}

// HOME
function home(){
 main.innerHTML="<h2>LIVE CONTROL RUNNING</h2>";
 closeMenu();
}

// बाकी code SAME (touch नहीं किया)

</script>

</body>
</html>
