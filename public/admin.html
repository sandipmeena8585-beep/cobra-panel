<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA ADMIN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#020617;
  color:white;
}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:12px 15px;
}

.sidebar{
  position:fixed;
  left:-260px;
  width:240px;
  height:100%;
  background:#020617;
  transition:0.3s;
}
.sidebar.active{left:0;}

.container{
  padding:15px;
}

.card{
  padding:15px;
  border-radius:15px;
  background:linear-gradient(135deg,#16a34a,#22c55e);
  margin-bottom:10px;
}

.loginBox{
  width:90%;
  max-width:300px;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#0b1220;
  border-radius:15px;
}

.loginTop{
  padding:20px;
  text-align:center;
  background:linear-gradient(135deg,#0f766e,#22c55e);
}

.loginBody{
  padding:15px;
}

input,select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  background:#111827;
  color:white;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  margin-top:5px;
}

.hidden{display:none;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="loginBox">
<div class="loginTop">Welcome Back</div>
<div class="loginBody">
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>
</div>

<!-- PANEL -->
<div id="panel" class="container hidden">

<div class="card" id="stockCount">Stock: 0</div>

<!-- STOCK -->
<div class="card">
<select id="plan">
<option value="1hour">1 Hour</option>
<option value="3hour">3 Hour</option>
<option value="1day">1 Day</option>
<option value="3day">3 Day</option>
<option value="7day">7 Day</option>
</select>

<input id="newkey" placeholder="Enter Key">
<button onclick="addKey()">ADD KEY</button>
</div>

<div id="stockList"></div>

<h3>REQUESTS</h3>
<div id="data"></div>

</div>

<script>

// LOGIN
async function login(){
let res = await fetch("/login",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
user:user.value,
pass:pass.value,
device:navigator.userAgent
})
});

let d = await res.json();

if(d.status==="ok"){
loginBox.style.display="none";
panel.classList.remove("hidden");

loadStock();
loadRequests();
}else{
alert("Wrong Login");
}
}

// REQUEST LOAD (FULL DETAIL)
async function loadRequests(){
let res = await fetch("/admin/data");
let arr = await res.json();

let html="";

arr.reverse().forEach(x=>{
if(x.status==="pending"){

html+=`
<div class="card">

<b>Plan:</b> ${x.plan}<br>
<b>UTR:</b> ${x.utr || "N/A"}<br>
<b>Time:</b> ${x.time || "N/A"}<br><br>

${x.file ? `<img src="/uploads/${x.file}" style="width:100%;border-radius:10px;">` : ""}

<button onclick="verify(${x.id},this)">✅ YES</button>
<button onclick="reject(${x.id},this)">❌ NO</button>

</div>`;
}
});

data.innerHTML = html || "<div class='card'>No Requests</div>";
}

// VERIFY (REMOVE + HIDE)
async function verify(id,btn){
btn.parentElement.remove();
await fetch("/admin/verify/"+id);
loadStock();
}

// REJECT (HIDE)
async function reject(id,btn){
btn.parentElement.remove();
await fetch("/admin/reject/"+id);
}

// STOCK
async function loadStock(){
let res = await fetch("/admin/stock");
let data = await res.json();

let html="",total=0;

for(let p in data){
html+=`<div class="card"><b>${p}</b><br>`;

data[p].forEach(k=>{
html+=k+"<br>";
total++;
});

html+="</div>";
}

stockList.innerHTML = html;
stockCount.innerText="Stock: "+total;
}

// ADD KEY
async function addKey(){
if(!newkey.value.trim()) return;

await fetch("/admin/addkey",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
plan:plan.value,
key:newkey.value
})
});

newkey.value="";
loadStock();
}

// AUTO REFRESH
setInterval(()=>{
loadStock();
loadRequests();
},3000);

</script>

</body>
</html>
