<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

/* LOGIN */
.login{
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 height:100vh;
 background:linear-gradient(135deg,#0f766e,#22c55e);
}
.login input,.login button{
 width:80%;
 max-width:300px;
 padding:12px;
 margin:10px;
 border:none;
 border-radius:6px;
}
.login button{background:#000;color:#fff}

/* TOP */
.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px;
 background:#020617;
 position:fixed;
 width:100%;
 top:0;
 z-index:1000;
}

/* SIDEBAR */
.sidebar{
 position:fixed;
 top:0;
 left:-250px;
 width:250px;
 height:100%;
 background:#1e293b;
 padding-top:60px;
 transition:.3s;
 z-index:999;
}
.sidebar.active{left:0}
.sidebar div{
 padding:12px;
 background:#334155;
 margin:8px;
 border-radius:8px;
}

/* CONTENT FIX */
.content{
 margin-top:60px;
 padding:10px;
}

/* CARD */
.card{
 background:#1e293b;
 padding:15px;
 border-radius:10px;
 margin:10px 0;
}

/* BUTTON */
button{
 padding:10px;
 border:none;
 border-radius:6px;
 margin:5px;
}
.green{background:#22c55e}
.red{background:#ef4444}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="login">
<h2>ADMIN LOGIN</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- PANEL -->
<div id="panel" style="display:none">

<div class="topbar">
<div onclick="toggleMenu()">☰</div>
<div>ADMIN PANEL</div>
</div>

<div id="sidebar" class="sidebar">
<div onclick="showTab('home')">Home</div>
<div onclick="showTab('requests')">Requests</div>
<div onclick="showTab('customer')">Customer</div>
<div onclick="showTab('stock')">Stock</div>
<div onclick="logout()">Logout</div>
</div>

<div class="content" id="main"></div>

</div>

<script>

// 🔐 LOGIN
function login(){
 let u=document.getElementById("u").value;
 let p=document.getElementById("p").value;

 if(u==="COBRA SERVER" && p==="SAMI9166"){
   localStorage.setItem("admin","1");
   start();
 }else alert("Wrong");
}

// 🔐 START
function start(){
 document.getElementById("loginBox").style.display="none";
 document.getElementById("panel").style.display="block";
 showTab("home");
}
if(localStorage.getItem("admin")=="1") start();

// 🔐 LOGOUT
function logout(){
 localStorage.removeItem("admin");
 location.reload();
}

// MENU
function toggleMenu(){
 document.getElementById("sidebar").classList.toggle("active");
}

// 🔥 TAB SWITCH
function showTab(tab){

// 🔥 auto close menu (mobile fix)
document.getElementById("sidebar").classList.remove("active");

let html="";

if(tab==="home"){
 html=`<h2>Dashboard</h2>
 <button onclick="toggleSystem()" id="toggleBtn">Toggle System</button>`;
 loadToggle();
}

if(tab==="requests"){
 html="<h2>Requests</h2><div id='req'>Loading...</div>";
 loadRequests();
}

if(tab==="customer"){
 html=`<h2>Customer Control</h2>
 <button onclick="toggleSystem()">ON/OFF PANEL</button>
 <div class="card">
 <input id="price" placeholder="Change Price">
 <button onclick="updatePrice()">Update</button>
 </div>`;
}

if(tab==="stock"){
 html=`<h2>Stock</h2>
 <div class="card">
 <input id="key" placeholder="Add Key">
 <button onclick="addKey()">Add</button>
 </div>
 <div id="stockList"></div>`;
 loadStock();
}

document.getElementById("main").innerHTML=html;
}

// ================= API =================

// REQUESTS
function loadRequests(){
 fetch("/requests")
 .then(r=>r.json())
 .then(data=>{
   let h="";
   data.forEach(x=>{
     h+=`<div class="card">
     ${x.user} - ${x.plan}
     <br>
     <button class="green" onclick="approve('${x.user}')">Approve</button>
     <button class="red" onclick="reject('${x.user}')">Reject</button>
     </div>`;
   });
   document.getElementById("req").innerHTML=h||"No Requests";
 });
}

function approve(u){
 fetch("/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u})})
 .then(loadRequests);
}

function reject(u){
 fetch("/reject",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u})})
 .then(loadRequests);
}

// TOGGLE
function toggleSystem(){
 fetch("/toggle",{method:"POST"})
 .then(r=>r.json())
 .then(d=>{
   alert(d.on?"ON":"OFF");
 });
}

function loadToggle(){
 fetch("/status")
 .then(r=>r.json())
 .then(d=>{
   let b=document.getElementById("toggleBtn");
   if(b) b.innerText=d.on?"SYSTEM ON":"SYSTEM OFF";
 });
}

// STOCK (FRONTEND DEMO)
let stock=[];
function addKey(){
 let k=document.getElementById("key").value;
 stock.push(k);
 loadStock();
}
function loadStock(){
 let h="";
 stock.forEach(k=>{
   h+=`<div class="card">${k}</div>`;
 });
 document.getElementById("stockList").innerHTML=h;
}

// PRICE
function updatePrice(){
 alert("Price Updated (connect backend later)");
}

</script>

</body>
</html>
