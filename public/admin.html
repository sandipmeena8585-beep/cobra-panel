<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL</title>

<style>
body{
  margin:0;
  background:#030a14;
  color:white;
  font-family:system-ui;
}

.box{
  max-width:420px;
  margin:auto;
  padding:15px;
  background:#081426;
  border-radius:18px;
  margin-top:15px;
}

h2,h3{
  text-align:center;
  color:#00f2ff;
}

input,select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  background:#0c1d33;
  color:white;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#00f2ff,#007bff);
  width:100%;
  margin-top:5px;
  color:white;
}

.card{
  background:#0c1d33;
  padding:10px;
  border-radius:10px;
  margin:6px 0;
  text-align:center;
}

.req{
  border:1px solid #00f2ff;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
}

.topActions{
  display:flex;
  gap:10px;
}

.topActions button{
  flex:1;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="box">

<!-- LOGIN -->
<div id="loginBox">
<h2>🔐 ADMIN LOGIN</h2>
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>

<!-- PANEL -->
<div id="panel" class="hidden">

<h3>📊 Dashboard</h3>

<div class="card" onclick="openStock()">📦 STOCK (CLICK)</div>
<div class="card" id="sales">Sales: 0</div>
<div class="card" id="pending">Pending: 0</div>

<h3>📥 Requests</h3>
<div id="data"></div>

</div>

<!-- 🔥 STOCK FLOOR -->
<div id="stockPage" class="hidden">

<button onclick="back()">⬅ BACK</button>

<h3>📦 STOCK PANEL</h3>

<!-- 🔥 TOP OPTIONS -->
<div class="topActions">
<button onclick="focusAdd()">➕ ADD</button>
<button onclick="loadStock()">🔄 REFRESH</button>
</div>

<!-- 🔥 ADD SECTION -->
<div class="card" id="addSection">

<h3>➕ Add Key</h3>

<select id="plan">
<option value="1hour">1 Hour</option>
<option value="3hour">3 Hour</option>
<option value="1day">1 Day</option>
<option value="3day">3 Day</option>
<option value="7day">7 Day</option>
</select>

<input id="newkey" placeholder="Enter Key">
<button onclick="addKey(event)">ADD KEY</button>

</div>

<!-- 🔥 SUMMARY -->
<h3>📊 SUMMARY</h3>
<div id="summary"></div>

<!-- 🔥 STOCK LIST -->
<h3>📦 AVAILABLE KEYS</h3>
<div id="stockList"></div>

<!-- 🔥 SOLD -->
<h3>📤 SOLD KEYS</h3>
<div id="soldList"></div>

</div>

</div>

<script>

// LOGIN
function login(){
  if(user.value==="COBRA SERVER" && pass.value==="SAMI9166"){
    loginBox.style.display="none";
    panel.classList.remove("hidden");
    load();
  }else alert("Wrong Login");
}

// NAV
function openStock(){
  panel.classList.add("hidden");
  stockPage.classList.remove("hidden");
  loadStock();
}

function back(){
  stockPage.classList.add("hidden");
  panel.classList.remove("hidden");
}

// SCROLL TO ADD
function focusAdd(){
  document.getElementById("addSection").scrollIntoView({behavior:"smooth"});
}

// DASHBOARD
async function load(){

  let res = await fetch("/admin/data?time="+Date.now());
  let arr = await res.json();

  let html="";
  let sales=0,pending=0;

  arr.forEach(x=>{
    if(x.status==="pending"){
      pending++;

      html+=`
      <div class="req">
      📦 ${x.plan}<br>
      🧾 ${x.utr}<br>
      <button onclick="verify(${x.id})">VERIFY</button>
      <button onclick="reject(${x.id})">REJECT</button>
      </div>`;
    }

    if(x.status==="approved") sales++;
  });

  data.innerHTML=html;
  sales.innerText="Sales: "+sales;
  pending.innerText="Pending: "+pending;
}

// STOCK
async function loadStock(){

  let s = await fetch("/admin/stock?time="+Date.now());
  let st = await s.json();

  let html="";
  let total=0;

  for(let p in st.stock){

    let keys = st.stock[p];
    total+=keys.length;

    html+=`<div class="card"><b>${p} (${keys.length})</b><br>`;

    keys.forEach(key=>{
      html+=`
      <div style="margin:5px 0;border:1px solid #00f2ff;padding:6px;border-radius:8px;">
      ${key}
      <button onclick="deleteKey('${p}','${key}')">❌ DELETE</button>
      </div>`;
    });

    html+=`</div>`;
  }

  stockList.innerHTML=html;

  // SOLD
  let h = await fetch("/admin/data?time="+Date.now());
  let arr = await h.json();

  let sold=0, soldHTML="";

  arr.forEach(x=>{
    if(x.status==="approved"){
      sold++;
      soldHTML+=`<div class="req">${x.plan} → ${x.key}</div>`;
    }
  });

  summary.innerHTML=`
  <div class="card">
  📦 Total: ${total}<br>
  💰 Sold: ${sold}<br>
  🔄 Remaining: ${total}
  </div>`;

  soldList.innerHTML=soldHTML;
}

// VERIFY
async function verify(id){
  await fetch("/admin/verify/"+id);
  load();
}

// REJECT
async function reject(id){
  await fetch("/admin/reject/"+id);
  load();
}

// ADD
async function addKey(e){

  let p=plan.value;
  let k=newkey.value.trim();

  if(!k){ alert("Enter key"); return; }

  e.target.disabled=true;

  await fetch("/admin/addkey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plan:p,key:k})
  });

  newkey.value="";
  setTimeout(loadStock,300);

  e.target.disabled=false;
}

// DELETE
async function deleteKey(plan,key){

  if(!confirm("Delete key?")) return;

  await fetch("/admin/deletekey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plan,key})
  });

  loadStock();
}

// AUTO REFRESH
setInterval(()=>{
  if(!stockPage.classList.contains("hidden")){
    loadStock();
  }else{
    load();
  }
},2000);

</script>

</body>
</html>
