<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA ADMIN</title>

<style>
body{margin:0;font-family:sans-serif;background:#020617;color:white;}
.container{padding:15px}
.card{background:#0f172a;padding:12px;margin:10px 0;border-radius:10px}
button{width:100%;padding:10px;margin-top:5px;background:#22c55e;border:none;border-radius:8px;color:white}
input,select{width:100%;padding:10px;margin:5px 0;background:#111827;color:white;border:none;border-radius:8px}
.hidden{display:none;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="container">
<h2>LOGIN</h2>
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>

<!-- PANEL -->
<div id="panel" class="container hidden">

<div class="card" id="stockCount">Stock: 0</div>

<!-- STOCK -->
<div class="card">
<select id="plan">
<option value="1hour">1hour</option>
<option value="3hour">3hour</option>
<option value="1day">1day</option>
<option value="3day">3day</option>
<option value="7day">7day</option>
</select>

<input id="newkey" placeholder="Enter Key">
<button onclick="addKey()">ADD KEY</button>
</div>

<div id="stockList"></div>

<h3>REQUESTS</h3>
<div id="data"></div>

</div>

<script>

// LOGIN
async function login(){
let res = await fetch("/login",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
user:user.value,
pass:pass.value,
device:navigator.userAgent
})
});

let d = await res.json();

if(d.status==="ok"){
loginBox.style.display="none";
panel.classList.remove("hidden");

loadStock();
loadRequests();
}else{
alert("Wrong Login");
}
}

// REQUEST
async function loadRequests(){
let res = await fetch("/admin/data");
let arr = await res.json();

let html="";

arr.forEach(x=>{
if(x.status==="pending"){

let img="";
if(x.file){
img=`<img src="/uploads/${x.file}" width="100%">`;
}

html+=`
<div class="card">
${x.plan}<br>
UTR: ${x.utr || "N/A"}<br>
Time: ${x.time}<br>
${img}
<button onclick="verify(${x.id},this)">YES</button>
<button onclick="reject(${x.id},this)">NO</button>
</div>`;
}
});

data.innerHTML=html;
}

// VERIFY
async function verify(id,btn){
btn.parentElement.remove();
await fetch("/admin/verify/"+id);
loadStock();
}

// REJECT
async function reject(id,btn){
btn.parentElement.remove();
await fetch("/admin/reject/"+id);
}

// STOCK
async function loadStock(){
let res=await fetch("/admin/stock");
let data=await res.json();

let html="",total=0;

for(let p in data){
html+=`<div class="card">${p}<br>`;
data[p].forEach(k=>{
html+=k+"<br>";
total++;
});
html+="</div>";
}

stockList.innerHTML=html;
stockCount.innerText="Stock: "+total;
}

// ADD
async function addKey(){
await fetch("/admin/addkey",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
plan:plan.value,
key:newkey.value
})
});

newkey.value="";
loadStock();
}

// AUTO
setInterval(()=>{
loadStock();
loadRequests();
},3000);

</script>

</body>
</html>
