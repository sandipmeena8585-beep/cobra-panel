<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>COBRA ADMIN</title>

<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff}

/* LOGIN */
#loginWrap{
display:flex;justify-content:center;align-items:center;height:100vh;
}
.loginBox{
background:#111;padding:30px;border-radius:12px;width:260px;text-align:center;
}
input{width:90%;padding:8px;margin:6px;border:none;border-radius:6px}
button{padding:8px 12px;border:none;border-radius:6px;background:#22c55e}

/* HEADER */
.header{
display:flex;align-items:center;padding:10px;background:#111;
}
.menuBtn{font-size:20px;cursor:pointer;margin-right:10px}

/* SIDEBAR */
.sidebar{
position:fixed;top:0;left:-220px;width:200px;height:100%;
background:#111;padding:10px;transition:.3s;
}
.sidebar.active{left:0}
.sideItem{padding:10px;border-bottom:1px solid #222;cursor:pointer}

/* DASHBOARD */
#dashboard{display:none;padding:10px}
.row{display:flex;gap:10px}
.left,.right{flex:1}

.card{
background:#111;padding:10px;margin:6px;border-radius:10px;font-size:13px;
}

.small{font-size:12px;color:#aaa}
.history{max-height:200px;overflow:auto}
</style>

</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <div class="loginBox">
    <h2>Welcome Back</h2>
    <small>COBRA ADMIN</small><br><br>

    <input id="user" placeholder="Username">
    <input id="pass" placeholder="Password">
    <button onclick="login()">LOGIN</button>
  </div>
</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
  <div class="sideItem" onclick="showPage('home')">Home</div>
  <div class="sideItem" onclick="showPage('request')">Request</div>
  <div class="sideItem" onclick="showPage('user')">Manage User</div>
  <div class="sideItem" onclick="showPage('control')">Online Control</div>
</div>

<!-- HEADER -->
<div id="header" class="header" style="display:none;">
  <div class="menuBtn" onclick="toggleMenu()">☰</div>
  <b>COBRA ADMIN PANEL</b>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

  <!-- HOME -->
  <div id="home">

    <!-- TOGGLE -->
    <div class="card">
      Customer Panel:
      <input type="checkbox" id="customerToggle" onchange="toggleCustomer()">
      <span id="toggleStatus"></span>
    </div>

    <div class="row">

      <!-- LEFT -->
      <div class="left">
        <div class="card">Stock: <span id="stockCount">0</span></div>
        <div class="card">Sold: <span id="soldCount">0</span></div>
        <div class="card">Deleted: <span id="deleteCount">0</span></div>
        <div class="card">Added: <span id="addCount">0</span></div>
      </div>

      <!-- RIGHT -->
      <div class="right">
        <div class="card">
          <b>Last 5 History</b>
          <div id="history" class="history small"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- REQUEST -->
  <div id="request" style="display:none;">
    <div class="card">Request Page (same backend use)</div>
  </div>

  <!-- USER -->
  <div id="userPage" style="display:none;">
    <div class="card">Manage User (add later)</div>
  </div>

  <!-- CONTROL -->
  <div id="control" style="display:none;">
    <div class="card">Online Control Active</div>
  </div>

</div>

<script>

// ELEMENTS
const user = document.getElementById("user");
const pass = document.getElementById("pass");
const loginWrap = document.getElementById("loginWrap");
const dashboard = document.getElementById("dashboard");
const header = document.getElementById("header");

const sidebar = document.getElementById("sidebar");

const toggleStatus = document.getElementById("toggleStatus");
const customerToggle = document.getElementById("customerToggle");

const stockCount = document.getElementById("stockCount");
const soldCount = document.getElementById("soldCount");
const deleteCount = document.getElementById("deleteCount");
const addCount = document.getElementById("addCount");

const historyBox = document.getElementById("history");

let history=[];

// MENU
function toggleMenu(){
sidebar.classList.toggle("active");
}

// PAGE SWITCH
function showPage(p){
document.getElementById("home").style.display="none";
document.getElementById("request").style.display="none";
document.getElementById("userPage").style.display="none";
document.getElementById("control").style.display="none";

if(p==="home") document.getElementById("home").style.display="block";
if(p==="request") document.getElementById("request").style.display="block";
if(p==="user") document.getElementById("userPage").style.display="block";
if(p==="control") document.getElementById("control").style.display="block";

sidebar.classList.remove("active");
}

// LOGIN
async function login(){
let res=await fetch("/login",{method:"POST",headers:{'Content-Type':'application/json'},
body:JSON.stringify({user:user.value,pass:pass.value,device:navigator.userAgent})});

let d=await res.json();

if(d.status==="ok"){
loginWrap.style.display="none";
dashboard.style.display="block";
header.style.display="flex";
loadAll();
}else alert("Login failed");
}

// SETTINGS
async function loadSettings(){
let res=await fetch("/admin/settings");
let s=await res.json();

customerToggle.checked = s.customerEnabled;
toggleStatus.innerText = s.customerEnabled ? "ON" : "OFF";
}

// TOGGLE
async function toggleCustomer(){
toggleStatus.innerText="...";

let res=await fetch("/admin/toggleCustomer",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({ enabled: customerToggle.checked })
});

let d=await res.json();
toggleStatus.innerText = d.customerEnabled ? "ON" : "OFF";
}

// LOAD ALL
async function loadAll(){
loadSettings();
loadStats();
}

// STATS
async function loadStats(){
let res=await fetch("/admin/data");
let arr=await res.json();

let sold=0;
arr.forEach(x=>{
if(x.status==="approved") sold++;
});

soldCount.innerText=sold;

// STOCK
let s=await fetch("/admin/stock");
let stock=await s.json();

let total=0;
for(let p in stock) total+=stock[p].length;

stockCount.innerText=total;
}

// HISTORY
function addHistory(text){
history.unshift(text);
if(history.length>5) history.pop();

historyBox.innerHTML="";
history.forEach(x=>{
historyBox.innerHTML+=`<div>${x}</div>`;
});
}

// DEMO AUTO
setInterval(()=>{
addHistory("Sell Key");
},7000);

</script>

</body>
</html>
