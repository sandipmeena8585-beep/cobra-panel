<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">

<title>COBRA ADMIN</title>

<style>
body{
margin:0;
background:#0f172a;
color:#fff;
font-family:Arial;
-webkit-tap-highlight-color: transparent;
}

.login{
 display:flex;flex-direction:column;justify-content:center;align-items:center;
 height:100vh;background:linear-gradient(135deg,#0f766e,#22c55e);
}
.login input,.login button{
 width:80%;max-width:300px;padding:12px;margin:10px;border:none;border-radius:6px;
}
.login button{background:#000;color:#fff}

.top{
 display:flex;align-items:center;gap:10px;padding:12px;
 background:#020617;position:fixed;width:100%;top:0;
}

.title{font-weight:bold;}

.menuIcon{
 font-size:22px;
 cursor:pointer;
}

.sidebar{
 position:fixed;left:-250px;width:250px;height:100%;
 background:#1e293b;transition:.3s;padding-top:60px;
}
.sidebar.active{left:0}
.sidebar div{
 padding:12px;margin:8px;background:#334155;border-radius:8px;
}

.overlay{
 position:fixed;
 top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,0.5);
 display:none;
}
.overlay.active{display:block}

.content{margin-top:60px;padding:10px}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:10px}

button{padding:10px;border:none;border-radius:6px;margin:5px}
.green{background:#22c55e}
.red{background:#ef4444}
.blue{background:#2563eb}
</style>
</head>

<body>

<div id="loginBox" class="login">
<h2>ADMIN LOGIN</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>

<div id="panel" style="display:none">

<div class="top">
<div class="menuIcon" onclick="toggleMenu()">☰</div>
<div class="title">𝗖𝗢𝗕𝗥𝗔 𝗔𝗗𝗠𝗜𝗡</div>
</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<div id="sidebar" class="sidebar">
<div onclick="home()">HOME</div>
<div onclick="plansUI()">PLANS</div>
<div onclick="stockUI()">STOCK</div>
<div onclick="settingsUI()">UPI / QR / COLOR</div>
<div onclick="reqUI()">REQUEST</div>
<div onclick="panelControlUI()">PANEL CONTROL</div>
<div onclick="themeUI()">THEME</div>
<div onclick="logout()">LOGOUT</div>
</div>

<div class="content" id="main"></div>

</div>

<script>

// LOGIN
function login(){
 if(u.value==="COBRA SERVER" && p.value==="SAMI9166"){
  localStorage.setItem("admin","1");
  start();
 }else alert("Wrong");
}

function start(){
 loginBox.style.display="none";
 panel.style.display="block";
 home();
}

if(localStorage.getItem("admin")=="1") start();

function logout(){
 localStorage.removeItem("admin");
 location.reload();
}

// MENU
function toggleMenu(){
 sidebar.classList.toggle("active");
 overlay.classList.toggle("active");
}

function closeMenu(){
 sidebar.classList.remove("active");
 overlay.classList.remove("active");
}

// HOME
function home(){
 main.innerHTML="<h2>LIVE CONTROL RUNNING</h2>";
 closeMenu();
}

// ================= SETTINGS FIX =================
let selectedFile=null;

function settingsUI(){
 fetch("/settings").then(r=>r.json()).then(d=>{
  main.innerHTML=`
  <div class="card">

  <h3>UPI ID</h3>
  <input id="upi" value="${d.upi || ""}">

  <h3>Panel Title</h3>
  <input id="title" value="${d.title || ""}">

  <h3>Theme Color</h3>
  <input id="color" type="color" value="${d.color || "#22c55e"}">

  <h3>Text Color</h3>
  <input id="textColor" type="color" value="${d.textColor || "#ffffff"}">

  <h3>UPLOAD QR CODE</h3>
  <input type="file" onchange="selectQR(event)">

  <button class="green" onclick="saveSettings()">UPDATE</button>

  </div>`;
  closeMenu();
 });
}

function selectQR(e){
 selectedFile=e.target.files[0];
}

function saveSettings(){
 fetch("/settings",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   upi:upi.value,
   title:title.value,
   color:color.value,
   textColor:textColor.value
  })
 })
 .then(()=>{
  if(selectedFile){
   let fd=new FormData();
   fd.append("qr",selectedFile);
   return fetch("/uploadQR",{method:"POST",body:fd});
  }
 })
 .then(()=>fetch("/refresh",{method:"POST"}))
 .then(()=>alert("UPDATED ✔"));
}

// ================= PANEL CONTROL FIX =================
function panelControlUI(){
 fetch("/status").then(r=>r.json()).then(d=>{
  main.innerHTML=`
  <div class="card">
  <button onclick="toggleSystem()">${d.on?"TURN OFF":"TURN ON"}</button>
  <button class="blue" onclick="refreshPanel()">REFRESH</button>
  </div>`;
 });
}

function toggleSystem(){
 fetch("/toggle",{method:"POST"})
 .then(()=>fetch("/refresh",{method:"POST"}))
 .then(()=>panelControlUI());
}

function refreshPanel(){
 fetch("/refresh",{method:"POST"})
 .then(()=>alert("REFRESHED ✔"));
}

// ================= THEME FIX =================
function themeUI(){
 main.innerHTML=`
 <div class="card">
 <button onclick="setTheme('#020617','#00ffcc')">COBRA</button>
 <button onclick="setTheme('#0f172a','#ffffff')">DARK</button>
 </div>`;
}

function setTheme(bg,text){
 fetch("/settings",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({color:bg,textColor:text})
 })
 .then(()=>fetch("/refresh",{method:"POST"}))
 .then(()=>alert("THEME SET ✔"));
}

// ================= STOCK FIX =================
function stockUI(){
 fetch("/plans").then(r=>r.json()).then(p=>{
 fetch("/stock").then(r=>r.json()).then(s=>{

 let html=`
 <div class="card">
 <select id="planSel">${p.map(x=>`<option>${x.type+x.time}</option>`)}</select>
 <input id="key" placeholder="KEY">
 <button onclick="addStock()">ADD</button>
 </div>`;

 p.forEach(x=>{
 let plan=(x.type+x.time).trim();
 let arr=s[plan]||[];

 html+=`<div class="card"><b>${plan} (${arr.length})</b><br>`;
 arr.forEach((k,i)=>{
  html+=`${k} <button onclick="delStock('${plan}',${i})">❌</button><br>`;
 });
 html+=`</div>`;
 });

 main.innerHTML=html;
 });
 });
}

function addStock(){
 fetch("/addStock",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   plan:planSel.options[planSel.selectedIndex].text.trim(),
   key:key.value
  })
 }).then(()=>stockUI());
}

function delStock(plan,index){
 fetch("/deleteStock",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({plan,index})
 }).then(stockUI);
}

// ================= REQUEST FIX =================
let reqInterval;

function reqUI(){
 if(reqInterval) clearInterval(reqInterval);

 function load(){
  fetch("/requests").then(r=>r.json()).then(data=>{
   let html="";
   data.forEach(x=>{
    html+=`
    <div class="card">
    ${x.plan} ₹${x.price}
    <br>${x.utr}
    <button onclick="approve('${x.user}')">YES</button>
    <button onclick="reject('${x.user}')">NO</button>
    </div>`;
   });
   main.innerHTML=html||"NO REQUEST";
  });
 }

 load();
 reqInterval=setInterval(load,3000);
}

function approve(u){
 fetch("/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u})})
 .then(()=>reqUI());
}

function reject(u){
 fetch("/reject",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u})})
 .then(()=>reqUI());
}

</script>

</body>
</html>
