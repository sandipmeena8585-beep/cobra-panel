<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA ADMIN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#020617;
  color:white;
}

/* HEADER */
.header{
  padding:15px;
  background:#f1f5f9;
  color:#065f46;
  font-weight:bold;
}

/* ALERT */
.alert{
  margin:15px;
  background:black;
  padding:12px;
  border-left:5px solid orange;
  border-radius:10px;
}

/* LOGIN CARD */
.loginWrap{
  display:flex;
  justify-content:center;
  align-items:center;
  height:70vh;
}

.loginBox{
  width:90%;
  max-width:320px;
  background:white;
  color:black;
  border-radius:20px;
  overflow:hidden;
}

/* TOP */
.loginTop{
  padding:25px;
  color:white;
  font-size:24px;
  font-weight:bold;
  text-align:center;
  background:linear-gradient(135deg,#0f766e,#22c55e);
}

/* BODY */
.loginBody{
  padding:20px;
}

.inputBox{
  margin:10px 0;
}

.inputBox input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
}

/* BUTTON */
.loginBtn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  margin-top:10px;
  font-weight:bold;
}

/* PANEL */
.container{
  padding:15px;
}

.card{
  padding:12px;
  border-radius:12px;
  background:linear-gradient(135deg,#16a34a,#22c55e);
  margin-bottom:10px;
}

.hidden{display:none;}

</style>
</head>

<body>

<div class="header">COBRA SERVER</div>

<div class="alert">⚠ Please login first.</div>

<!-- LOGIN -->
<div id="loginWrap" class="loginWrap">

<div class="loginBox">
<div class="loginTop">Welcome Back</div>

<div class="loginBody">

<div class="inputBox">
<input id="user" placeholder="Enter your username">
</div>

<div class="inputBox">
<input id="pass" placeholder="Enter your password" type="password">
</div>

<button class="loginBtn" onclick="login()">Sign In</button>

</div>
</div>

</div>

<!-- PANEL -->
<div id="panel" class="container hidden">

<div class="card" id="stockCount">Stock: 0</div>

<select id="plan">
<option value="1hour">1hour</option>
<option value="3hour">3hour</option>
<option value="1day">1day</option>
<option value="3day">3day</option>
<option value="7day">7day</option>
</select>

<input id="newkey" placeholder="Enter Key">
<button onclick="addKey()">ADD KEY</button>

<div id="stockList"></div>

<h3>REQUESTS</h3>
<div id="data"></div>

</div>

<script>

// LOGIN
async function login(){
let res = await fetch("/login",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
user:user.value,
pass:pass.value,
device:navigator.userAgent
})
});

let d = await res.json();

if(d.status==="ok"){
loginWrap.style.display="none";
panel.classList.remove("hidden");

loadStock();
loadRequests();
}else{
alert("Wrong Login");
}
}

// REQUEST
async function loadRequests(){
let res = await fetch("/admin/data");
let arr = await res.json();

let html="";

arr.forEach(x=>{
if(x.status==="pending"){
html+=`
<div class="card">
${x.plan}<br>
UTR: ${x.utr || "N/A"}<br>
Time: ${x.time}<br>
<button onclick="verify(${x.id},this)">YES</button>
<button onclick="reject(${x.id},this)">NO</button>
</div>`;
}
});

data.innerHTML=html;
}

// VERIFY
async function verify(id,btn){
btn.parentElement.remove();
await fetch("/admin/verify/"+id);
loadStock();
}

// REJECT
async function reject(id,btn){
btn.parentElement.remove();
await fetch("/admin/reject/"+id);
}

// STOCK
async function loadStock(){
let res=await fetch("/admin/stock");
let data=await res.json();

let html="",total=0;

for(let p in data){
html+=`<div class="card">${p}<br>`;
data[p].forEach(k=>{
html+=k+"<br>";
total++;
});
html+="</div>";
}

stockList.innerHTML=html;
stockCount.innerText="Stock: "+total;
}

// ADD KEY
async function addKey(){
await fetch("/admin/addkey",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
plan:plan.value,
key:newkey.value
})
});

newkey.value="";
loadStock();
}

// AUTO REFRESH
setInterval(()=>{
loadStock();
loadRequests();
},3000);

</script>

</body>
</html>
