<!DOCTYPE html>
<html>
<head>
<title>ADMIN</title>
<style>
body{background:#0f172a;color:white;text-align:center;}
.card{background:#1e293b;margin:10px;padding:15px;border-radius:10px;}
button{padding:6px 10px;border:none;border-radius:6px;}
</style>
</head>

<body>

<div id="loginBox">
<h2>🔐 OTP LOGIN</h2>
<button onclick="getOTP()">GET OTP</button><br><br>
<input id="otp" placeholder="Enter OTP"><br><br>
<button onclick="login()">LOGIN</button>
</div>

<div id="panel" style="display:none;">
<h2>ADMIN PANEL</h2>
<div id="stats"></div>
<div id="list"></div>
</div>

<script>

function getOTP(){
  fetch("/get-otp");
  alert("Check Render Logs");
}

function login(){
  fetch("/verify-otp",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({otp:otp.value})
  })
  .then(res=>res.json())
  .then(d=>{
    if(d.success){
      loginBox.style.display="none";
      panel.style.display="block";
      load();
    } else alert("Wrong OTP");
  });
}

function load(){
  fetch("/admin-data")
  .then(res=>res.json())
  .then(d=>{

    let s=`Sales: ${d.totalSales}<br>`;
    for(let p in d.stock){
      s+=`${p}: ${d.stock[p]}<br>`;
    }
    stats.innerHTML=s;

    let html="";

    d.requests.forEach(r=>{
      html+=`
      <div class="card">
      Plan:${r.plan}<br>
      UTR:${r.utr}<br>
      Status:${r.status}<br>
      ${r.file?`<img src="/uploads/${r.file}" width="100">`:""}
      <br>
      <button onclick="v(${r.id})">VERIFY</button>
      <button onclick="rj(${r.id})">REJECT</button>
      </div>`;
    });

    list.innerHTML=html;
  });
}

function v(id){
  fetch("/verify",{method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({id})})
  .then(res=>res.json())
  .then(d=>{
    alert("KEY: "+d.key);
    load();
  });
}

function rj(id){
  fetch("/reject",{method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({id})})
  .then(()=>load());
}

</script>

</body>
</html>
