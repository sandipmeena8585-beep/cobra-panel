<script>

let temp = [];

// LOAD REQUEST
async function load(){

  let res = await fetch("/admin/data");
  let arr = await res.json();

  let sales=0,pending=0,html="";

  arr.forEach(x=>{

    if(x.status==="pending"){
      pending++;

      html += `
      <div class="card">
        <b>${x.plan}</b><br>
        UTR: ${x.utr || "N/A"}<br>
        Time: ${x.time || "N/A"}<br><br>

        <button onclick="verify(${x.id},this)">VERIFY</button>
        <button onclick="reject(${x.id},this)">REJECT</button>
      </div>`;
    }

    if(x.status==="approved") sales++;
  });

  data.innerHTML = html;
  salesBox.innerText = "Sales: "+sales;
  pendingBox.innerText = "Pending: "+pending;
}


// ANALYTICS
async function loadAnalytics(){

  let res = await fetch("/admin/data");
  let arr = await res.json();

  let total=0;
  let stats={"1hour":0,"3hour":0,"1day":0,"3day":0,"7day":0};

  arr.forEach(x=>{
    if(x.status==="approved"){
      total++;
      stats[x.plan]++;
    }
  });

  let html = `<div class="card">Total Sales: ${total}</div>
              <div class="card">`;

  for(let p in stats){
    html += `${p} → ${stats[p]}<br>`;
  }

  html += "</div>";

  analytics.innerHTML = html;
}


// VERIFY
async function verify(id,btn){
  await fetch("/admin/verify/"+id);
  btn.parentElement.remove(); // 🔥 hide instantly
  load();
  loadAnalytics();
}

// REJECT
async function reject(id,btn){
  await fetch("/admin/reject/"+id);
  btn.parentElement.remove();
  load();
}


// STOCK
async function loadStock(){

  let s = await fetch("/admin/stock?"+Date.now());
  let st = await s.json();

  let html="";

  for(let p in st){

    html += `<div class="card"><b>${p}</b><br>`;

    st[p].forEach(k=>{
      html += `
      ${k}
      <button onclick="del('${p}','${k}')">❌</button><br>`;
    });

    html += "</div>";
  }

  stockList.innerHTML = html;

  // TEMP KEYS (10 sec show)
  let now = Date.now();
  temp = temp.filter(t => now - t.time < 10000);

  let tHTML="";
  temp.forEach(t=>{
    tHTML += `<div class="card">${t.key}</div>`;
  });

  tempKeys.innerHTML = tHTML;
}


// ADD KEY
async function addKey(){

  let p = plan.value;
  let k = newkey.value.trim();

  if(!k) return alert("Enter Key");

  await fetch("/admin/addkey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plan:p,key:k})
  });

  temp.push({key:k,time:Date.now()});

  newkey.value="";
  loadStock();
}


// DELETE KEY
async function del(p,k){
  await fetch("/admin/deletekey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plan:p,key:k})
  });

  loadStock();
}


// ALL STOCK VIEW
async function loadAll(){

  let s = await fetch("/admin/stock");
  let st = await s.json();

  let html="";

  for(let p in st){
    html += `<div class="card"><b>${p}</b><br>`;
    st[p].forEach(k=> html += k+"<br>");
    html += "</div>";
  }

  allKeys.innerHTML = html;
}


// AUTO REFRESH
setInterval(()=>{
  if(!stockPage.classList.contains("hidden")){
    loadStock();
  }else{
    load();
    loadAnalytics();
  }
},2000);

</script>
