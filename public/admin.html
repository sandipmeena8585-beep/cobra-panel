<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA ADMIN</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"><style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#020617;
  color:white;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 15px;
}

/* MENU ICON */
.menu{
  font-size:22px;
  cursor:pointer;
  display:none;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:-260px;
  width:240px;
  height:100%;
  background:#020617;
  padding:15px;
  transition:0.3s;
  z-index:999;
}
.sidebar.active{left:0;}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:998;
}
.overlay.active{display:block;}

.sideItem{
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  background:#0f172a;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:15px;
}

/* ICON STYLE */
.icon{
  width:18px;
  height:18px;
  fill:#22c55e;
}

/* CONTAINER */
.container{
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.card{
  padding:15px;
  border-radius:15px;
  background:linear-gradient(135deg,#16a34a,#22c55e);
  text-align:center;
}

/* LOGIN */
.loginBox{
  width:90%;
  max-width:250px;
  margin:120px auto;
  padding:18px;
  background:#020617;
  border-radius:15px;
  text-align:center;
}

input{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  background:#0f172a;
  color:white;
  font-size:14px;
}

button{
  width:100%;
  padding:11px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  margin-top:10px;
}

/* TELEGRAM */
.telegram{
  position:fixed;
  bottom:15px;
  left:15px;
  right:15px;
  padding:14px;
  text-align:center;
  background:#0088cc;
  border-radius:12px;
}

.hidden{display:none;}
</style></head><body><div id="overlay" class="overlay" onclick="closeMenu()"></div><!-- ✅ SIDEBAR WITH PROFESSIONAL ICONS --><div id="sidebar" class="sidebar"><div class="sideItem" onclick="go('panel')">
<svg class="icon" viewBox="0 0 24 24">
<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
</svg>
Home
</div><div class="sideItem" onclick="go('stockPage')">
<svg class="icon" viewBox="0 0 24 24">
<path d="M3 3h18v4H3V3zm0 6h18v12H3V9zm4 2v8h2v-8H7zm4 0v8h2v-8h-2z"/>
</svg>
Stock
</div><div class="sideItem" onclick="go('requestPage')">
<svg class="icon" viewBox="0 0 24 24">
<path d="M21 6h-2V4H5v2H3v14h18V6zM5 18V8h14v10H5zm2-8h10v2H7v-2z"/>
</svg>
Requests
</div><div class="sideItem" onclick="logout()">
<svg class="icon" viewBox="0 0 24 24">
<path d="M16 17l5-5-5-5v3H9v4h7v3zM3 3h8v2H5v14h6v2H3V3z"/>
</svg>
Logout
</div></div><div class="topbar">
<span id="menuBtn" class="menu" onclick="toggleMenu()">☰</span>
<b>COBRA ADMIN</b>
</div><!-- LOGIN --><div id="loginBox" class="loginBox">
<h3>🔐 LOGIN</h3>
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div><!-- DASHBOARD --><div id="panel" class="container hidden">
<div class="card">Dashboard</div>
<div class="card" id="sales">Sales: 0</div>
<div class="card" id="pending">Pending: 0</div>
</div><!-- STOCK --><div id="stockPage" class="container hidden">
<div class="card">STOCK PANEL</div>
<input id="newkey" placeholder="Enter Key">
<button onclick="addKey()">ADD KEY</button>
<div id="stockList"></div>
</div><!-- REQUEST --><div id="requestPage" class="container hidden">
<div class="card">REQUESTS</div>
<div id="data"></div>
</div><!-- TELEGRAM --><div class="telegram" onclick="window.open('https://t.me/GODx_COBRA')">
📢 Help Telegram
</div><script>

// MENU
function toggleMenu(){
  sidebar.classList.add("active");
  overlay.classList.add("active");
}

function closeMenu(){
  sidebar.classList.remove("active");
  overlay.classList.remove("active");
}

// NAV
function go(p){
  closeMenu();
  panel.classList.add("hidden");
  stockPage.classList.add("hidden");
  requestPage.classList.add("hidden");
  document.getElementById(p).classList.remove("hidden");
}

// LOGIN
async function login(){
  let res = await fetch("/login",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      user:user.value,
      pass:pass.value,
      device:navigator.userAgent
    })
  });

  let d = await res.json();

  if(d.status==="ok"){
    loginBox.classList.add("hidden");
    panel.classList.remove("hidden");
    menuBtn.style.display="block";
  }else{
    alert("Wrong Login");
  }
}

// LOGOUT
function logout(){
  location.reload();
}

</script></body>
</html>
