<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">

<title>COBRA ADMIN</title>

<style>
body{
margin:0;
background:#0f172a;
color:#fff;
font-family:Arial;
-webkit-tap-highlight-color: transparent;
}

.login{
 display:flex;flex-direction:column;justify-content:center;align-items:center;
 height:100vh;background:linear-gradient(135deg,#0f766e,#22c55e);
}
.login input,.login button{
 width:80%;max-width:300px;padding:12px;margin:10px;border:none;border-radius:6px;
}
.login button{background:#000;color:#fff}

.top{
 display:flex;align-items:center;gap:10px;padding:12px;
 background:#020617;position:fixed;width:100%;top:0;
}

.title{font-weight:bold;}

.menuIcon{
 font-size:22px;
 cursor:pointer;
}

.sidebar{
 position:fixed;left:-250px;width:250px;height:100%;
 background:#1e293b;transition:.3s;padding-top:60px;
}
.sidebar.active{left:0}
.sidebar div{
 padding:12px;margin:8px;background:#334155;border-radius:8px;
}

.overlay{
 position:fixed;
 top:0;left:0;width:100%;height:100%;
 background:rgba(0,0,0,0.5);
 display:none;
}
.overlay.active{display:block}

.content{margin-top:60px;padding:10px}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:10px}

button{padding:10px;border:none;border-radius:6px;margin:5px}
.green{background:#22c55e}
.red{background:#ef4444}
.blue{background:#2563eb}

img{
 margin-top:10px;
 max-width:150px;
 border-radius:10px;
}
</style>
</head>

<body>

<div id="loginBox" class="login">
<h2>ADMIN LOGIN</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>

<div id="panel" style="display:none">

<div class="top">
<div class="menuIcon" onclick="toggleMenu()">☰</div>
<div class="title">𝗖𝗢𝗕𝗥𝗔 𝗔𝗗𝗠𝗜𝗡</div>
</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<div id="sidebar" class="sidebar">
<div onclick="home()">HOME</div>
<div onclick="plansUI()">PLANS</div>
<div onclick="stockUI()">STOCK</div>
<div onclick="settingsUI()">UPI / QR</div>
<div onclick="reqUI()">REQUEST</div>
<div onclick="panelControlUI()">PANEL CONTROL</div>
<div onclick="logout()">LOGOUT</div>
</div>

<div class="content" id="main"></div>

</div>

<script>

// LOGIN
function login(){
 if(u.value==="COBRA SERVER" && p.value==="SAMI9166"){
  localStorage.setItem("admin","1");
  start();
 }else alert("Wrong");
}

function start(){
 loginBox.style.display="none";
 panel.style.display="block";
 home();
}

if(localStorage.getItem("admin")=="1") start();

function logout(){
 localStorage.removeItem("admin");
 location.reload();
}

// MENU
function toggleMenu(){
 sidebar.classList.toggle("active");
 overlay.classList.toggle("active");
}

function closeMenu(){
 sidebar.classList.remove("active");
 overlay.classList.remove("active");
}

// HOME
function home(){
 main.innerHTML="<h2>LIVE CONTROL RUNNING</h2>";
 closeMenu();
}

// ================= 🔥 QR FILE UPLOAD CHANGE =================
function settingsUI(){
 fetch("/settings").then(r=>r.json()).then(d=>{
  main.innerHTML=`
  <div class="card">

  <h3>UPI ID</h3>
  <input id="upi" value="${d.upi || ""}" placeholder="Enter UPI ID">

  <h3>QR CODE UPLOAD</h3>
  <input type="file" id="qrFile" accept="image/*">

  ${d.qr ? `<img src="${d.qr}">` : ""}

  <button class="green" onclick="saveSettings()">UPDATE</button>

  </div>`;
  closeMenu();
 });
}

function saveSettings(){

 let file = document.getElementById("qrFile").files[0];

 if(file){
   let reader = new FileReader();
   reader.onload = function(){
     sendData(reader.result);
   };
   reader.readAsDataURL(file);
 }else{
   sendData(null);
 }

 function sendData(qrData){
   fetch("/settings",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      upi:upi.value,
      qr: qrData
    })
   }).then(()=>alert("UPDATED ✔"));
 }
}
// ================= END =================

// बाकी code SAME रहेगा (कोई change नहीं)

</script>

</body>
</html>
