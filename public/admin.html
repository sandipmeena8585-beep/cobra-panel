<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA ADMIN</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"><style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#020617;
  color:white;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 15px;
}

/* MENU ICON */
.menu{
  font-size:22px;
  cursor:pointer;
  display:none; /* 🔒 hidden by default */
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:-260px;
  width:240px;
  height:100%;
  background:#020617;
  padding:15px;
  transition:0.3s;
  z-index:999;
}

.sidebar.active{
  left:0;
}

/* OVERLAY */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:998;
}

.overlay.active{
  display:block;
}

.sideItem{
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  background:#0f172a;
}

/* CONTAINER */
.container{
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* CARD */
.card{
  padding:15px;
  border-radius:15px;
  background:linear-gradient(135deg,#16a34a,#22c55e);
  text-align:center;
}

/* LOGIN */
.loginBox{
  max-width:280px;
  margin:100px auto;
  padding:20px;
  background:#020617;
  border-radius:15px;
  text-align:center;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  background:#0f172a;
  color:white;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  margin-top:10px;
}

/* TELEGRAM */
.telegram{
  position:fixed;
  bottom:15px;
  left:15px;
  right:15px;
  padding:14px;
  text-align:center;
  background:#0088cc;
  border-radius:12px;
}

.hidden{display:none;}
</style></head><body><!-- OVERLAY --><div id="overlay" class="overlay" onclick="closeMenu()"></div><!-- SIDEBAR --><div id="sidebar" class="sidebar">
<div class="sideItem" onclick="go('panel')">🏠 Home</div>
<div class="sideItem" onclick="go('stockPage')">📦 Stock</div>
<div class="sideItem" onclick="go('requestPage')">📥 Requests</div>
<div class="sideItem" onclick="logout()">🚪 Logout</div>
</div><!-- TOP --><div class="topbar">
<span id="menuBtn" class="menu" onclick="toggleMenu()">☰</span>
<b>COBRA ADMIN</b>
</div><!-- LOGIN --><div id="loginBox" class="loginBox">
<h3>🔐 LOGIN</h3>
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div><!-- DASHBOARD --><div id="panel" class="container hidden">
<div class="card">📊 Dashboard</div>
<div class="card" id="sales">💰 Sales: 0</div>
<div class="card" id="pending">⏳ Pending: 0</div>
</div><!-- STOCK --><div id="stockPage" class="container hidden">
<div class="card">📦 STOCK PANEL</div><input id="newkey" placeholder="Enter Key">
<button onclick="addKey()">ADD KEY</button><div id="stockList"></div>
</div><!-- REQUEST --><div id="requestPage" class="container hidden">
<div class="card">📥 REQUESTS</div>
<div id="data"></div>
</div><!-- TELEGRAM --><div class="telegram" onclick="window.open('https://t.me/GODx_COBRA')">
📢 Help Telegram - @GODx_COBRA
</div><script>

// MENU
function toggleMenu(){
  sidebar.classList.add("active");
  overlay.classList.add("active");
}

function closeMenu(){
  sidebar.classList.remove("active");
  overlay.classList.remove("active");
}

// PAGE SWITCH
function go(p){
  closeMenu();

  panel.classList.add("hidden");
  stockPage.classList.add("hidden");
  requestPage.classList.add("hidden");

  document.getElementById(p).classList.remove("hidden");
}

// LOGIN
async function login(){

  let res = await fetch("/login",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      user:user.value,
      pass:pass.value,
      device:navigator.userAgent
    })
  });

  let d = await res.json();

  if(d.status==="ok"){

    loginBox.classList.add("hidden");
    panel.classList.remove("hidden");

    // ✅ SHOW MENU AFTER LOGIN
    document.getElementById("menuBtn").style.display="block";

    load();

  }else{
    alert("Wrong Login");
  }
}

// LOGOUT
function logout(){
  location.reload();
}

// LOAD
async function load(){
  let res=await fetch("/admin/data");
  let arr=await res.json();

  let sales=0,pending=0,html="";

  arr.forEach(x=>{
    if(x.status==="pending"){
      pending++;
      html+=`
      <div class="card">
      ${x.plan}
      <button onclick="verify(${x.id})">✔</button>
      <button onclick="reject(${x.id})">❌</button>
      </div>`;
    }
    if(x.status==="approved") sales++;
  });

  data.innerHTML=html;
  sales.innerText="💰 Sales: "+sales;
  pending.innerText="⏳ Pending: "+pending;
}

// VERIFY
async function verify(id){
  await fetch("/admin/verify/"+id);
  load();
}

// REJECT
async function reject(id){
  await fetch("/admin/reject/"+id);
  load();
}

// ADD KEY
async function addKey(){
  await fetch("/admin/addkey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      plan:"1day",
      key:newkey.value
    })
  });

  newkey.value="";
}

</script></body>
</html>
