<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COBRA ADMIN</title>

<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Arial;}

.login{
display:flex;flex-direction:column;justify-content:center;align-items:center;
height:100vh;background:linear-gradient(135deg,#0f766e,#22c55e);
}
.login input,.login button{
width:80%;max-width:300px;padding:12px;margin:10px;border:none;border-radius:6px;
}
.login button{background:#000;color:#fff}

.top{
display:flex;align-items:center;gap:10px;padding:12px;
background:#020617;position:fixed;width:100%;top:0;
}

.menuIcon{font-size:22px;cursor:pointer;}

.sidebar{
position:fixed;left:-250px;width:250px;height:100%;
background:#1e293b;transition:.3s;padding-top:60px;
}
.sidebar.active{left:0}
.sidebar div{
padding:12px;margin:8px;background:#334155;border-radius:8px;
}

.overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);display:none;
}
.overlay.active{display:block}

.content{margin-top:60px;padding:10px}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:10px}

button{padding:10px;border:none;border-radius:6px;margin:5px}
.green{background:#22c55e}
.red{background:#ef4444}
.blue{background:#2563eb}

/* POPUP */
.popupOverlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.7);
display:flex;justify-content:center;align-items:center;
z-index:999;
}
.popupBox{
background:#020617;
padding:20px;
border-radius:16px;
text-align:center;
box-shadow:0 0 30px #22c55e;
animation:pop .3s ease;
}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}

.tick{
font-size:40px;
color:#22c55e;
}
</style>

</head>
<body>

<div id="loginBox" class="login">
<h2>ADMIN LOGIN</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>

<div id="panel" style="display:none">

<div class="top">
<div class="menuIcon" onclick="toggleMenu()">☰</div>
<div>𝗖𝗢𝗕𝗥𝗔 𝗔𝗗𝗠𝗜𝗡</div>
</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<div id="sidebar" class="sidebar">
<div onclick="home()">HOME</div>
<div onclick="plansUI()">PLANS</div>
<div onclick="stockUI()">STOCK</div>
<div onclick="settingsUI()">UPI / QR / COLOR</div>
<div onclick="trialUI()">TRIAL SYSTEM</div>
<div onclick="reqUI()">REQUEST</div>
<div onclick="panelControlUI()">PANEL CONTROL</div>
<div onclick="themeUI()">THEME</div>
<div onclick="logout()">LOGOUT</div>
</div>

<div class="content" id="main"></div>

</div>

<script>

// LOGIN
function login(){
 if(u.value==="COBRA SERVER" && p.value==="SAMI9166"){
  localStorage.setItem("admin","1");
  start();
 }else alert("Wrong");
}

function start(){
 loginBox.style.display="none";
 panel.style.display="block";
 home();
}

if(localStorage.getItem("admin")=="1") start();

function logout(){
 localStorage.removeItem("admin");
 location.reload();
}

// MENU
function toggleMenu(){
 sidebar.classList.toggle("active");
 overlay.classList.toggle("active");
}
function closeMenu(){
 sidebar.classList.remove("active");
 overlay.classList.remove("active");
}

// HOME
function home(){
 main.innerHTML="<h2>🔥 SYSTEM LIVE RUNNING</h2>";
 closeMenu();
}

// ================= 🔥 TRIAL SYSTEM =================
function trialUI(){
 fetch("/trial").then(r=>r.json()).then(t=>{

 main.innerHTML=`
 <div class="card">

 <h3>TRIAL CONTROL</h3>

 <button onclick="toggleTrial()">
 ${t.on ? "TURN OFF" : "TURN ON"}
 </button>

 <input id="tTitle" value="${t.title||""}" placeholder="TITLE">

 <input id="tKey" value="${t.key||""}" placeholder="KEY">

 <input id="tKill" value="${t.kill||""}" placeholder="KILL LIMIT">

 <input id="tTele" value="${t.telegram||""}" placeholder="TELEGRAM URL">

 <input id="u1" value="${t.updates?.[0]||""}" placeholder="UPDATE 1">
 <input id="u2" value="${t.updates?.[1]||""}" placeholder="UPDATE 2">
 <input id="u3" value="${t.updates?.[2]||""}" placeholder="UPDATE 3">

 <button class="green" onclick="saveTrial()">SAVE</button>

 </div>`;
 });
}

function toggleTrial(){
 fetch("/trial").then(r=>r.json()).then(t=>{
  fetch("/trial",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({on:!t.on})
  }).then(()=>alert("UPDATED ✔"));
 });
}

function saveTrial(){
 fetch("/trial",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   title:tTitle.value,
   key:tKey.value,
   kill:tKill.value,
   telegram:tTele.value,
   updates:[u1.value,u2.value,u3.value]
  })
 }).then(()=>alert("TRIAL SAVED ✔"));
}
// ================= END =================

// SETTINGS
function settingsUI(){
 fetch("/settings").then(r=>r.json()).then(d=>{
  main.innerHTML=`
  <div class="card">

  <h3>UPI</h3>
  <input id="upi" value="${d.upi||""}">

  <h3>Title</h3>
  <input id="title" value="${d.title||""}">

  <h3>Theme Color</h3>
  <input id="color" type="color" value="${d.color||"#22c55e"}">

  <h3>Text Color</h3>
  <input id="textColor" type="color" value="${d.textColor||"#fff"}">

  <button class="green" onclick="saveSettings()">UPDATE</button>

  </div>`;
 });
}

function saveSettings(){
 fetch("/settings",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
    upi:upi.value,
    title:title.value,
    color:color.value,
    textColor:textColor.value
  })
 }).then(()=>alert("UPDATED ✔"));
}

// REQUEST
function reqUI(){
 fetch("/requests").then(r=>r.json()).then(data=>{
 let html="";
 data.forEach(x=>{
 html+=`
 <div class="card">
 <b>${x.plan}</b> ₹${x.price}
 <br>UTR: ${x.utr}
 <br><br>
 <button class="green" onclick="approve('${x.user}')">YES</button>
 <button class="red" onclick="reject('${x.user}')">NO</button>
 </div>`;
 });
 main.innerHTML=html||"NO REQUEST";
 });
}

function approve(u){
 fetch("/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u})})
 .then(r=>r.json()).then(d=>{
  alert("KEY: "+d.key);
  reqUI();
 });
}

function reject(u){
 fetch("/reject",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u})})
 .then(()=>reqUI());
}

// STOCK
function stockUI(){
 fetch("/stock").then(r=>r.json()).then(s=>{
 let html=`
 <div class="card">
 <input id="plan" placeholder="PLAN">
 <input id="key" placeholder="KEY">
 <button onclick="addStock()">ADD</button>
 </div>`;

 Object.keys(s).forEach(p=>{
 html+=`<div class="card"><b>${p}</b> (${s[p].length})</div>`;
 });

 main.innerHTML=html;
 });
}

function addStock(){
 fetch("/addStock",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({plan:plan.value,key:key.value})
 }).then(()=>stockUI());
}

// PANEL
function panelControlUI(){
 fetch("/status").then(r=>r.json()).then(d=>{
  main.innerHTML=`
  <div class="card">
  <button onclick="toggleSystem()">${d.on?"TURN OFF":"TURN ON"}</button>
  </div>`;
 });
}

function toggleSystem(){
 fetch("/toggle",{method:"POST"}).then(()=>panelControlUI());
}

</script>

</body>
</html>
