<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

/* LOGIN */
.login{
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 height:100vh;
 background:linear-gradient(135deg,#0f766e,#22c55e);
}
.login input,.login button{
 width:80%;
 max-width:300px;
 padding:12px;
 margin:10px;
 border:none;
 border-radius:6px;
}
.login button{background:#000;color:#fff}

/* TOPBAR */
.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px 15px;
 background:#020617;
 position:fixed;
 width:100%;
 top:0;
 z-index:1000;
}

/* SIDEBAR */
.sidebar{
 position:fixed;
 top:0;
 left:-250px;
 width:250px;
 height:100%;
 background:#1e293b;
 padding-top:70px;
 transition:.3s;
 z-index:999;
}
.sidebar.active{left:0}
.sidebar div{
 padding:12px;
 background:#334155;
 margin:8px;
 border-radius:8px;
}

/* CONTENT */
.content{
 margin-top:65px;
 padding:12px;
}

/* CARD */
.card{
 background:#1e293b;
 padding:15px;
 border-radius:10px;
 margin:10px 0;
}

/* QUICK ACTION UI */
.quick-title{
 background:linear-gradient(135deg,#0f766e,#22c55e);
 padding:15px;
 border-radius:10px;
 margin-bottom:10px;
}

.quick-btn{
 background:#e5e7eb;
 color:black;
 padding:15px;
 margin:10px 0;
 border-radius:10px;
 text-align:center;
 font-weight:bold;
 cursor:pointer;
}

/* BUTTON */
button{
 padding:10px;
 border:none;
 border-radius:6px;
 margin:5px;
}
.green{background:#22c55e}
.red{background:#ef4444}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="login">
<h2>ADMIN LOGIN</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- PANEL -->
<div id="panel" style="display:none">

<div class="topbar">
<div onclick="toggleMenu()">☰</div>
<div>COBRA 🐍</div>
</div>

<div id="sidebar" class="sidebar">
<div onclick="showTab('home')">🏠 Home</div>
<div onclick="showTab('requests')">📥 Requests</div>
<div onclick="showTab('customer')">👤 Customer</div>
<div onclick="showTab('stock')">📦 Stock</div>
<div onclick="logout()">🚪 Logout</div>
</div>

<div class="content" id="main"></div>

</div>

<script>

// LOGIN
function login(){
 let u=document.getElementById("u").value;
 let p=document.getElementById("p").value;

 if(u==="COBRA SERVER" && p==="SAMI9166"){
   localStorage.setItem("admin","1");
   start();
 }else alert("Wrong");
}

function start(){
 document.getElementById("loginBox").style.display="none";
 document.getElementById("panel").style.display="block";
 showTab("home");
}
if(localStorage.getItem("admin")=="1") start();

function logout(){
 localStorage.removeItem("admin");
 location.reload();
}

function toggleMenu(){
 document.getElementById("sidebar").classList.toggle("active");
}

// 🔥 DASHBOARD UPDATED
function showTab(tab){

document.getElementById("sidebar").classList.remove("active");

let html="";

if(tab==="home"){
 html=`
 <div class="quick-title">⚡ Quick Actions</div>

 <div class="quick-btn" onclick="changeLicense()">🔑 CHANGE LICENSE</div>
 <div class="quick-btn" onclick="changeDuration()">⏱ CHANGE DURATION</div>
 <div class="quick-btn" onclick="changePanel()">✏️ CHANGE PANEL NAME</div>
 <div class="quick-btn" onclick="changePassword()">🔒 CHANGE PASSWORD</div>
 <div class="quick-btn" onclick="changeMod()">🛠 CHANGE MOD NAME</div>
 `;
}

if(tab==="requests"){
 html="<h2>Requests</h2><div id='req'>Loading...</div>";
 loadRequests();
}

if(tab==="customer"){
 html=`<h2>Customer Control</h2>
 <button onclick="toggleSystem()">ON/OFF PANEL</button>`;
}

if(tab==="stock"){
 html=`<h2>Stock</h2>
 <div class="card">
 <input id="key" placeholder="Add Key">
 <button onclick="addKey()">Add</button>
 </div>
 <div id="stockList"></div>`;
 loadStock();
}

document.getElementById("main").innerHTML=html;
}

// 🔥 ACTION FUNCTIONS
function changeLicense(){
 let v=prompt("Enter New License");
 if(v) alert("License Changed: "+v);
}

function changeDuration(){
 let v=prompt("Enter Duration");
 if(v) alert("Duration Updated: "+v);
}

function changePanel(){
 let v=prompt("Enter Panel Name");
 if(v) alert("Panel Name: "+v);
}

function changePassword(){
 let v=prompt("Enter New Password");
 if(v) alert("Password Updated");
}

function changeMod(){
 let v=prompt("Enter Mod Name");
 if(v) alert("Mod Name: "+v);
}

// REQUESTS
function loadRequests(){
 fetch("/requests")
 .then(r=>r.json())
 .then(data=>{
   let h="";
   data.forEach(x=>{
     h+=`<div class="card">${x.user} - ${x.plan}</div>`;
   });
   document.getElementById("req").innerHTML=h||"No Requests";
 });
}

// STOCK
let stock=[];
function addKey(){
 let k=document.getElementById("key").value;
 stock.push(k);
 loadStock();
}
function loadStock(){
 let h="";
 stock.forEach(k=>{
   h+=`<div class="card">${k}</div>`;
 });
 document.getElementById("stockList").innerHTML=h;
}

</script>

</body>
</html>
