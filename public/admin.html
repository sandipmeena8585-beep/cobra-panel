<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>COBRA ADMIN</title>

<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Arial;}
.login{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#0f766e,#22c55e);}
.login input,.login button{width:80%;max-width:300px;padding:12px;margin:10px;border:none;border-radius:6px;}
.login button{background:#000;color:#fff}

.top{display:flex;align-items:center;gap:10px;padding:12px;background:#020617;position:fixed;width:100%;top:0;}
.menuIcon{font-size:22px;cursor:pointer;}

.sidebar{position:fixed;left:-250px;width:250px;height:100%;background:#1e293b;transition:.3s;padding-top:60px;}
.sidebar.active{left:0}
.sidebar div{padding:12px;margin:8px;background:#334155;border-radius:8px;}

.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;}
.overlay.active{display:block}

.content{margin-top:60px;padding:10px}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:10px}

button{padding:10px;border:none;border-radius:6px;margin:5px}
.green{background:#22c55e}
.red{background:#ef4444}
.blue{background:#2563eb}

input,select{padding:10px;width:90%;margin:6px;border:none;border-radius:6px}
</style>
</head>

<body>

<div id="loginBox" class="login">
<h2>ADMIN LOGIN</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>

<div id="panel" style="display:none">

<div class="top">
<div class="menuIcon" onclick="toggleMenu()">☰</div>
<div>𝗖𝗢𝗕𝗥𝗔 𝗔𝗗𝗠𝗜𝗡</div>
</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<div id="sidebar" class="sidebar">
<div onclick="home()">HOME</div>
<div onclick="plansUI()">PLANS</div>
<div onclick="stockUI()">STOCK</div>
<div onclick="settingsUI()">UPI / QR / COLOR</div>
<div onclick="reqUI()">REQUEST</div>
<div onclick="panelControlUI()">PANEL CONTROL</div>
<div onclick="themeUI()">THEME</div>
<div onclick="trialUI()">TRIAL</div>
<div onclick="logout()">LOGOUT</div>
</div>

<div class="content" id="main"></div>
</div>

<script>

// LOGIN FIX
function login(){
if(u.value==="COBRA SERVER" && p.value==="SAMI9166"){
localStorage.setItem("admin","1");
start();
}else alert("Wrong");
}

function start(){
loginBox.style.display="none";
panel.style.display="block";
home();
}

// 🔥 refresh fix
window.onload=()=>{
if(localStorage.getItem("admin")==="1"){
start();
}
}

function logout(){
localStorage.removeItem("admin");
location.reload();
}

// MENU
function toggleMenu(){
sidebar.classList.toggle("active");
overlay.classList.toggle("active");
}
function closeMenu(){
sidebar.classList.remove("active");
overlay.classList.remove("active");
}

let reqInt;
function stopReq(){
if(reqInt){clearInterval(reqInt);reqInt=null;}
}

// HOME
function home(){
stopReq();

Promise.all([
fetch("/history").then(r=>r.json()),
fetch("/stock").then(r=>r.json()),
fetch("/requests").then(r=>r.json()),
fetch("/status").then(r=>r.json())
]).then(([h,stock,req,st])=>{

let totalSales=h.length;
let approved=h.filter(x=>x.status==="approved").length;
let revenue=h.reduce((a,b)=>a+Number(b.price||0),0);

let stockCount=0;
Object.values(stock).forEach(arr=>stockCount+=arr.length);

main.innerHTML=`

<div class="card">
<h2>📊 ADMIN DASHBOARD</h2>
</div>

<div class="card">
<b>Total Sales:</b> ${totalSales}<br>
<b>Approved:</b> ${approved}
</div>

<div class="card">
<b>Stock:</b> ${stockCount}<br>
<b>Requests:</b> ${req.length}
</div>

<div class="card">
<b>System:</b> ${st.on ? "🟢 ON" : "🔴 OFF"}
</div>

<div class="card">
<b>Today Revenue:</b> ₹${revenue}
</div>

<div class="card">
<h3>⚡ QUICK ACTION</h3>
<button class="green" onclick="plansUI()">Plans</button>
<button class="blue" onclick="stockUI()">Stock</button>
<button class="red" onclick="reqUI()">Requests</button>
</div>

<div class="card">
<h3>📦 STOCK SUMMARY</h3>
${
Object.keys(stock).map(p=>`${p} : ${stock[p].length}`).join("<br>")
}
</div>

<div class="card">
<h3>🔥 LIVE ACTIVITY</h3>
${
h.slice(0,5).map(x=>`${x.user} → ${x.plan}`).join("<br>")
}
</div>

`;

});

closeMenu();
}

// ================= SETTINGS =================
let file;
function settingsUI(){
stopReq();
fetch("/settings").then(r=>r.json()).then(d=>{
main.innerHTML=`
<div class="card">

<h3>UPI</h3>
<input id="upi" value="${d.upi||""}">

<h3>Title</h3>
<input id="title" value="${d.title||""}">

<h3>UI COLOR</h3>
<input id="color" type="color" value="${d.color}">

<h3>TEXT COLOR</h3>
<input id="textColor" type="color" value="${d.textColor}">

<h3>QR</h3>
<input type="file" onchange="file=this.files[0]">
${d.qr?`<br><img src="${d.qr}" width="100">`:""}

<button class="green" onclick="saveSettings()">UPDATE</button>

</div>`;
});
closeMenu();
}

function saveSettings(){
fetch("/settings",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({
upi:upi.value,
title:title.value,
color:color.value,
textColor:textColor.value
})
})
.then(()=>{
if(file){
let fd=new FormData();
fd.append("qr",file);
return fetch("/uploadQR",{method:"POST",body:fd});
}
})
.then(()=>alert("UPDATED ✔"));
}

// ================= PLANS =================
function plansUI(){
stopReq();
fetch("/plans").then(r=>r.json()).then(data=>{
main.innerHTML=`
<div class="card">
<select id="planIndex">
${data.map((x,i)=>`<option value="${i}">${x.time} ₹${x.price}</option>`)}
</select>

<input id="newTime" placeholder="Time">
<input id="newPrice" placeholder="Price">

<button class="green" onclick="updatePlan()">UPDATE</button>
</div>`;
});
closeMenu();
}

function updatePlan(){
fetch("/plans").then(r=>r.json()).then(data=>{
let i=planIndex.value;
if(newTime.value) data[i].time=newTime.value;
if(newPrice.value) data[i].price=newPrice.value;

fetch("/savePlans",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})
.then(()=>alert("UPDATED ✔"));
});
}

// ================= STOCK FULL =================
function stockUI(){
stopReq();

Promise.all([
fetch("/plans").then(r=>r.json()),
fetch("/stock").then(r=>r.json())
]).then(([plans,stock])=>{

let html=`
<div class="card">
<select id="planSel">${plans.map(x=>`<option>${x.time}</option>`)}</select>
<input id="key" placeholder="KEY">
<button class="green" onclick="addStock()">ADD</button>
</div>
`;

plans.forEach(p=>{
let name=p.time;
let arr=stock[name]||[];

html+=`
<div class="card">
<b>${name} (${arr.length})</b><br>
${arr.map((k,i)=>`${k} <button onclick="delStock('${name}',${i})">❌</button><br>`).join("")}
</div>`;
});

main.innerHTML=html;
});
closeMenu();
}

function addStock(){
fetch("/addStock",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({plan:planSel.value,key:key.value})
}).then(()=>{alert("ADDED ✔");stockUI();});
}

function delStock(plan,i){
fetch("/deleteStock",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({plan,index:i})
}).then(()=>stockUI());
}

// ================= REQUEST =================
function reqUI(){
stopReq();

function load(){
fetch("/requests").then(r=>r.json()).then(data=>{
main.innerHTML=data.map(x=>`
<div class="card">
<b>${x.plan}</b> ₹${x.price}
<br>UTR: ${x.utr}
<br>🕒 ${x.time}
<br>
<button class="green" onclick="approve('${x.user}')">YES</button>
<button class="red" onclick="reject('${x.user}')">NO</button>
</div>`).join("") || "NO REQUEST";
});
}

load();
reqInt=setInterval(load,3000);
closeMenu();
}

// ================= PANEL CONTROL =================
function panelControlUI(){
stopReq();
fetch("/status").then(r=>r.json()).then(d=>{
main.innerHTML=`
<div class="card">
<button onclick="toggleSystem()" class="${d.on?'red':'green'}">${d.on?'TURN OFF':'TURN ON'}</button>
<button class="blue" onclick="refreshNow()">REFRESH</button>
</div>`;
});
closeMenu();
}

function toggleSystem(){
fetch("/toggle",{method:"POST"}).then(()=>panelControlUI());
}

function refreshNow(){
fetch("/refresh",{method:"POST"}).then(()=>alert("REFRESH ✔"));
}

// ================= THEME =================
function themeUI(){
stopReq();
main.innerHTML=`
<div class="card">
<button onclick="setTheme('#020617','#00ffcc')">COBRA</button>
<button onclick="setTheme('#0f172a','#ffffff')">DARK</button>
<button onclick="setTheme('#ffffff','#000000')">LIGHT</button>
</div>`;
closeMenu();
}

function setTheme(bg,text){
fetch("/settings",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({color:bg,textColor:text})
}).then(()=>alert("THEME ✔"));
}

// ================= TRIAL =================
function trialUI(){
stopReq();

fetch("/trial").then(r=>r.json()).then(t=>{
main.innerHTML=`
<div class="card">

<button onclick="toggleTrial()" class="${t.on?'red':'green'}">${t.on?'TURN OFF':'TURN ON'}</button>

<input id="t_title" value="${t.title}">
<input id="t_key" value="${t.key}">
<input id="t_kill" value="${t.kill}">
<input id="t_url" value="${t.telegram}">

<h4>DATE</h4>
<input id="t_date" value="${t.date||""}">

<h4>TIME</h4>
<input id="t_time" value="${t.time||""}">

<button onclick="saveTrial()" class="blue">UPDATE</button>

</div>`;
});
closeMenu();
}

function toggleTrial(){
fetch("/trialToggle",{method:"POST"}).then(()=>trialUI());
}

function saveTrial(){
fetch("/trialUpdate",{method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({
title:t_title.value,
key:t_key.value,
kill:t_kill.value,
telegram:t_url.value,
date:t_date.value,
time:t_time.value
})
}).then(()=>alert("UPDATED ✔"));
}

// REQUEST ACTION
function approve(u){
fetch("/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u})}).then(()=>reqUI());
}
function reject(u){
fetch("/reject",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u})}).then(()=>reqUI());
}

</script>

</body>
</html>
