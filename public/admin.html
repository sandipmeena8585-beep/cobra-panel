<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA ADMIN</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#1da1c9,#0e7fa3);
color:#fff;
overflow-x:hidden;
}

/* LOGIN */
.login{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.login input,.login button{
width:80%;
max-width:320px;
padding:14px;
margin:8px;
border:none;
border-radius:6px;
}

.login button{
background:#000;
color:#fff;
}

/* 🔥 TOP BAR FIX */
.top{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 16px;
background:rgba(0,0,0,0.25);
position:fixed;
top:0;
left:0;
width:100%;
box-sizing:border-box;
z-index:1000;
backdrop-filter:blur(10px);
}

/* TITLE */
.title{
font-weight:bold;
font-size:16px;
animation:glow 1.5s infinite alternate;
}

/* GLOW */
@keyframes glow{
from{ text-shadow:0 0 5px #fff;}
to{ text-shadow:0 0 15px #00f0ff,0 0 25px #00f0ff;}
}

/* MENU ICON FIX */
.menuIcon{
font-size:22px;
cursor:pointer;
padding:6px 10px;
border-radius:8px;
background:rgba(255,255,255,0.1);
}

/* SIDEBAR */
.sidebar{
position:fixed;
left:-260px;
top:0;
width:240px;
height:100%;
background:#0f172a;
transition:.3s;
padding-top:60px;
z-index:999;
}
.sidebar.active{left:0}

.sidebar div{
padding:12px;
margin:8px;
background:#1e293b;
border-radius:8px;
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
z-index:998;
}
.overlay.active{display:block}

/* CONTENT FIX */
.content{
margin-top:65px;
padding:12px;
}

.card{
background:rgba(255,255,255,0.15);
padding:15px;
margin:10px 0;
border-radius:12px;
backdrop-filter:blur(10px);
}

button{
padding:10px;
border:none;
border-radius:6px;
margin:5px;
}

.green{background:#22c55e}
.red{background:#ef4444}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="login">
<h2>ADMIN LOGIN</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>

<!-- PANEL -->
<div id="panel" style="display:none">

<div class="top">
  <div class="title">COBRA ADMIN</div>
  <div class="menuIcon" onclick="toggleMenu()">☰</div>
</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<div id="sidebar" class="sidebar">
<div onclick="home()">HOME</div>
<div onclick="plansUI()">PLANS</div>
<div onclick="stockUI()">STOCK</div>
<div onclick="settingsUI()">UPI / QR</div>
<div onclick="reqUI()">REQUEST</div>
<div onclick="toggleSystem()">ON/OFF PANEL</div>
<div onclick="logout()">LOGOUT</div>
</div>

<div class="content" id="main"></div>

</div>

<script>

// LOGIN
function login(){
 if(u.value==="COBRA SERVER" && p.value==="SAMI9166"){
  localStorage.setItem("admin","1");
  start();
 }else alert("Wrong");
}

function start(){
 loginBox.style.display="none";
 panel.style.display="block";
 home();
}

if(localStorage.getItem("admin")=="1") start();

function logout(){
 localStorage.removeItem("admin");
 location.reload();
}

// MENU
function toggleMenu(){
 sidebar.classList.toggle("active");
 overlay.classList.toggle("active");
}

function closeMenu(){
 sidebar.classList.remove("active");
 overlay.classList.remove("active");
}

// HOME
function home(){
 main.innerHTML="<h2 style='padding:10px'>LIVE CONTROL RUNNING</h2>";
 closeMenu();
}

</script>

</body>
</html>
