<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA SERVER</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f5f9;
}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:white;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.logo{
  font-weight:bold;
  font-size:20px;
  color:#0f766e;
}

/* CARD */
.card{
  background:white;
  margin:15px;
  padding:20px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* WELCOME */
.welcome{
  background:linear-gradient(135deg,#0f766e,#22c55e);
  color:white;
}

/* ICON */
.icon{
  width:60px;
  height:60px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:25px;
  color:white;
}

.green{background:#22c55e;}
.blue{background:#3b82f6;}
.orange{background:#f59e0b;}

h2{
  margin:10px 0;
}

.small{
  color:#6b7280;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:15px;
  color:#6b7280;
}
</style>

</head>

<body>

<!-- TOP -->
<div class="top">
  <div class="logo">COBRA SERVER</div>
  <div>☰</div>
</div>

<!-- WELCOME -->
<div class="card welcome">
  <h2>Welcome, COBRASERVER!</h2>
  <p>Your account overview and recent activity</p>
  <div class="icon" style="background:rgba(255,255,255,0.2)">👤</div>
</div>

<!-- BALANCE -->
<div class="card">
  <div class="icon green">💰</div>
  <h2>₹999960929</h2>
  <div class="small">Account Balance</div>
</div>

<!-- LEVEL -->
<div class="card">
  <div class="icon blue">🛡️</div>
  <h2>Owner</h2>
  <div class="small">Account Level</div>
</div>

<!-- EXPIRY -->
<div class="card">
  <div class="icon orange">⏰</div>
  <h2 id="date"></h2>
  <div class="small">Panel Expiry Date</div>
</div>

<div class="footer">
  Copyright © 2026 - VIP<br>
  All Rights Reserved
</div>

<script>
// 🔥 Dynamic Date
let d = new Date();
document.getElementById("date").innerText =
  d.toLocaleDateString() + " " + d.toLocaleTimeString();
</script>

</body>
</html>
