<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA PANEL</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#1da1c9,#0e7fa3);
color:#fff;
text-align:center;
}

/* TOP BAR */
.top{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 16px;
background:rgba(0,0,0,0.3);
position:fixed;
top:0;
width:100%;
box-sizing:border-box;
z-index:1000;
}

.title{
font-weight:bold;
animation:glow 1.5s infinite alternate;
}

@keyframes glow{
from{opacity:0.6}
to{opacity:1}
}

.menuIcon{
font-size:22px;
cursor:pointer;
}

/* SIDEBAR */
.sidebar{
position:fixed;
left:-250px;
top:0;
width:240px;
height:100%;
background:#0f172a;
transition:.3s;
padding-top:60px;
z-index:999;
}
.sidebar.active{left:0}

.sidebar div{
padding:12px;
margin:8px;
background:#1e293b;
border-radius:8px;
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
z-index:998;
}
.overlay.active{display:block}

/* CARD */
.card{
background:rgba(255,255,255,0.15);
margin:10px;
padding:15px;
border-radius:12px;
backdrop-filter:blur(10px);
}

button{
padding:10px;
border:none;
border-radius:6px;
background:#22c55e;
color:white;
margin-top:10px;
}

input{
padding:10px;
width:80%;
margin:10px;
border-radius:6px;
border:none;
}

.content{
margin-top:65px;
}

.mono{font-family:monospace}
</style>
</head>

<body>

<!-- TOP -->
<div class="top">
  <div class="title">COBRA PANEL</div>
  <div class="menuIcon" onclick="toggleMenu()">☰</div>
</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<div id="sidebar" class="sidebar">
<div onclick="loadPlans()">HOME</div>
<div onclick="adminUI()">ADMIN</div>
<div onclick="logout()">LOGOUT</div>
</div>

<div class="content" id="main"></div>

<script>

// MENU
function toggleMenu(){
 sidebar.classList.toggle("active");
 overlay.classList.toggle("active");
}
function closeMenu(){
 sidebar.classList.remove("active");
 overlay.classList.remove("active");
}

// ================= SYSTEM CHECK =================
fetch("/status")
.then(r=>r.json())
.then(d=>{
 if(!d.on){
   document.body.innerHTML="<h2>⚠️ PLEASE WAIT ADMIN PANEL UPDATE</h2>";
 }else{
   loadPlans();
 }
});

// ================= CUSTOMER PANEL =================
function loadPlans(){
 fetch("/plans")
 .then(r=>r.json())
 .then(data=>{

  let html="<div class='card'>BGMI</div>";

  data.forEach(p=>{
    let name = p.type==="H" ? p.time+" HOUR" : p.time+" DAY";

    html+=`
    <div class="card">
      ${name} - ₹${p.price}
      <br>
      <button onclick="buy('${p.type}${p.time}','${p.price}')">BUY KEY</button>
    </div>`;
  });

  main.innerHTML=html;
  closeMenu();
 });
}

// ================= BUY =================
function buy(plan,price){

 fetch("/settings")
 .then(r=>r.json())
 .then(s=>{

  main.innerHTML=`
  <div class="card">
    <h3>PAYMENT</h3>
    <p>Pay ₹${price}</p>

    <div class="mono" onclick="copy('${s.upi}')">${s.upi}</div>

    <br>
    <img src="${s.qr}" width="200">

    <br>
    <input id="utr" placeholder="ENTER UTR">
    <button onclick="verify('${plan}')">VERIFY</button>
  </div>`;
 });
}

// COPY
function copy(t){
 navigator.clipboard.writeText(t);
 alert("UPI COPIED");
}

// VERIFY
function verify(plan){

 let u = prompt("Enter Name");
 let utrVal = utr.value;

 if(!utrVal || utrVal.length<6){
   return alert("Invalid UTR");
 }

 fetch("/buy",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
    user:u,
    plan:plan,
    utr:utrVal
  })
 }).then(()=>{
  localStorage.setItem("pending",plan);
  waitScreen();
 });
}

// WAIT
function waitScreen(){
 main.innerHTML=`
 <div class="card">
 <h3>PLEASE WAIT VERIFY ADMIN</h3>
 </div>`;
 checkStatus();
}

// CHECK STATUS
function checkStatus(){
 setInterval(()=>{
 fetch("/history")
 .then(r=>r.json())
 .then(h=>{
   let p = localStorage.getItem("pending");
   let found = h.find(x=>x.plan===p);

   if(found){
     if(found.status==="APPROVED"){
       showKey(found.key,p);
     }else{
       showWarning();
     }
   }
 });
 },3000);
}

// SHOW KEY
function showKey(key,plan){
 localStorage.removeItem("pending");

 main.innerHTML=`
 <div class="card">
 <h3>KEY</h3>
 <div class="mono">${key}</div>
 <button onclick="tg()">TELEGRAM</button>
 </div>`;
}

// WARNING
function showWarning(){
 localStorage.removeItem("pending");
 main.innerHTML=`<div class="card">⚠️ PAYMENT FAILED</div>`;
 setTimeout(loadPlans,3000);
}

// TELEGRAM
function tg(){
 window.open("https://t.me/GODx_COBRA");
}

// ================= ADMIN PANEL =================
function adminUI(){
 main.innerHTML=`
 <div class="card">
 <h3>ADMIN PANEL</h3>
 <button onclick="toggleSystem()">ON/OFF SYSTEM</button>
 </div>`;
 closeMenu();
}

// TOGGLE SYSTEM
function toggleSystem(){
 fetch("/toggle",{method:"POST"})
 .then(r=>r.json())
 .then(d=>alert(d.on?"ON":"OFF"));
}

// LOGOUT
function logout(){
 location.reload();
}

// LOAD PENDING
if(localStorage.getItem("pending")){
 waitScreen();
}

</script>

</body>
</html>
