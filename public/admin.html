<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBRA ADMIN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#020617;
  color:white;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 15px;
}

.menu{
  font-size:22px;
  cursor:pointer;
  display:none;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:-260px;
  width:240px;
  height:100%;
  background:#020617;
  padding:15px;
  transition:0.3s;
  z-index:999;
}
.sidebar.active{left:0;}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:998;
}
.overlay.active{display:block;}

.sideItem{
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  background:#0f172a;
}

/* CONTAINER */
.container{
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:12px;
  text-align:center;
}

.card{
  padding:15px;
  border-radius:15px;
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

/* LOGIN */
.loginBox{
  width:90%;
  max-width:300px;
  margin:90px auto;
  border-radius:20px;
  overflow:hidden;
  background:#020617;
  box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

.loginTop{
  padding:22px;
  background:linear-gradient(135deg,#0f766e,#22c55e);
  font-size:20px;
  font-weight:bold;
}

.loginBody{
  padding:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

input,select{
  width:80%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  background:#0f172a;
  color:white;
  text-align:center;
}

button{
  width:80%;
  padding:11px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  margin-top:10px;
}

.telegram{
  position:fixed;
  bottom:15px;
  right:15px;
  padding:10px 14px;
  background:#0088cc;
  border-radius:10px;
}

.hidden{display:none;}
</style>
</head>

<body>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<div id="sidebar" class="sidebar">
<div class="sideItem" onclick="go('panel')">Home</div>
<div class="sideItem" onclick="go('stockPage')">Stock</div>
<div class="sideItem" onclick="go('requestPage')">Requests</div>
<div class="sideItem" onclick="logout()">Logout</div>
</div>

<div class="topbar">
<span id="menuBtn" class="menu" onclick="toggleMenu()">☰</span>
<b>COBRA ADMIN</b>
</div>

<!-- LOGIN -->
<div id="loginBox" class="loginBox">
<div class="loginTop">Welcome Back</div>

<div class="loginBody">
<input id="user" placeholder="Enter username">
<input id="pass" placeholder="Enter password">
<button onclick="login()">Sign In</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="panel" class="container hidden">
<div class="card">Dashboard</div>
</div>

<!-- STOCK -->
<div id="stockPage" class="container hidden">

<div class="card">STOCK PANEL</div>

<select id="plan">
<option value="1hour">1 Hour</option>
<option value="3hour">3 Hour</option>
<option value="1day">1 Day</option>
<option value="7day">7 Day</option>
</select>

<input id="newkey" placeholder="Enter Key">

<button onclick="addKey()">ADD KEY</button>

<div id="stockList"></div>

</div>

<!-- REQUEST -->
<div id="requestPage" class="container hidden">
<div class="card">REQUESTS</div>
<div id="data"></div>
</div>

<div class="telegram" onclick="window.open('https://t.me/GODx_COBRA')">
📢 Help
</div>

<script>

function toggleMenu(){
  sidebar.classList.add("active");
  overlay.classList.add("active");
}

function closeMenu(){
  sidebar.classList.remove("active");
  overlay.classList.remove("active");
}

function go(p){
  closeMenu();
  panel.classList.add("hidden");
  stockPage.classList.add("hidden");
  requestPage.classList.add("hidden");
  document.getElementById(p).classList.remove("hidden");
}

// LOGIN
async function login(){
  let res = await fetch("/login",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      user:user.value,
      pass:pass.value,
      device:navigator.userAgent
    })
  });

  let d = await res.json();

  if(d.status==="ok"){
    loginBox.classList.add("hidden");
    panel.classList.remove("hidden");
    menuBtn.style.display="block";
  }else{
    alert("Wrong Login");
  }
}

// ADD KEY
async function addKey(){
  await fetch("/admin/addkey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      plan:plan.value,
      key:newkey.value
    })
  });

  newkey.value="";
  loadStock();
}

// LOAD STOCK
async function loadStock(){
  let res = await fetch("/admin/stock");
  let data = await res.json();

  let html="";

  for(let p in data){
    html+=`<div class="card">${p}<br>`;
    data[p].forEach(k=>{
      html+=k+"<br>";
    });
    html+="</div>";
  }

  stockList.innerHTML = html;
}

</script>

</body>
</html>
