<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>COBRA ADMIN</title>

<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Arial;-webkit-tap-highlight-color:transparent}

.login{
display:flex;flex-direction:column;justify-content:center;align-items:center;
height:100vh;background:linear-gradient(135deg,#0f766e,#22c55e);
}
.login input,.login button{
width:80%;max-width:300px;padding:12px;margin:10px;border:none;border-radius:6px;
}
.login button{background:#000;color:#fff}

.top{
display:flex;align-items:center;gap:10px;padding:12px;
background:#020617;position:fixed;width:100%;top:0;z-index:10;
}

.menuIcon{font-size:22px;cursor:pointer;}

.sidebar{
position:fixed;left:-260px;width:250px;height:100%;
background:#1e293b;transition:.25s;padding-top:60px;
z-index:20;
}
.sidebar.active{left:0}

.sidebar div{
padding:14px;margin:10px;background:#334155;border-radius:10px;
}

.overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);display:none;z-index:15;
}
.overlay.active{display:block}

.content{margin-top:60px;padding:10px}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:10px}

button{padding:10px;border:none;border-radius:6px;margin:5px}
.green{background:#22c55e}
.red{background:#ef4444}
.blue{background:#2563eb}
input,select{padding:10px;width:90%;margin:8px;border:none;border-radius:6px}

</style>
</head>

<body>

<div id="loginBox" class="login">
<h2>ADMIN LOGIN</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>

<div id="panel" style="display:none">

<div class="top">
<div class="menuIcon" onclick="toggleMenu()">☰</div>
<div>𝗖𝗢𝗕𝗥𝗔 𝗔𝗗𝗠𝗜𝗡</div>
</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<div id="sidebar" class="sidebar">
<div onclick="home()">HOME</div>
<div onclick="plansUI()">PLANS</div>
<div onclick="stockUI()">STOCK</div>
<div onclick="settingsUI()">UPI / QR / COLOR</div>
<div onclick="reqUI()">REQUEST</div>
<div onclick="panelControlUI()">PANEL CONTROL</div>
<div onclick="themeUI()">THEME</div>
<div onclick="trialUI()">TRIAL</div>
<div onclick="logout()">LOGOUT</div>
</div>

<div class="content" id="main"></div>

</div>

<script>

// LOGIN
function login(){
 if(u.value==="COBRA SERVER" && p.value==="SAMI9166"){
  localStorage.setItem("admin","1");
  start();
 }else alert("Wrong");
}

function start(){
 loginBox.style.display="none";
 panel.style.display="block";
 home();
}

if(localStorage.getItem("admin")=="1") start();

function logout(){
 localStorage.removeItem("admin");
 location.reload();
}

// MENU
function toggleMenu(){
 sidebar.classList.toggle("active");
 overlay.classList.toggle("active");
}
function closeMenu(){
 sidebar.classList.remove("active");
 overlay.classList.remove("active");
}

// HOME
function home(){
 main.innerHTML="<h2>LIVE CONTROL RUNNING</h2>";
 closeMenu();
}

// ================= PANEL CONTROL =================
function panelControlUI(){
 fetch("/status").then(r=>r.json()).then(d=>{
 main.innerHTML=`
 <div class="card">
 <h3>PANEL CONTROL</h3>
 <button onclick="toggleSystem()" class="${d.on?'red':'green'}">
 ${d.on?'TURN OFF':'TURN ON'}
 </button>
 </div>`;
 });
 closeMenu();
}

function toggleSystem(){
 fetch("/toggle",{method:"POST"})
 .then(()=>panelControlUI());
}

// ================= SETTINGS =================
function settingsUI(){
 fetch("/settings").then(r=>r.json()).then(d=>{
 main.innerHTML=`
 <div class="card">

 <h3>UPI</h3>
 <input id="upi" value="${d.upi||""}">

 <h3>Title</h3>
 <input id="title" value="${d.title||""}">

 <h3>Theme</h3>
 <input id="color" type="color" value="${d.color}">
 <input id="textColor" type="color" value="${d.textColor}">

 <button class="green" onclick="saveSettings()">UPDATE</button>

 </div>`;
 });
 closeMenu();
}

function saveSettings(){
 fetch("/settings",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   upi:upi.value,
   title:title.value,
   color:color.value,
   textColor:textColor.value
  })
 }).then(()=>alert("UPDATED ✔"));
}

// ================= THEME =================
function themeUI(){
 main.innerHTML=`
 <div class="card">
 <button onclick="setTheme('#020617','#00ffcc')">COBRA</button>
 <button onclick="setTheme('#0f172a','#ffffff')">DARK</button>
 <button onclick="setTheme('#ffffff','#000000')">LIGHT</button>
 </div>`;
 closeMenu();
}

function setTheme(bg,text){
 fetch("/settings",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({color:bg,textColor:text})
 }).then(()=>alert("THEME ✔"));
}

// ================= PLANS =================
function plansUI(){
 fetch("/plans").then(r=>r.json()).then(data=>{
 let html="";
 data.forEach((x,i)=>{
 html+=`
 <div class="card">
 ${x.time} - ₹${x.price}
 <button onclick="editPlan(${i})">EDIT</button>
 </div>`;
 });

 main.innerHTML=html;
 });
 closeMenu();
}

function editPlan(i){
 let t=prompt("Time");
 let p=prompt("Price");

 fetch("/plans").then(r=>r.json()).then(d=>{
 if(t) d[i].time=t;
 if(p) d[i].price=p;

 fetch("/savePlans",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify(d)
 }).then(()=>plansUI());
 });
}

// ================= STOCK =================
function stockUI(){
 fetch("/stock").then(r=>r.json()).then(s=>{
 main.innerHTML=`
 <div class="card">
 <input id="plan" placeholder="Plan">
 <input id="key" placeholder="Key">
 <button onclick="addStock()">ADD</button>
 </div>`;
 });
 closeMenu();
}

function addStock(){
 fetch("/addStock",{
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({plan:plan.value,key:key.value})
 }).then(()=>alert("ADDED ✔"));
}

// ================= REQUEST =================
function reqUI(){
 fetch("/requests").then(r=>r.json()).then(data=>{
 let html="";
 data.forEach(x=>{
 html+=`
 <div class="card">
 ${x.plan} ₹${x.price}<br>${x.utr}
 <br>
 <button onclick="approve('${x.user}')">YES</button>
 <button onclick="reject('${x.user}')">NO</button>
 </div>`;
 });
 main.innerHTML=html||"NO REQUEST";
 });
 closeMenu();
}

function approve(u){
 fetch("/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u})})
 .then(()=>reqUI());
}

function reject(u){
 fetch("/reject",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u})})
 .then(()=>reqUI());
}

// ================= TRIAL =================
function trialUI(){
 fetch("/trial").then(r=>r.json()).then(t=>{
 main.innerHTML=`
 <div class="card">

 <h3>TRIAL CONTROL</h3>

 <button onclick="toggleTrial()" class="${t.on?'red':'green'}">
 ${t.on?'TURN OFF':'TURN ON'}
 </button>

 <input id="t_title" value="${t.title}">
 <input id="t_key" value="${t.key}">
 <input id="t_kill" value="${t.kill}">
 <input id="t_url" value="${t.telegram}">
 <input id="t_expire" value="${t.expire}">

 <button onclick="saveTrial()" class="blue">UPDATE</button>

 </div>`;
 });
 closeMenu();
}

function toggleTrial(){
 fetch("/trialToggle",{method:"POST"})
 .then(()=>trialUI());
}

function saveTrial(){
 fetch("/trialUpdate",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   title:t_title.value,
   key:t_key.value,
   kill:t_kill.value,
   telegram:t_url.value,
   expire:t_expire.value
  })
 }).then(()=>alert("TRIAL UPDATED ✔"));
}

</script>

</body>
</html>
