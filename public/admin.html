<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COBRA ADMIN</title>

<style>
/* ====== SAME YOUR CSS (UNCHANGED) ====== */
body{margin:0;background:#0f172a;color:#fff;font-family:Arial;}

.login{
display:flex;flex-direction:column;justify-content:center;align-items:center;
height:100vh;background:linear-gradient(135deg,#0f766e,#22c55e);
}
.login input,.login button{
width:80%;max-width:300px;padding:12px;margin:10px;border:none;border-radius:6px;
}
.login button{background:#000;color:#fff}

.top{
display:flex;align-items:center;gap:10px;padding:12px;
background:#020617;position:fixed;width:100%;top:0;
}

.menuIcon{font-size:22px;cursor:pointer;}

.sidebar{
position:fixed;left:-250px;width:250px;height:100%;
background:#1e293b;transition:.3s;padding-top:60px;
}
.sidebar.active{left:0}
.sidebar div{
padding:12px;margin:8px;background:#334155;border-radius:8px;
}

.overlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);display:none;
}
.overlay.active{display:block}

.content{margin-top:60px;padding:10px}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:10px}

button{padding:10px;border:none;border-radius:6px;margin:5px}
.green{background:#22c55e}
.red{background:#ef4444}
.blue{background:#2563eb}

/* POPUP */
.popupOverlay{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.7);
display:flex;justify-content:center;align-items:center;
z-index:999;
}
.popupBox{
background:#020617;
padding:20px;
border-radius:16px;
text-align:center;
box-shadow:0 0 30px #22c55e;
animation:pop .3s ease;
}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}

.tick{
font-size:40px;
color:#22c55e;
}
</style>

</head>
<body>

<div id="loginBox" class="login">
<h2>ADMIN LOGIN</h2>
<input id="u" placeholder="Username">
<input id="p" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>

<div id="panel" style="display:none">

<div class="top">
<div class="menuIcon" onclick="toggleMenu()">☰</div>
<div>𝗖𝗢𝗕𝗥𝗔 𝗔𝗗𝗠𝗜𝗡</div>
</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<div id="sidebar" class="sidebar">
<div onclick="home()">HOME</div>
<div onclick="plansUI()">PLANS</div>
<div onclick="stockUI()">STOCK</div>
<div onclick="settingsUI()">UPI / QR / COLOR</div>
<div onclick="reqUI()">REQUEST</div>
<div onclick="panelControlUI()">PANEL CONTROL</div>
<div onclick="themeUI()">THEME</div>

<!-- 🔥 ADD ONLY THIS LINE -->
<div onclick="trialUI()">TRIAL</div>

<div onclick="logout()">LOGOUT</div>
</div>

<div class="content" id="main"></div>

</div>

<script>

// ===== SAME YOUR CODE (UNCHANGED) =====

// LOGIN
function login(){
 if(u.value==="COBRA SERVER" && p.value==="SAMI9166"){
  localStorage.setItem("admin","1");
  start();
 }else alert("Wrong");
}

function start(){
 loginBox.style.display="none";
 panel.style.display="block";
 home();
}

if(localStorage.getItem("admin")=="1") start();

function logout(){
 localStorage.removeItem("admin");
 location.reload();
}

// MENU
function toggleMenu(){
 sidebar.classList.toggle("active");
 overlay.classList.toggle("active");
}
function closeMenu(){
 sidebar.classList.remove("active");
 overlay.classList.remove("active");
}

// STOP REQUEST LOOP
let reqInt;
function stopReq(){
 if(reqInt){
  clearInterval(reqInt);
  reqInt=null;
 }
}

// HOME
function home(){
 stopReq();
 main.innerHTML="<h2>LIVE CONTROL RUNNING</h2>";
 closeMenu();
}







// ================= 🔥 TRIAL ADD (ONLY ADD) =================
function trialUI(){
 stopReq();

 main.innerHTML=`
 <div class="card">

 <h3>TRIAL CONTROL</h3>

 <label>ON / OFF</label><br>
 <button onclick="toggleTrial(true)" class="green">ON</button>
 <button onclick="toggleTrial(false)" class="red">OFF</button>

 <br><br>

 <input id="tTitle" placeholder="TITLE">
 <input id="tKey" placeholder="KEY">
 <input id="tKill" placeholder="KILL LIMIT">
 <input id="tTg" placeholder="TELEGRAM LINK">

 <textarea id="tUpdates" placeholder="Updates (line by line)" style="width:90%;height:80px;"></textarea>

 <br>
 <button class="blue" onclick="saveTrial()">SAVE</button>

 </div>`;
 closeMenu();
}

function toggleTrial(val){
 fetch("/trialToggle",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({on:val})
 }).then(()=>alert("TRIAL "+(val?"ON":"OFF")));
}

function saveTrial(){
 let updates = tUpdates.value.split("\n").filter(x=>x.trim());

 fetch("/trialSave",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
   title:tTitle.value,
   key:tKey.value,
   kill:tKill.value,
   telegram:tTg.value,
   updates:updates
  })
 }).then(()=>alert("TRIAL UPDATED ✔"));
}
// ================= END =================





// ===== BELOW ALL YOUR ORIGINAL CODE SAME =====

</script>

</body>
</html>
