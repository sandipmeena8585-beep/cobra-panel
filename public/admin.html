<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN</title>

<style>
body{
  margin:0;
  background:#071226;
  color:white;
  font-family:sans-serif;
}

.box{
  max-width:420px;
  margin:auto;
  padding:20px;
  background:#0f1c2e;
  border-radius:20px;
  margin-top:20px;
}

input{
  width:48%;
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:#00f2ff;
  margin:5px;
}

.hidden{display:none;}

.req{
  border:1px solid white;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="box">

<h2>🔐 ADMIN LOGIN</h2>

<input id="user" placeholder="Username">
<input id="pass" placeholder="Password">

<br>

<button onclick="login()">LOGIN</button>

<div id="panel" class="hidden">

<h3>Requests</h3>
<div id="data"></div>

</div>

</div>

<script>

// 🔥 AUTO LOGIN
window.onload = function(){
  if(localStorage.getItem("admin")==="yes"){
    document.getElementById("panel").classList.remove("hidden");
    load();
  }
};

// 🔥 LOGIN FIXED (SMART MATCH)
function login(){

  let u = document.getElementById("user").value.trim().toLowerCase();
  let p = document.getElementById("pass").value.trim();

  // remove spaces
  let cleanU = u.replace(/\s+/g,'');

  if(
    (cleanU === "cobraserver" || u === "cobra server") 
    && p === "SAMI9166"
  ){

    localStorage.setItem("admin","yes");

    document.getElementById("panel").classList.remove("hidden");

    load();

  }else{

    alert("❌ Wrong Login\n\nCheck:\nUsername: COBRA SERVER\nPassword: SAMI9166");
  }
}

// 🔥 LOAD DATA
async function load(){

  let res = await fetch("/admin/data");
  let data = await res.json();

  let html="";

  data.forEach(x=>{

    if(x.status==="pending"){

      html+=`
      <div class="req">

      <b>Plan:</b> ${x.plan}<br>
      <b>UTR:</b> ${x.utr}<br>
      <b>Time:</b> ${new Date(x.time).toLocaleString()}<br>

      ${x.file ? `<img src="${x.file}" width="100">` : ""}

      <br>

      <button onclick="verify(${x.id})">✅ VERIFY</button>
      <button onclick="reject(${x.id})">❌ REJECT</button>

      </div>
      `;
    }

  });

  document.getElementById("data").innerHTML = html;
}

// 🔥 VERIFY
async function verify(id){
  await fetch("/admin/verify/"+id);
  load();
}

// 🔥 REJECT
async function reject(id){
  await fetch("/admin/reject/"+id);
  load();
}

// 🔥 LIVE UPDATE
setInterval(load,3000);

</script>

</body>
</html>
