<script>

// MENU
function openMenu(){
  sidebar.classList.add("active");
  overlay.classList.add("active");
}
function closeMenu(){
  sidebar.classList.remove("active");
  overlay.classList.remove("active");
}

// NAV (🔥 ACTIVE FIX)
function go(p,el){

  document.querySelectorAll(".sideItem").forEach(x=>{
    x.classList.remove("active");
  });

  if(el) el.classList.add("active");

  dashboard.classList.add("hidden");
  stockPage.classList.add("hidden");
  requestPage.classList.add("hidden");

  document.getElementById(p).classList.remove("hidden");

  if(p==="dashboard") loadDashboard();
  if(p==="requestPage") loadRequests();
  if(p==="stockPage") loadStock();

  closeMenu();
}

// LOGIN
async function login(){
  let res=await fetch("/login",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      user:user.value,
      pass:pass.value,
      device:navigator.userAgent
    })
  });

  let d=await res.json();

  if(d.status==="ok"){
    loginWrap.style.display="none";
    dashboard.classList.remove("hidden");
    loadDashboard();
  }else{
    alert("Wrong Login");
  }
}

// DASHBOARD
async function loadDashboard(){

  let res=await fetch("/admin/data");
  let arr=await res.json();

  let sales=0,pending=0,today=0;
  let stats={"1hour":0,"3hour":0,"1day":0,"3day":0,"7day":0};

  let todayDate=new Date().toDateString();

  arr.forEach(x=>{
    if(x.status==="approved"){
      sales++;
      stats[x.plan]++;

      if(new Date(x.id).toDateString()===todayDate){
        today++;
      }
    }
    if(x.status==="pending") pending++;
  });

  totalSales.innerText="Total Sales: "+sales;
  pendingReq.innerText="Pending: "+pending;
  todaySales.innerText="Today Sales: "+today;

  // GRAPH FIX
  let g="";
  for(let p in stats){
    g+=`${p}<div class="bar" style="width:${stats[p]*25}px"></div>`;
  }
  graph.innerHTML=g;

  loadStockCount();
}

// STOCK COUNT
async function loadStockCount(){
  let res=await fetch("/admin/stock");
  let data=await res.json();

  let total=0;
  for(let p in data){
    total+=data[p].length;
  }

  stockCount.innerText="Stock: "+total;
}

// REQUEST (🔥 FULL DETAILS)
async function loadRequests(){

  let res=await fetch("/admin/data");
  let arr=await res.json();

  let html="";

  arr.reverse().forEach(x=>{
    if(x.status==="pending"){

      html+=`
      <div class="card">

      <b>Plan:</b> ${x.plan}<br><br>

      <b>UTR:</b> ${x.utr || "N/A"}<br><br>

      <b>Time:</b> ${x.time || "N/A"}<br><br>

      ${x.file ? `<img src="/uploads/${x.file}" style="width:100%;border-radius:10px;"><br><br>`:""}

      <button onclick="verify(${x.id},this)">✅ YES</button>
      <button onclick="reject(${x.id},this)">❌ NO</button>

      </div>`;
    }
  });

  data.innerHTML = html || "<div class='card'>No Requests</div>";
}

// VERIFY (🔥 HIDE + KEY REMOVE)
async function verify(id,btn){
  btn.parentElement.style.opacity="0";
  setTimeout(()=>btn.parentElement.remove(),200);

  await fetch("/admin/verify/"+id);

  loadDashboard();
  loadStock();
}

// REJECT
async function reject(id,btn){
  btn.parentElement.style.opacity="0";
  setTimeout(()=>btn.parentElement.remove(),200);

  await fetch("/admin/reject/"+id);
}

// STOCK
async function loadStock(){

  let res=await fetch("/admin/stock");
  let data=await res.json();

  let html="";

  for(let p in data){

    html+=`<div class="card"><b>${p}</b><br>`;

    // 🔥 LOW STOCK WARNING
    if(data[p].length < 3){
      html+="⚠ Low Stock<br>";
    }

    if(data[p].length===0){
      html+="No Keys<br>";
    }

    data[p].forEach(k=>{
      html+=`${k}<br>`;
    });

    html+="</div>";
  }

  stockList.innerHTML=html;
}

// ADD KEY
async function addKey(){

  if(!newkey.value.trim()) return;

  await fetch("/admin/addkey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      plan:plan.value,
      key:newkey.value
    })
  });

  newkey.value="";
  loadStock();
  loadStockCount();
}

// AUTO REFRESH (🔥 SAFE)
setInterval(()=>{
  if(!dashboard.classList.contains("hidden")){
    loadDashboard();
  }

  if(!requestPage.classList.contains("hidden")){
    loadRequests();
  }

  if(!stockPage.classList.contains("hidden")){
    loadStock();
  }

},3000);

</script>
