<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body{font-family:sans-serif;margin:0;background:#111;color:#fff}
.hidden{display:none}
.card{background:#222;padding:10px;margin:10px;border-radius:10px}
button{padding:6px 10px;margin:5px;border:none;border-radius:6px;cursor:pointer}
input,select{padding:6px;margin:5px}
</style>

</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <h2>Admin Login</h2>
  <input id="user" placeholder="User"><br>
  <input id="pass" placeholder="Pass"><br>
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
  <h2>Dashboard</h2>

  <div id="totalSales"></div>
  <div id="pendingReq"></div>
  <div id="todaySales"></div>
  <div id="stockCount"></div>

  <hr>

  <!-- TOGGLE -->
  <h3>Customer Panel Control</h3>
  <input type="checkbox" id="customerToggle" onchange="toggleCustomer()">
  <p id="toggleStatus"></p>

  <hr>

  <button onclick="go('stockPage')">Stock</button>
  <button onclick="go('requestPage')">Requests</button>
</div>

<!-- STOCK -->
<div id="stockPage" class="hidden">
  <h2>Stock</h2>

  <select id="plan">
    <option value="1hour">1 Hour</option>
    <option value="3hour">3 Hour</option>
    <option value="1day">1 Day</option>
    <option value="3day">3 Day</option>
    <option value="7day">7 Day</option>
  </select>

  <input id="newkey" placeholder="Enter Key">
  <button onclick="addKey()">Add</button>

  <div id="stockList"></div>

  <button onclick="go('dashboard')">Back</button>
</div>

<!-- REQUEST -->
<div id="requestPage" class="hidden">
  <h2>Requests</h2>

  <div id="data"></div>

  <button onclick="go('dashboard')">Back</button>
</div>

<script>

// ✅ ELEMENT FIX
const dashboard = document.getElementById("dashboard");
const stockPage = document.getElementById("stockPage");
const requestPage = document.getElementById("requestPage");

const toggleStatus = document.getElementById("toggleStatus");
const customerToggle = document.getElementById("customerToggle");

const user = document.getElementById("user");
const pass = document.getElementById("pass");
const loginWrap = document.getElementById("loginWrap");

const totalSales = document.getElementById("totalSales");
const pendingReq = document.getElementById("pendingReq");
const todaySales = document.getElementById("todaySales");
const stockCount = document.getElementById("stockCount");

const stockList = document.getElementById("stockList");
const plan = document.getElementById("plan");
const newkey = document.getElementById("newkey");

const data = document.getElementById("data");

// NAV
function go(p){
dashboard.classList.add("hidden");
stockPage.classList.add("hidden");
requestPage.classList.add("hidden");

document.getElementById(p).classList.remove("hidden");

if(p==="dashboard"){loadDashboard();loadSettings();}
if(p==="stockPage") loadStock();
if(p==="requestPage") loadRequests();
}

// LOGIN
async function login(){
let res=await fetch("/login",{method:"POST",headers:{'Content-Type':'application/json'},
body:JSON.stringify({user:user.value,pass:pass.value,device:navigator.userAgent})});

let d=await res.json();

if(d.status==="ok"){
loginWrap.style.display="none";
go("dashboard");
}else alert("Login failed");
}

// SETTINGS
async function loadSettings(){
toggleStatus.innerText="Please Wait...";

let res=await fetch("/admin/settings");
let s=await res.json();

customerToggle.checked = s.customerEnabled;
toggleStatus.innerText = s.customerEnabled ? "ON" : "OFF";
}

// TOGGLE
async function toggleCustomer(){
toggleStatus.innerText="Please Wait...";

let res=await fetch("/admin/toggleCustomer",{
method:"POST",
headers:{'Content-Type':'application/json'},
body:JSON.stringify({ enabled: customerToggle.checked })
});

let d=await res.json();

customerToggle.checked = d.customerEnabled;
toggleStatus.innerText = d.customerEnabled ? "ON" : "OFF";
}

// DASHBOARD
async function loadDashboard(){
let res=await fetch("/admin/data");
let arr=await res.json();

let sales=0,pending=0,today=0;
let todayDate=new Date().toDateString();

arr.forEach(x=>{
if(x.status==="approved"){
sales++;
if(new Date(x.id).toDateString()===todayDate) today++;
}
if(x.status==="pending") pending++;
});

totalSales.innerText="Total Sales: "+sales;
pendingReq.innerText="Pending: "+pending;
todaySales.innerText="Today: "+today;

loadStockCount();
}

// STOCK COUNT
async function loadStockCount(){
let res=await fetch("/admin/stock");
let data=await res.json();

let total=0;
for(let p in data) total+=data[p].length;

stockCount.innerText="Stock: "+total;
}

// STOCK
async function loadStock(){
let res=await fetch("/admin/stock");
let data=await res.json();

let html="";
for(let p in data){
html+=`<div class="card"><b>${p}</b><br>`;
data[p].forEach(k=>{html+=`${k}<br>`;});
html+="</div>";
}
stockList.innerHTML=html;
}

// ADD KEY
async function addKey(){
await fetch("/admin/addkey",{method:"POST",headers:{'Content-Type':'application/json'},
body:JSON.stringify({plan:plan.value,key:newkey.value})});
newkey.value="";
loadStock();
}

// REQUEST
async function loadRequests(){
let res=await fetch("/admin/data");
let arr=await res.json();

let html="";
arr.reverse().forEach(x=>{
if(x.status==="pending"){
html+=`
<div class="card">
${x.plan}<br>
UTR: ${x.utr}<br>
<button onclick="verify(${x.id},this)">YES</button>
<button onclick="reject(${x.id},this)">NO</button>
</div>`;
}
});
data.innerHTML=html;
}

// VERIFY
async function verify(id,btn){
btn.parentElement.remove();
await fetch("/admin/verify/"+id);
loadDashboard();
}

// REJECT
async function reject(id,btn){
btn.parentElement.remove();
await fetch("/admin/reject/"+id);
}

// AUTO REFRESH
setInterval(()=>{
if(!dashboard.classList.contains("hidden")) loadDashboard();
if(!stockPage.classList.contains("hidden")) loadStock();
if(!requestPage.classList.contains("hidden")) loadRequests();
},3000);

</script>

</body>
</html>
