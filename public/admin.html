<!DOCTYPE html>
<html>
<head>
<title>ADMIN</title>

<style>
body{background:black;color:white;text-align:center;}
.card{background:#111;margin:10px;padding:10px;}
</style>
</head>

<body>

<div id="login">
<h2>Login</h2>
<input id="u"><br>
<input id="p" type="password"><br>
<button onclick="l()">Login</button>
</div>

<div id="panel" style="display:none;">

<h1>ADMIN PANEL</h1>

<select id="plan">
<option value="plan1">Plan1</option>
<option value="plan2">Plan2</option>
<option value="plan3">Plan3</option>
<option value="plan4">Plan4</option>
</select>

<input id="key" placeholder="key">

<button onclick="add()">Add</button>

<h2>Requests</h2>

<div id="r"></div>

</div>

<script>

function l(){
if(u.value=="admin" && p.value=="1234"){
login.style.display="none";
panel.style.display="block";
load();
}else alert("wrong");
}

async function add(){
await fetch("/add-key",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({plan:plan.value,key:key.value})
});
alert("added");
}

async function load(){
let res=await fetch("/requests");
let data=await res.json();

let html="";

data.forEach(x=>{
html+=`
<div class="card">
${x.plan} <br>
${x.utr} <br>
<img src="/uploads/${x.image}" width="100"><br>

<button onclick="v(${x.id})">✔</button>
<button onclick="rj(${x.id})">❌</button>

${x.status} <br>
${x.key||""}
</div>`;
});

document.getElementById("r").innerHTML=html;
}

async function v(id){
await fetch("/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
load();
}

async function rj(id){
await fetch("/reject",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
load();
}

</script>

</body>
</html>
