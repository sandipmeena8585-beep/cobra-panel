<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL</title>

<style>
body{
  margin:0;
  background:#020814;
  color:white;
  font-family:system-ui;
}

/* LOGIN */
.loginBox{
  max-width:320px;
  margin:80px auto;
  padding:20px;
  background:#081426;
  border-radius:18px;
  text-align:center;
  box-shadow:0 0 25px rgba(0,255,255,0.15);
}

.container{
  max-width:420px;
  margin:auto;
  padding:12px;
}

.card{
  background:#081426;
  border-radius:16px;
  padding:12px;
  margin:10px 0;
}

h3{
  text-align:center;
  color:#00f2ff;
}

input,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  background:#0c1d33;
  color:white;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#00f2ff,#007bff);
  color:white;
  margin-top:6px;
}

.req{
  border:1px solid #00f2ff;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
}

.hidden{display:none;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="loginBox">
<h3>🔐 ADMIN LOGIN</h3>
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>

<div id="panel" class="container hidden">

<button onclick="logout()">🚪 LOGOUT</button>

<h3>📊 DASHBOARD</h3>

<div class="card" onclick="openStock()">📦 STOCK PANEL</div>

<div class="card" id="sales">Sales: 0</div>
<div class="card" id="pending">Pending: 0</div>

<h3>📊 ANALYTICS</h3>
<div id="analytics"></div>

<h3>📥 REQUESTS</h3>
<div id="data"></div>

</div>

<!-- STOCK -->
<div id="stockPage" class="container hidden">

<button onclick="back()">⬅ BACK</button>

<h3>📦 STOCK PANEL</h3>

<button onclick="openAvailable()">📦 VIEW ALL KEYS</button>

<select id="plan">
<option value="1hour">1 Hour</option>
<option value="3hour">3 Hour</option>
<option value="1day">1 Day</option>
<option value="3day">3 Day</option>
<option value="7day">7 Day</option>
</select>

<input id="newkey" placeholder="Enter Key">
<button onclick="addKey(event)">ADD KEY</button>

<h3>🔥 TEMP KEYS</h3>
<div id="tempKeys"></div>

<h3>📦 STOCK</h3>
<div id="stockList"></div>

</div>

<!-- FLOOR 4 -->
<div id="availablePage" class="container hidden">

<button onclick="backToStock()">⬅ BACK</button>

<h3>📦 ALL KEYS</h3>
<div id="allKeys"></div>

</div>

<script>

let temp=[];

// 🔥 AUTO LOGIN (1 HOUR)
(function(){
  let t = localStorage.getItem("adminLogin");

  if(t && (Date.now() - t < 60*60*1000)){
    loginBox.style.display="none";
    panel.classList.remove("hidden");
    load();
    loadAnalytics();
  }
})();

// LOGIN
function login(){

  let u=user.value.trim();
  let p=pass.value.trim();

  if(u==="COBRA SERVER" && p==="SAMI9166"){

    localStorage.setItem("adminLogin", Date.now());

    loginBox.style.display="none";
    panel.classList.remove("hidden");

    load();
    loadAnalytics();

  }else{
    alert("❌ Wrong Username or Password");
  }
}

// LOGOUT
function logout(){
  localStorage.removeItem("adminLogin");
  location.reload();
}

// NAV
function openStock(){
  panel.classList.add("hidden");
  stockPage.classList.remove("hidden");
  loadStock();
}

function back(){
  stockPage.classList.add("hidden");
  panel.classList.remove("hidden");
}

function openAvailable(){
  stockPage.classList.add("hidden");
  availablePage.classList.remove("hidden");
  loadAll();
}

function backToStock(){
  availablePage.classList.add("hidden");
  stockPage.classList.remove("hidden");
}

// REQUEST LOAD
async function load(){

  let res=await fetch("/admin/data?"+Date.now());
  let arr=await res.json();

  let html="",sales=0,pending=0;

  arr.forEach(x=>{

    if(x.status==="pending"){
      pending++;

      html+=`
      <div class="req">
      📦 ${x.plan}<br>
      🧾 ${x.utr || "N/A"}<br>
      ⏰ ${x.time || ""}<br>

      ${x.file ? `<img src="/uploads/${x.file}" width="100"><br>`:""}

      <button onclick="verify(${x.id},this)">VERIFY</button>
      <button onclick="reject(${x.id},this)">REJECT</button>
      </div>`;
    }

    if(x.status==="approved") sales++;
  });

  data.innerHTML=html;
  sales.innerText="Sales: "+sales;
  pending.innerText="Pending: "+pending;
}

// ANALYTICS
async function loadAnalytics(){

  let res=await fetch("/admin/data");
  let arr=await res.json();

  let total=0;
  let stats={"1hour":0,"3hour":0,"1day":0,"3day":0,"7day":0};

  arr.forEach(x=>{
    if(x.status==="approved"){
      total++;
      stats[x.plan]++;
    }
  });

  let html=`<div class="card">Total Sales: ${total}</div><div class="card">`;

  for(let p in stats){
    html+=`${p} → ${stats[p]}<br>`;
  }

  html+="</div>";

  analytics.innerHTML=html;
}

// VERIFY
async function verify(id,btn){
  await fetch("/admin/verify/"+id);
  btn.parentElement.style.display="none";
  load();
  loadAnalytics();
}

// REJECT
async function reject(id,btn){
  await fetch("/admin/reject/"+id);
  btn.parentElement.style.display="none";
  load();
}

// STOCK
async function loadStock(){

  let s=await fetch("/admin/stock?"+Date.now());
  let st=await s.json();

  let html="";

  for(let p in st.stock){

    html+=`<div class="card">${p}<br>`;

    st.stock[p].forEach(k=>{
      html+=`${k}<br>
      <button onclick="del('${p}','${k}')">❌</button>`;
    });

    html+="</div>";
  }

  stockList.innerHTML=html;

  let now=Date.now();
  temp=temp.filter(t=>now-t.time<30000);

  let tHTML="";
  temp.forEach(t=>{
    tHTML+=`<div class="card">${t.key}</div>`;
  });

  tempKeys.innerHTML=tHTML;
}

// ADD
async function addKey(e){

  let p=plan.value;
  let k=newkey.value.trim();

  if(!k) return;

  await fetch("/admin/addkey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plan:p,key:k})
  });

  temp.push({key:k,time:Date.now()});

  newkey.value="";
  loadStock();
}

// DELETE
async function del(p,k){
  await fetch("/admin/deletekey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({plan:p,key:k})
  });

  loadStock();
}

// FLOOR 4
async function loadAll(){
  let s=await fetch("/admin/stock");
  let st=await s.json();

  let html="";

  for(let p in st.stock){
    html+=`<div class="card">${p}<br>`;
    st.stock[p].forEach(k=>html+=k+"<br>");
    html+="</div>";
  }

  allKeys.innerHTML=html;
}

// AUTO
setInterval(()=>{
  if(!stockPage.classList.contains("hidden")){
    loadStock();
  }else{
    load();
    loadAnalytics();
  }
},2000);

</script>

</body>
</html>
