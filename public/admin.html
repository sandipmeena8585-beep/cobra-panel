<h2>ADMIN PANEL</h2>

<div id="stats"></div>
<div id="requests"></div>

<script>

function load(){
  fetch("/admin-data")
  .then(res=>res.json())
  .then(data=>{

    // 📊 DASHBOARD
    let html = `
      <h3>📊 Dashboard</h3>
      Total Sales: ${data.totalSales}<br><br>
    `;

    for(let p in data.stock){
      html += `${p} Stock: ${data.stock[p]}<br>`;
    }

    document.getElementById("stats").innerHTML = html;

    // 📥 REQUESTS
    let rhtml = "<h3>Requests</h3>";

    data.requests.forEach(r=>{
      rhtml += `
        <div style="border:1px solid #ccc;margin:10px;padding:10px">
          Plan: ${r.plan}<br>
          UTR: ${r.utr}<br>
          Status: ${r.status}<br>

          ${r.file ? `<img src="/uploads/${r.file}" width="100">` : ""}

          <br>

          <button onclick="verify(${r.id})">✅ Verify</button>
          <button onclick="reject(${r.id})">❌ Reject</button>
        </div>
      `;
    });

    document.getElementById("requests").innerHTML = rhtml;

  });
}

function verify(id){
  fetch("/verify",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id})
  })
  .then(res=>res.json())
  .then(d=>{
    alert("KEY: "+d.key);
    load();
  });
}

function reject(id){
  fetch("/reject",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({id})
  })
  .then(()=>{
    load();
  });
}

load();

</script>
