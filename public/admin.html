<script>

// MENU
function toggleMenu(){
  sidebar.classList.add("active");
  overlay.classList.add("active");
}
function closeMenu(){
  sidebar.classList.remove("active");
  overlay.classList.remove("active");
}

// NAV
function go(p){
  panel.classList.add("hidden");
  stockPage.classList.add("hidden");
  requestPage.classList.add("hidden");
  document.getElementById(p).classList.remove("hidden");

  if(p==="requestPage"){
    loadRequests();
  }
}

// LOGIN
async function login(){
  let res = await fetch("/login",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      user:user.value,
      pass:pass.value,
      device:navigator.userAgent
    })
  });

  let d = await res.json();

  if(d.status==="ok"){
    loginBox.classList.add("hidden");
    panel.classList.remove("hidden");
    menuBtn.style.display="block";

    loadStock();
    loadStockCount();
    loadRequests();
  }else{
    alert("Wrong Login");
  }
}

// 🔥 FULL REQUEST DETAILS
async function loadRequests(){
  let res = await fetch("/admin/data");
  let arr = await res.json();

  let html="";

  arr.reverse().forEach(x=>{
    if(x.status==="pending"){

      html += `
      <div class="card">

        <b>📦 Plan:</b> ${x.plan}<br><br>

        <b>🧾 UTR:</b> ${x.utr || "N/A"}<br><br>

        <b>⏰ Time:</b> ${x.time || "N/A"}<br><br>

        ${x.file ? `
        <b>📸 Screenshot:</b><br>
        <img src="/uploads/${x.file}" style="width:100%;border-radius:10px;margin-top:5px;"><br><br>
        ` : ""}

        <button onclick="verify(${x.id},event)">✅ YES PAYMENT</button>
        <button onclick="reject(${x.id},event)">❌ NO PAYMENT</button>

      </div>`;
    }
  });

  data.innerHTML = html || "<div class='card'>No Requests</div>";
}

// ✅ VERIFY (INSTANT HIDE + KEY REMOVE)
async function verify(id,e){

  let card = e.target.closest(".card");

  card.style.opacity="0";
  setTimeout(()=>card.remove(),200);

  await fetch("/admin/verify/"+id);

  loadStock();
  loadStockCount();
}

// ❌ REJECT (INSTANT HIDE)
async function reject(id,e){

  let card = e.target.closest(".card");

  card.style.opacity="0";
  setTimeout(()=>card.remove(),200);

  await fetch("/admin/reject/"+id);
}

// STOCK
async function loadStock(){
  let res = await fetch("/admin/stock");
  let data = await res.json();

  let html="";

  for(let p in data){
    html += `<div class="card"><b>${p}</b><br>`;

    if(data[p].length===0){
      html += "No Keys<br>";
    }

    data[p].forEach(k=>{
      html += `${k}<br>`;
    });

    html += "</div>";
  }

  stockList.innerHTML = html;
}

// COUNT
async function loadStockCount(){
  let res = await fetch("/admin/stock");
  let data = await res.json();

  let total = 0;
  for(let p in data){
    total += data[p].length;
  }

  stockCount.innerText="Stock: "+total;
}

// ADD KEY
async function addKey(){
  if(!newkey.value.trim()) return;

  await fetch("/admin/addkey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      plan:plan.value,
      key:newkey.value
    })
  });

  newkey.value="";
  loadStock();
  loadStockCount();
}

// AUTO REFRESH
setInterval(()=>{
  loadStock();
  loadStockCount();
  loadRequests();
},3000);

// LOGOUT
function logout(){
  location.reload();
}

</script>
