<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL</title>

<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Arial}
.top{display:flex;justify-content:space-between;padding:12px;background:#020617}
.sidebar{position:fixed;left:-250px;width:250px;height:100%;background:#1e293b;transition:.3s;padding-top:60px}
.sidebar.active{left:0}
.sidebar div{padding:12px;margin:8px;background:#334155;border-radius:8px}
.content{margin-top:60px;padding:10px}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:10px}
button{padding:10px;border:none;border-radius:6px;margin:5px}
.green{background:#22c55e}
.red{background:#ef4444}
</style>
</head>

<body>

<div class="top">
<div onclick="toggleMenu()">☰</div>
<div>COBRA ADMIN</div>
</div>

<div id="sidebar" class="sidebar">
<div onclick="home()">Dashboard</div>
<div onclick="plansUI()">Plans</div>
<div onclick="stockUI()">Stock</div>
<div onclick="settingsUI()">UPI / QR</div>
<div onclick="reqUI()">Requests</div>
<div onclick="toggleSystem()">ON/OFF PANEL</div>
</div>

<div class="content" id="main"></div>

<script>

function toggleMenu(){
 sidebar.classList.toggle("active");
}

// 🔥 DASHBOARD
function home(){
 main.innerHTML="<h2>Admin Dashboard Ready 🔥</h2>";
}

// ================= PLANS =================

function plansUI(){
 fetch("/plans").then(r=>r.json()).then(data=>{
  let html=`
  <div class="card">
  <input id="h" placeholder="Hours">
  <input id="p" placeholder="Price">
  <button onclick="addPlan()">Add</button>
  </div>`;

  data.forEach((x,i)=>{
    html+=`
    <div class="card">
    ${x.hours}h - ₹${x.price}
    <button class="red" onclick="delPlan(${i})">Delete</button>
    </div>`;
  });

  main.innerHTML=html;
 });
}

function addPlan(){
 fetch("/addPlan",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({hours:h.value,price:p.value})
 }).then(plansUI);
}

function delPlan(i){
 fetch("/deletePlan",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({i})
 }).then(plansUI);
}

// ================= STOCK =================

function stockUI(){
 fetch("/stock").then(r=>r.json()).then(data=>{
  let html=`
  <div class="card">
  <input id="k" placeholder="Enter Key">
  <button onclick="addStock()">Add</button>
  </div>`;

  data.forEach((x,i)=>{
    html+=`
    <div class="card">
    ${x}
    <button class="red" onclick="delStock(${i})">Delete</button>
    </div>`;
  });

  main.innerHTML=html;
 });
}

function addStock(){
 fetch("/addStock",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({key:k.value})
 }).then(stockUI);
}

function delStock(i){
 fetch("/deleteStock",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({i})
 }).then(stockUI);
}

// ================= SETTINGS =================

function settingsUI(){
 fetch("/settings").then(r=>r.json()).then(d=>{
  main.innerHTML=`
  <div class="card">
  <input id="upi" value="${d.upi}">
  <input id="qr" value="${d.qr}">
  <button onclick="saveSettings()">Save</button>
  </div>`;
 });
}

function saveSettings(){
 fetch("/settings",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({upi:upi.value,qr:qr.value})
 }).then(()=>alert("Saved"));
}

// ================= REQUEST =================

function reqUI(){
 fetch("/requests").then(r=>r.json()).then(data=>{
  let html="";
  data.forEach(x=>{
    html+=`
    <div class="card">
    ${x.user} - ${x.plan}
    <button class="green" onclick="approve('${x.user}')">Approve</button>
    <button class="red" onclick="reject('${x.user}')">Reject</button>
    </div>`;
  });
  main.innerHTML=html||"No Requests";
 });
}

function approve(u){
 fetch("/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u})}).then(reqUI);
}

function reject(u){
 fetch("/reject",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u})}).then(reqUI);
}

// ================= SYSTEM =================

function toggleSystem(){
 fetch("/toggle",{method:"POST"})
 .then(r=>r.json())
 .then(d=>alert(d.on?"ON":"OFF"));
}

// START
home();

</script>

</body>
</html>
