<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL</title>

<style>
body{
  margin:0;
  background:#030a14;
  color:white;
  font-family:system-ui;
}

.box{
  max-width:420px;
  margin:auto;
  padding:15px;
  background:#081426;
  border-radius:18px;
  margin-top:15px;
}

h2,h3{
  text-align:center;
  color:#00f2ff;
}

input,select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  background:#0c1d33;
  color:white;
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#00f2ff,#007bff);
  width:100%;
  margin-top:5px;
  color:white;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logout{
  background:red;
  padding:6px 10px;
  border-radius:8px;
}

.card{
  background:#0c1d33;
  padding:10px;
  border-radius:10px;
  margin:6px 0;
  text-align:center;
}

.req{
  border:1px solid #00f2ff;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
}

.low{color:red;}
.risk-high{border:2px solid red;}
.risk-medium{border:2px solid yellow;}

.hidden{display:none;}
</style>
</head>

<body>

<div class="box">

<!-- LOGIN -->
<div id="loginBox">
<h2>🔐 ADMIN LOGIN</h2>
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password" type="password">
<button onclick="login()">LOGIN</button>
</div>

<!-- PANEL -->
<div id="panel" class="hidden">

<div class="topbar">
<div>🟢 ADMIN PANEL</div>
<div class="logout" onclick="logout()">LOGOUT</div>
</div>

<h3>📊 Dashboard</h3>
<div class="card" id="sales">Sales: 0</div>
<div class="card" id="pending">Pending: 0</div>

<h3>📦 STOCK</h3>
<div id="stockBox"></div>

<h3>📦 Add Key</h3>

<select id="plan">
<option value="1hour">1 Hour</option>
<option value="3hour">3 Hour</option>
<option value="1day">1 Day</option>
<option value="3day">3 Day</option>
<option value="7day">7 Day</option>
</select>

<input id="newkey" placeholder="Enter Key">
<button onclick="addKey()">ADD KEY</button>

<h3>📥 Requests</h3>
<div id="data"></div>

<h3>📜 History</h3>
<div id="history"></div>

</div>

</div>

<script>

// LOGIN
function login(){
  let u=user.value.trim();
  let p=pass.value.trim();

  if(u==="COBRA SERVER" && p==="SAMI9166"){
    loginBox.style.display="none";
    panel.classList.remove("hidden");
    load();
  }else{
    alert("Wrong Login");
  }
}

// LOGOUT
function logout(){
  location.reload();
}

// 🔥 STABLE LOAD FUNCTION
async function load(){

  try{

    let res = await fetch("/admin/data");
    let data = await res.json();

    let pendingHTML="";
    let historyHTML="";
    let sales=0,pending=0;

    data.forEach(x=>{

      let riskClass="";
      if(x.risk==="high") riskClass="risk-high";
      if(x.risk==="medium") riskClass="risk-medium";

      if(x.status==="pending"){
        pending++;

        pendingHTML+=`
        <div class="req ${riskClass}">
        📦 ${x.plan}<br>
        🧾 ${x.utr}<br>
        ⏰ ${x.time || ""}
        <br>
        🔑 Next Key: <b id="key-${x.id}">...</b>
        <br>
        <button onclick="verify(${x.id})">VERIFY</button>
        <button onclick="reject(${x.id})">REJECT</button>
        </div>`;
      }

      if(x.status==="approved"){
        sales++;
        historyHTML+=`<div class="req">✅ ${x.plan} → ${x.key}</div>`;
      }

      if(x.status==="rejected"){
        historyHTML+=`<div class="req">❌ ${x.plan}</div>`;
      }

    });

    // UPDATE ONLY CONTENT (NO FLICKER)
    data.innerHTML=pendingHTML;
    history.innerHTML=historyHTML;

    sales.innerText="Sales: "+sales;
    pending.innerText="Pending: "+pending;

    // STOCK
    let s = await fetch("/admin/stock");
    let st = await s.json();

    let stockHTML="";
    for(let p in st.stock){
      let val = st.stock[p].length;

      stockHTML+=`
      <div class="card ${val<=2?'low':''}">
      ${p} : ${val} ${val<=2?'⚠ LOW':''}
      </div>`;
    }

    stockBox.innerHTML=stockHTML;

    // KEY PREVIEW
    data.forEach(x=>{
      fetch("/admin/nextkey/"+x.plan)
      .then(r=>r.text())
      .then(k=>{
        let el=document.getElementById("key-"+x.id);
        if(el) el.innerText=k || "No Key";
      });
    });

  }catch(e){
    console.log("error",e);
  }
}

// VERIFY
async function verify(id){
  await fetch("/admin/verify/"+id);
  load();
}

// REJECT
async function reject(id){
  await fetch("/admin/reject/"+id);
  load();
}

// ADD KEY
async function addKey(){
  await fetch("/admin/addkey",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      plan:plan.value,
      key:newkey.value
    })
  });

  alert("Added");
  load();
}

// 🔥 SMOOTH INTERVAL
let running=false;

setInterval(()=>{
  if(!running){
    running=true;
    load().finally(()=>running=false);
  }
},2000);

</script>

</body>
</html>
